<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ритм">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F1EC">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="ritm-ios.css">
<script>window.RITM_APP=true;window.RITM_IOS=true;window.RITM_PAGE='semya'</script>
<script src="ritm-ios.js"></script>
<script src="family.js"></script>
</head>
<body>
<title>Ритм·Семья</title>
<style>
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --sunk:#EFEBE4; --line:#E6E0D6; --ink:#17161A; --muted:#5F5A52; --faint:#8C867C;
  --accent:#E5577F; --accent-ink:#A8264F; --accent-tint:#FBE3EA; --accent-soft:#F2A7BD; --on-accent:#FFFFFF;
  --btn:#17161A; --on-btn:#FFFFFF;
  --dark-card:#17161A; --on-dark:#FFFFFF; --on-dark-muted:#CFCBC4; --dk-eyebrow:#F28BAA; --dk-line:#2E2C30;
  --good:#2F7A4D; --good-tint:#E3F2E8; --on-good:#FFFFFF;
  --warn:#8A5A0B; --warn-tint:#FCEFD2; --warn-ink:#6B4507;
  --bad:#B42318; --bad-tint:#FDE7E4; --on-bad:#FFFFFF;
  --shadow:rgba(23,22,26,.18);
  --c-telo:#F0643C; --c-dengi:#2FA36B; --c-pit:#E0A22E; --c-tseli:#6E63F2;
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-lg:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --card:#1E1C1A; --sunk:#292623; --line:#36322E; --ink:#F2EEE8; --muted:#AFA89E; --faint:#7E776E;
  --accent:#E5577F; --accent-ink:#F28BAA; --accent-tint:#3A1A24; --accent-soft:#8A3552; --on-accent:#FFFFFF;
  --btn:#F2EEE8; --on-btn:#17161A;
  --dark-card:#2B2724; --on-dark:#F2EEE8; --on-dark-muted:#BDB5AA; --dk-eyebrow:#F28BAA; --dk-line:#3E3934;
  --good:#7CCB9A; --good-tint:#1B2C21; --on-good:#0F1F15;
  --warn:#E9B455; --warn-tint:#33280F; --warn-ink:#F2C46A;
  --bad:#FF8A7A; --bad-tint:#3A1C18; --on-bad:#2A0F0B;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121110; --card:#1E1C1A; --sunk:#292623; --line:#36322E; --ink:#F2EEE8; --muted:#AFA89E; --faint:#7E776E;
  --accent:#E5577F; --accent-ink:#F28BAA; --accent-tint:#3A1A24; --accent-soft:#8A3552; --on-accent:#FFFFFF;
  --btn:#F2EEE8; --on-btn:#17161A;
  --dark-card:#2B2724; --on-dark:#F2EEE8; --on-dark-muted:#BDB5AA; --dk-eyebrow:#F28BAA; --dk-line:#3E3934;
  --good:#7CCB9A; --good-tint:#1B2C21; --on-good:#0F1F15;
  --warn:#E9B455; --warn-tint:#33280F; --warn-ink:#F2C46A;
  --bad:#FF8A7A; --bad-tint:#3A1C18; --on-bad:#2A0F0B;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px calc(100px + env(safe-area-inset-bottom,0px))}
.col{display:flex;flex-direction:column;gap:14px}
.col-s{display:flex;flex-direction:column;gap:10px}
.col-xs{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.gap6{gap:6px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top-al{align-items:flex-start}
.grow{flex:1;min-width:0}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.self-start{align-self:flex-start}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.tile{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);padding:0;flex-shrink:0}
.h1{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.15;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.25;margin:0;text-wrap:balance}
.h3{font-size:17px;font-weight:700;margin:0}
.sec-h{font-size:16px;font-weight:700;margin:0}
.lede{margin:0;color:var(--muted);font-size:14px}
.p{margin:0}
.note{margin:0;color:var(--muted);font-size:13px}
.lbl{font-size:13px;color:var(--muted)}
.mut{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dk-eyebrow)}
.eyebrow-l{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.card{background:var(--card);border-radius:var(--r-lg);padding:16px}
.card.dark{background:var(--dark-card);color:var(--on-dark)}
.dk-t{font-size:20px;font-weight:600;margin:0}
.dk-s,.dk-note{margin:0;font-size:14px;color:var(--on-dark-muted)}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.good{background:var(--good-tint);color:var(--good)}
.badge.warn{background:var(--warn-tint);color:var(--warn-ink)}
.badge.bad{background:var(--bad-tint);color:var(--bad)}
.badge.acc{background:var(--accent-tint);color:var(--accent-ink)}
.badge.mut{background:var(--sunk);color:var(--muted)}
.badge.on-dk{background:var(--dk-line);color:var(--on-dark)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid transparent;font-weight:700;font-size:15px;background:none;color:var(--ink);text-align:center}
.btn.pri{background:var(--btn);color:var(--on-btn)}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.sec{border-color:var(--ink);color:var(--ink)}
.btn.sec-dk{border-color:var(--on-dark-muted);color:var(--on-dark)}
.btn.ghost{color:var(--accent-ink);padding:0 10px;min-height:40px;font-weight:600}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.danger-t{color:var(--bad)!important}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.blk{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn:active:not([disabled]){transform:scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent-ink);background:var(--accent-tint);color:var(--accent-ink)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex-shrink:0}
.ready{display:flex;gap:16px;align-items:center}
.ring .rt{fill:none;stroke:var(--sunk);stroke-width:10}
.ring .rv{fill:none;stroke-width:10;stroke-linecap:round;stroke-dashoffset:var(--off)}
.ring.anim .rv{animation:ringIn 1s cubic-bezier(.2,.8,.2,1)}
@keyframes ringIn{from{stroke-dashoffset:var(--full)}}
.ring .rn{font-family:var(--f-display);font-size:28px;font-weight:600;fill:var(--ink)}
.ring .rl{font-size:11px;fill:var(--muted);font-family:var(--f-body)}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--dk-line);align-items:baseline}
.pi:first-child{border-top:none}
.pi-n{font-weight:500;text-align:left;background:none;border:none;padding:0;color:inherit;min-width:0}
.pi-v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.pi-r{grid-column:1/-1;font-size:12px;color:var(--muted)}
.plan-list.lt .pi{border-top-color:var(--line)}
.lnk{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wd-dot{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--on-accent);box-sizing:border-box}
.wd.plan .wd-dot{background:transparent;border:2px dashed var(--accent)}
.wd.done .wd-dot{background:var(--accent);border:none}
.wd.today .wd-l{color:var(--ink);font-weight:700}
.wd.today .wd-dot{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.lg{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-sizing:border-box}
.lg.done{background:var(--accent)} .lg.plan{border:2px dashed var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats.s2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:var(--sunk);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat-v{font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.stat-l{font-size:12px;color:var(--muted)}
.list{background:var(--card);border-radius:var(--r-lg);padding:2px 16px}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 0;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.li:last-child{border-bottom:none}
.li-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li-t{font-weight:600}
.li-s{font-size:13px;color:var(--muted)}
.li-e{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .chev{color:var(--faint);flex-shrink:0}
.grp-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 -6px}
.stp{display:flex;flex-direction:column;gap:6px;min-width:0}
.stp-c{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;background:var(--sunk);border-radius:16px;padding:4px}
.stp-b{width:44px;height:44px;border-radius:12px;border:none;background:var(--card);font-size:22px;font-weight:600;color:var(--accent-ink);padding:0}
.stp-v{width:100%;min-width:0;border:none;background:transparent;text-align:center;font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;color:var(--ink)}
.stp-v:focus{outline:none}
.stp-c:focus-within{box-shadow:0 0 0 2px var(--accent)}
.sets{display:flex;flex-direction:column;gap:6px}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes fadeUp{from{transform:translateY(-4px);opacity:.6}}
.warn-t{color:var(--warn)}
#sheet{position:fixed;inset:0;z-index:30;background:var(--bg)}
.sh{display:flex;flex-direction:column;height:100%}
.sh.enter{animation:shIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes shIn{from{transform:translateY(32px);opacity:.4}}
.sh-in{max-width:480px;margin:0 auto;width:100%}
.sh-head{padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.sh-head .sh-in{display:flex;align-items:center;gap:10px;min-height:44px}
.sh-t{flex:1;min-width:0}
.sh-title{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
.sh-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;border:none;background:none;color:var(--muted);font-size:11px;font-weight:500;border-radius:12px;padding:0}
.tab[aria-current="page"]{color:var(--accent-ink);font-weight:700}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.inp{width:100%;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--accent)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:14px;color:var(--muted)}
.search .inp{padding-left:42px}
.callout{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px;align-items:flex-start}
.callout p{margin:0}
.callout.warn{background:var(--warn-tint);color:var(--warn-ink)}
.callout.acc{background:var(--accent-tint);color:var(--accent-ink)}
.callout.good{background:var(--good-tint);color:var(--good)}
.callout.mut{background:var(--sunk);color:var(--ink)}
.callout .btn.ghost{color:inherit;padding:0;min-height:32px;text-decoration:underline;text-underline-offset:3px}
.confirm{background:var(--bad-tint);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;color:var(--bad);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.c-grid{stroke:var(--line);stroke-width:1}
.c-lbl{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.c-area{fill:var(--accent-tint)}
.c-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.c-pt{fill:var(--card);stroke:var(--accent);stroke-width:2}
.c-guide{stroke:var(--faint);stroke-dasharray:3 3}
.c-tip{fill:var(--ink)}
.c-tipt{fill:var(--bg);font-size:12px;font-weight:700;font-family:var(--f-body)}
.c-hit{fill:transparent;cursor:pointer}
.dchip{display:inline-grid;place-items:center;min-width:36px;height:30px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.dchip.on{background:var(--accent-tint);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(156px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px var(--shadow);animation:fadeUp .2s ease-out}
details.card summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:10px}
details.card[open] summary svg{transform:rotate(90deg)}
.tpl{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:14px;width:100%;color:var(--ink)}
.tpl[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tpl-t{font-weight:700;font-size:16px}
.splash{display:grid;place-items:center;min-height:50vh;color:var(--muted);text-align:center}
.seg2{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--card);border-radius:999px;padding:3px}
.seg2-b{min-height:34px;padding:0 12px;border:none;border-radius:999px;background:none;font-size:13px;font-weight:600;color:var(--muted)}
.seg2-b[aria-checked="true"]{background:var(--accent-tint);color:var(--accent-ink)}
.ta{min-height:120px;padding:12px 14px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical;line-height:1.4}
.ph{display:grid;place-items:center;text-align:center;gap:8px;padding:28px 16px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* Столбики */
.bars{display:flex;gap:6px;align-items:stretch}
.bc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.bc-v{font-size:11px;font-weight:700;color:var(--muted);min-height:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bc-t{width:100%;height:110px;display:flex;align-items:flex-end;background:var(--sunk);border-radius:8px;overflow:hidden}
.bc-t i{display:block;width:100%;background:var(--accent-soft);border-radius:8px 8px 0 0;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.bc.cur .bc-t i{background:var(--accent)} .bc.cur .bc-v,.bc.cur .bc-l{color:var(--accent-ink)}
.bc.dim .bc-t i{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 5px,var(--accent-tint) 5px 10px)}
.bc-l{font-size:11px;min-height:15px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.bars.dense .bc-l{font-size:10px;overflow:visible;text-overflow:clip;max-width:none} .bars.dense .bc-v{font-size:10px}
.bc-s{font-size:10px;color:var(--faint);white-space:nowrap}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.seg2-b[disabled]{opacity:.4}
/* Сегмент во всю ширину */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;background:var(--sunk);border-radius:999px;padding:3px}
.seg-b{min-height:40px;padding:0 8px;border:none;border-radius:999px;background:none;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-b[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.seg.on-card{background:var(--sunk)}
/* Главная карточка-число */
.hero{display:flex;flex-direction:column;gap:10px}
.hero-v{font-family:var(--f-display);font-size:36px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.hero-v.md{font-size:28px}
.hero-v small{font-size:.5em;font-weight:500;color:inherit;opacity:.75;margin-left:4px}
.card.dark .lbl,.card.dark .note{color:var(--on-dark-muted)}
.pbar{position:relative;height:8px;border-radius:4px;background:var(--sunk);overflow:visible}
.card.dark .pbar{background:var(--dk-line)}
.pbar>i{display:block;height:100%;border-radius:4px;background:var(--accent);max-width:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pbar.over>i{background:var(--bad)}
.pbar.good>i{background:var(--good)}

/* ---------- Хранение ----------

let S=null, B={};
const LS_S=()=>'ritm-'+APP.id+'-state-v1', LS_B=()=>'ritm-'+APP.id+'-b-v1';
async function retry(fn){ try{ return await fn(); }catch(e){ if(e&&(e.code==='unavailable'||e.code==='rate_limited')){ await new Promise(r=>setTimeout(r,500+Math.random()*700)); return await fn(); } throw e; } }
function errText(e){ const c=e&&e.code; if(c==='quota_exceeded') return 'Облако заполнено — удалите старые данные или сделайте резервную копию'; if(c==='revoked'||c==='not_granted') return 'Нет доступа к облаку — изменения сохранены на этом устройстве'; return 'Не удалось сохранить в облако — изменения есть на этом устройстве'; }
const Store={

 async init(){

  try{ if(window.claude&&typeof window.claude.use==='function'){ [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]); } }catch(e){}
  let id=null; try{ id=user?await user.id():null; }catch(e){}
  if(!db||!id) return;
  try{
   this.ref=db.doc('data/users/'+id+'/'+APP.id); this.col=this.ref.collection('b');
   const s=await retry(()=>this.ref.get()); const bs=await retry(()=>this.col.limit(1000).get());
   this.mode='db';
   if(s.exists){ S=APP.normalize(clone(s.data())); B={}; bs.docs.forEach(d=>{ B[d.id]=clone(d.data()); }); }
   else if(S.setup){ await this.ref.set(clone(S)); for(const k of Object.keys(B)) await this.col.doc(k).set(clone(B[k])); }
   lsSet(LS_S(),S); lsSet(LS_B(),B); if(APP.onData) APP.onData();
  }catch(e){ this.mode='local'; toast('Облако недоступно — данные сохраняются на этом устройстве'); }
 },

 later(){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(),700); },
 async flush(){ clearTimeout(this.timer); this.timer=null; lsSet(LS_S(),S); lsSet(LS_B(),B); if(this.mode!=='db') { this.dirty.clear(); return; }
  const ks=[...this.dirty]; this.dirty.clear();
  try{ await retry(()=>this.ref.set(clone(S))); for(const k of ks){ if(B[k]) await retry(()=>this.col.doc(k).set(clone(B[k]))); else await retry(()=>this.col.doc(k).delete()); } }catch(e){ ks.forEach(k=>this.dirty.add(k)); toast(errText(e)); } },
 async importAll(st,b){ const old=Object.keys(B); S=APP.normalize(st); B=b&&typeof b==='object'?b:{}; lsSet(LS_S(),S); lsSet(LS_B(),B); if(APP.onData) APP.onData();
  if(this.mode==='db'){ try{ await retry(()=>this.ref.set(clone(S))); for(const k of old) if(!B[k]) await this.col.doc(k).delete(); for(const k of Object.keys(B)) await this.col.doc(k).set(clone(B[k])); }catch(e){ toast(errText(e)); } } },
 async reset(){ const old=Object.keys(B); S=APP.normalize(null); B={}; lsSet(LS_S(),S); lsSet(LS_B(),B); if(APP.onData) APP.onData(); if(this.mode==='db'){ try{ await this.ref.set(clone(S)); for(const k of old) await this.col.doc(k).delete(); }catch(e){ toast(errText(e)); } } }
};
function bucket(k,make){ if(!B[k]&&make) B[k]=make(); return B[k]||null; }

 if(focusId){ const el=document.getElementById(focusId); if(el){ el.focus({preventScroll:true}); if(selS&&el.setSelectionRange) try{ el.setSelectionRange(selS[0],selS[1]); }catch(e){} } }

function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const n=raw/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function lineChart(pts,unit,fmtV=v=>fmt(v)){ if(pts.length<2||pts.every(p=>p.t===pts[0].t)) return '';
 const Wd=340,Ht=170,L=46,R=12,T=16,Bm=24; const xs=pts.map(p=>pkey(p.t).getTime()); const x0=Math.min(...xs),x1=Math.max(...xs);

 const X=t=>x1===x0?L+(Wd-L-R)/2:L+(t-x0)/(x1-x0)*(Wd-L-R); const Y=v=>T+(hi-v)/(hi-lo)*(Ht-T-Bm);

 const P=pts.map((p,i)=>[X(xs[i]),Y(p.v)]); const line=P.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
 const base=Y(lo); const area=line+` L${P[P.length-1][0].toFixed(1)} ${base.toFixed(1)} L${P[0][0].toFixed(1)} ${base.toFixed(1)} Z`;
 const last=P[P.length-1];

/* ============ Ритм·Семья — экраны ============ */
function famTop(){ const st=Fam.status(cur()); return topBar(`<button class="ibtn${st.busy?' spin':''}" data-a="famSync" aria-label="Синхронизировать">${ic('refresh',20)}</button>`); }
/* переключатель семей: несколько семей — чипы, плюс «добавить» */
function famSwitch(){ const L=Fam.list(); const c=cur();
 return `<div class="scroller" role="tablist" aria-label="Семьи">${L.map(f=>`<button class="chip ichip" role="tab" data-a="famCur" data-v="${f.id}" aria-selected="${f.id===c}" aria-pressed="${f.id===c}">${ic('users',14)} ${esc(f.name)}</button>`).join('')}<button class="chip ichip" data-a="addFam" aria-label="Добавить семью">${ic('plus',14)} Семья</button></div>`; }
function noticeCard(){ const n=Fam.notice(); return n?`<div class="callout warn"><p>${esc(n)}. Ваши записи остались у вас как личные.</p><button class="btn ghost sm" data-a="noticeOk" style="color:inherit">Понятно</button></div>`:''; }
function heroCard(){ const M=Fam.members(cur()); const st=Fam.status(cur());
 return `<section class="card dark hero"><span class="eyebrow">Семейный ритм</span><h1 class="h1">${esc(Fam.famName(cur()))}</h1><div class="avs">${M.map(m=>`<span class="av"><b style="background:${esc(m.color)}">${initial(m.name)}</b>${m.me?'Вы':esc(m.name)}</span>`).join('')}</div><span class="sync-l">${st.busy?'Синхронизирую…':st.err?'Не удалось синхронизировать':'Обновлено '+ago(st.at)}</span></section>`; }
function errCard(){ const e=Fam.status(cur()).err; if(!e) return ''; return `<div class="callout warn"><p>${esc(e.msg)}</p><div class="row wrap gap6"><button class="btn sec sm" data-a="famSync">Повторить</button>${e.code==='auth'||e.code==='perm'?`<button class="btn ghost sm" data-a="push" data-s="token" style="color:inherit">Обновить ключ</button>`:''}</div></div>`; }
function head(){ return famTop()+noticeCard()+famSwitch()+errCard(); }
function taskRowF(t,k){ const done=tDone(t,k); const od=!t.rep&&t.date&&t.date<k&&!done; const by=done?doneBy(t.id):null;
 const meta=[whoTag(t),od?`<span class="bad-t b">с ${fmtDay(t.date)}</span>`:'',t.time?ic('clock',12)+' '+esc(t.time):'',t.rep?ic('repeat',12)+' '+(REPN[t.rep.k]||''):'',done&&by?`<span class="ok-t b">${ic('check',12)} ${esc(Fam.name(by))}</span>`:''].filter(Boolean).join('');
 return `<div class="trow${done?' is-done':''}"><button class="chk-hit" data-a="ftTog" data-id="${t.id}" data-k="${k}" aria-pressed="${done}" aria-label="${done?'Снять отметку':'Готово'}: ${esc(t.t)}"><span class="chk${done?' on':''}">${ic('check',18)}</span></button><button class="tmain" data-a="ftEdit" data-id="${t.id}"><span class="tt">${esc(t.t)}</span><span class="tmeta">${meta}</span></button></div>`; }
function addTaskRow(){ return `<div class="addrow"><input class="inp sm" id="ftIn" type="text" placeholder="Задача для семьи на сегодня" maxlength="120" data-enter="ftAdd" enterkeyhint="done" autocomplete="off"><button class="ibtn acc" data-a="ftAdd" aria-label="Добавить задачу">${ic('plus',20)}</button></div>`; }
function shopRowF(x,small){ return `<div class="shrow"><button class="chk-hit" data-a="fsTog" data-id="${x.id}" aria-pressed="${!!x.done}" aria-label="Куплено: ${esc(x.n)}"><span class="chk${x.done?' on':''}">${ic('check',18)}</span></button><span class="grow"><span class="${x.done?'done-t':''}">${esc(x.n)}${x.qty?` <span class="mut">· ${esc(x.qty)}</span>`:''}</span>${x.fa?`<span>${Fam.tag(x.fa)}</span>`:''}</span>${small?'':`<button class="ibtn sm ghostb" data-a="fsDel" data-id="${x.id}" aria-label="Убрать из списка">${ic('close',16)}</button>`}</div>`; }
function weekCard(){ const M=Fam.members(cur()); const W=weekKeys(); const t=dkey(); const rows=M.map(m=>{ const days=bodyOf(m.id); const n=days?W.filter(k=>days[k]).reduce((s,k)=>s+days[k].n,0):0;
  return `<span class="row" style="gap:8px;min-width:0">${avatar(m)}<span class="col-xs" style="min-width:0"><span class="b">${m.me?'Вы':esc(m.name)}</span><span class="note">${days?pl(n,['тренировка','тренировки','тренировок']):'не делится'}</span></span></span><span class="wk" style="--mc:${esc(m.color)}">${W.map(k=>`<i class="${days&&days[k]?'on':''}${k===t?' today':''}" title="${fmtDay(k)}${days&&days[k]?': '+esc((days[k].t||[]).join(', ')||'тренировка'):''}"></i>`).join('')}</span>`; }).join('');
 return `<section class="card col-s"><div class="between"><h2 class="sec-h">Тренировки на неделе</h2><span class="wk-h" aria-hidden="true">${WD2.map(d=>`<span>${d.charAt(0)}</span>`).join('')}</span></div><div class="week">${rows}</div></section>`; }
function pitOffCard(){ const p=Fam.pitFam(); return `<div class="card col-s"><p class="p">${p?`Покупки и продукты дома сейчас общие с семьёй «${esc(Fam.famName(p))}».`:'Покупки и продукты дома пока не общие ни с одной семьёй.'}</p><button class="btn sec sm self-start" data-a="famPit" data-v="${cur()}">Сделать общими с «${esc(Fam.famName(cur()))}»</button><p class="note">Список покупок и холодильник бывают общими только с одной семьёй — с теми, с кем вы живёте.</p></div>`; }

VIEWS.today=()=>wrap(todayV());
function todayV(){ if(!hasFam()) return famTop()+noticeCard()+`<div class="card">${empty('users','Создайте семью или присоединитесь по приглашению.','<button class="btn pri" data-a="obStart">Начать</button>')}</div>`;
 const k=dkey(); let h=head()+heroCard();
 const L=todayTasks(); const open=L.filter(t=>!tDone(t,k));
 h+=`<section class="col-s"><div class="between"><h2 class="sec-h">Дела семьи сегодня</h2>${L.length?`<span class="note">${L.length-open.length} из ${L.length}</span>`:''}</div>${L.length?`<div class="tlist">${L.map(t=>taskRowF(t,k)).join('')}</div>`:'<p class="note">Семейных дел на сегодня нет. Добавьте здесь или отметьте задачу в Ритм·Цели.</p>'}${addTaskRow()}</section>`;
 const later=laterTasks().slice(0,4); if(later.length) h+=`<section class="col-s"><h2 class="sec-h">Скоро</h2><div class="tlist">${later.map(t=>`<div class="trow"><button class="tmain" data-a="ftEdit" data-id="${t.id}"><span class="tt">${esc(t.t)}</span><span class="tmeta">${whoTag(t)}<span>${t.date?relDay(t.date):'без даты'}</span></span></button></div>`).join('')}</div></section>`;
 if(isPit()){ const sh=shopList(); const need=sh.filter(x=>!x.done);
  h+=`<section class="card col-s"><div class="between"><h2 class="sec-h">${ic('cart',18)} Купить</h2><button class="btn ghost sm" data-a="tab" data-t="shop">${need.length?'Весь список':'Открыть'}</button></div>${need.length?`<div class="col-xs">${need.slice(0,5).map(x=>shopRowF(x,true)).join('')}</div>${need.length>5?`<p class="note">и ещё ${need.length-5}</p>`:''}`:'<p class="note">Список покупок пуст.</p>'}</section>`;
  const exp=homeList().filter(it=>{ const n=expLeft(it); return n!=null&&n<=2; }).sort((a,b)=>a.exp<b.exp?-1:1);
  if(exp.length) h+=`<section class="card col-s"><h2 class="sec-h">Скоро испортится</h2>${exp.slice(0,5).map(it=>`<div class="between"><span>${esc(it.n)}${it.fa?' '+Fam.tag(it.fa):''}</span><span class="note">${expText(it)}</span></div>`).join('')}<p class="note">Рецепты из этих продуктов — в Ритм·Питание.</p></section>`; }
 const pays=famPays().filter(p=>p.on&&dBetween(k,p.next)<=7).sort((a,b)=>a.next<b.next?-1:1);
 if(pays.length) h+=`<section class="card col-s"><h2 class="sec-h">Платежи семьи на неделе</h2>${pays.map(p=>`<div class="between"><span class="col-xs"><span class="b">${esc(p.n)}</span><span class="note">${p.next<k?`<span class="bad-t b">просрочен с ${fmtDay(p.next)}</span>`:p.next===k?'сегодня':relDay(p.next)}</span></span><span class="b">${money(p.sum)}</span></div>`).join('')}<button class="btn sec sm self-start" data-a="openApp" data-v="dengi">Отметить оплату в Деньгах</button></section>`;
 h+=weekCard();
 return h; }

VIEWS.shop=()=>wrap(shopV());
function shopV(){ if(!hasFam()) return todayV(); let h=head();
 if(!isPit()) return h+pitOffCard();
 const sh=shopList(); const need=sh.filter(x=>!x.done), done=sh.filter(x=>x.done);
 h+=`<section class="card col-s"><div class="between"><h2 class="sec-h">${ic('cart',18)} Купить</h2>${sh.length?`<span class="note">${need.length} из ${sh.length}</span>`:''}</div><div class="addrow"><input class="inp sm" id="fsIn" type="text" placeholder="Добавить в список" maxlength="40" data-enter="fsAdd" enterkeyhint="done" autocomplete="off"><button class="ibtn acc" data-a="fsAdd" aria-label="Добавить">${ic('plus',20)}</button></div>${sh.length?`<div class="col-xs">${need.concat(done).map(x=>shopRowF(x)).join('')}</div>`:'<p class="note">Список пуст. Добавляйте сюда или в Ритм·Питание — список общий для семьи.</p>'}${done.length?`<div class="row wrap gap6"><button class="btn sec sm" data-a="fsClear">Убрать купленное (${done.length})</button><button class="btn ghost sm" data-a="openApp" data-v="pit">Разложить дома — в Питании</button></div>`:''}<p class="note">${ic('lock',12)} Покупки «только мне» из Ритм·Питание сюда не попадают.</p></section>`;
 const H=homeList(); const by={}; for(const it of H) (by[it.place||'fridge']=by[it.place||'fridge']||[]).push(it);
 h+=`<section class="card col-s"><div class="between"><h2 class="sec-h">Дома</h2><span class="note">${pl(H.length,['продукт','продукта','продуктов'])}</span></div>${H.length?Object.keys(PLACES).filter(p=>by[p]).map(p=>`<div class="col-xs"><span class="lbl">${PLACES[p]}</span>${by[p].sort((a,b)=>(a.exp||'9')<(b.exp||'9')?-1:1).map(it=>`<div class="between" style="min-height:36px"><span>${esc(it.n)} <span class="mut">${qtyT(it)}</span>${it.fa?' '+Fam.tag(it.fa):''}</span><span class="note">${expText(it)}</span></div>`).join('')}</div>`).join(''):'<p class="note">Продукты дома ведутся в Ритм·Питание — их видит семья.</p>'}</section>`;
 return h; }

/* Вы: личное и семейное — по своим тратам из Ритм·Деньги */
function myCompare(r){ const ops=myOps(r.from,r.to); if(!ops.length) return ''; const L=Fam.list(); const C=myCats(); const cn=id=>{ const c=C.find(x=>x.id===id); return c?c.n:'Другое'; };
 const parts=[{id:null,n:'Личное',c:'var(--muted)'},...L.map((f,i)=>({id:f.id,n:f.name,c:['#E5577F','#2B8CC4','#E0A22E'][i%3]}))];
 for(const p of parts) p.v=sum(ops.filter(o=>(Fam.scopeOf(o)||null)===p.id),o=>o.sum); const tot=sum(parts,p=>p.v)||1; const P=parts.filter(p=>p.v);
 const byC={}; for(const o of ops){ const r2=byC[o.cat]||(byC[o.cat]={me:0,fam:0}); if(Fam.scopeOf(o)===cur()) r2.fam+=o.sum; else if(!Fam.scopeOf(o)) r2.me+=o.sum; }
 const rows=Object.entries(byC).filter(([,x])=>x.me&&x.fam||x.fam).sort((a,b)=>(b[1].me+b[1].fam)-(a[1].me+a[1].fam)).slice(0,6);
 return `<section class="card col-s"><h2 class="sec-h">Вы: личное и семейное</h2><p class="note">Ваши траты в ${r.name} из Ритм·Деньги. Личное видите только вы.</p><div class="mbar2">${P.map(p=>`<i style="width:${(p.v/tot*100).toFixed(1)}%;background:${p.c}"></i>`).join('')}</div>${P.map(p=>`<div class="between"><span class="row" style="gap:8px"><i class="dot" style="background:${p.c}"></i>${esc(p.n)}</span><span class="b">${money(p.v)} <span class="mut">· ${Math.round(p.v/tot*100)}%</span></span></div>`).join('')}${rows.length?`<span class="lbl">По категориям: личное / «${esc(Fam.famName(cur()))}»</span>${rows.map(([c,x])=>`<div class="between"><span>${esc(cn(c))}</span><span class="note">${money(x.me)} / ${money(x.fam)}</span></div>`).join('')}`:''}</section>`; }

VIEWS.money=()=>wrap(moneyV());
function moneyV(){ if(!hasFam()) return todayV(); let h=head(); const off=ui.mOff||0; const r=monthRange(off); const ops=famOps(r.from,r.to); const total=sum(ops,o=>o.sum); const bud=Fam.budget(cur());
 h+=`<div class="chips">${[[0,'Этот месяц'],[-1,'Прошлый']].map(([v,l])=>`<button class="chip" data-a="mOff" data-v="${v}" aria-pressed="${off===v}">${l}</button>`).join('')}</div>`;
 h+=`<section class="card dark hero"><span class="eyebrow">${esc(Fam.famName(cur()))} потратила в ${r.name}</span><span class="h1">${money(total)}</span>${bud?`${pbar(total/bud,total>bud?'bad':'')}<span class="sync-l">${total>bud?'Перерасход '+money(total-bud):'Осталось '+money(bud-total)} из ${money(bud)}</span>`:''}<button class="btn sec-dk sm self-start" data-a="push" data-s="budget">${ic('edit',16)} ${bud?'Изменить бюджет семьи':'Задать бюджет семьи'}</button></section>`;
 if(!ops.length) h+=`<div class="card">${empty('wallet','Здесь — траты, отмеченные для этой семьи в Ритм·Деньги у каждого участника: продукты, дом, дети, отпуск.','<button class="btn sec" data-a="openApp" data-v="dengi">Открыть Деньги</button>')}</div>`;
 else { const M=Fam.members(cur()); const byM={}; for(const o of ops) byM[o.by]=(byM[o.by]||0)+o.sum; const mx=Math.max(1,...Object.values(byM));
  h+=`<section class="card col-s"><h2 class="sec-h">Кто сколько</h2>${Object.entries(byM).sort((a,b)=>b[1]-a[1]).map(([id,v])=>{ const m=M.find(x=>x.id===id)||{name:Fam.name(id),color:Fam.color(id)}; return `<div class="col-xs"><div class="between"><span class="row" style="gap:8px">${avatar(m)}<span class="b">${m.me?'Вы':esc(m.name)}</span></span><span class="b">${money(v)} <span class="mut">· ${Math.round(v/total*100)}%</span></span></div><div class="mbar"><i style="width:${(v/mx*100).toFixed(1)}%;background:${esc(m.color)}"></i></div></div>`; }).join('')}</section>`;
  const byC={}; for(const o of ops){ const c=byC[o.cn]||(byC[o.cn]={n:o.cn,v:0}); c.v+=o.sum; } const C=Object.values(byC).sort((a,b)=>b.v-a.v); const cx=Math.max(1,...C.map(c=>c.v));
  h+=`<section class="card col-s"><h2 class="sec-h">На что</h2>${C.slice(0,8).map((c,i)=>`<div class="col-xs"><div class="between"><span>${esc(c.n)}</span><span class="b">${money(c.v)}</span></div><div class="mbar"><i style="width:${(c.v/cx*100).toFixed(1)}%;background:${PALETTE[i%PALETTE.length]}"></i></div></div>`).join('')}</section>`; }
 h+=myCompare(r);
 if(ops.length) h+=`<section class="col-s"><h2 class="sec-h">Последние траты семьи</h2><div class="list">${ops.slice(0,15).map(o=>`<div class="li"><span class="li-m"><span class="li-t">${esc(o.cn)}</span><span class="li-s">${fmtDay(o.date)}${o.note?' · '+esc(o.note):''}</span><span>${Fam.tag(o.by)}</span></span><span class="li-e">${money(-o.sum)}</span></div>`).join('')}</div></section>`;
 const P=famPays().sort((a,b)=>a.next<b.next?-1:1);
 h+=`<section class="col-s"><h2 class="sec-h">Платежи семьи</h2>${P.length?`<div class="list">${P.map(p=>`<div class="li"><span class="li-m"><span class="li-t">${esc(p.n)}${p.on?'':' <span class="mut">· на паузе</span>'}</span><span class="li-s">${p.next<dkey()?`<span class="bad-t b">просрочен с ${fmtDay(p.next)}</span>`:'следующий '+relDay(p.next).toLowerCase()}</span>${p.fa?`<span>${Fam.tag(p.fa)}</span>`:''}</span><span class="li-e">${money(p.sum)}</span></div>`).join('')}</div>`:'<p class="note">Отметьте платёж для этой семьи в Ритм·Деньги (аренда, коммуналка, садик) — он появится у всех, и оплатить сможет любой.</p>'}</section>`;
 return h; }

VIEWS.fam=()=>wrap(famV());
function famV(){ if(!hasFam()) return todayV(); const fid=cur(); const f=Fam.fam(fid); const st=Fam.status(fid); const M=Fam.members(fid); const adm=Fam.isAdmin(fid); const G=Fam.groups(fid); let h=head();
 h+=`<section class="col-s"><div class="between"><h2 class="sec-h">${esc(Fam.famName(fid))}</h2>${adm?`<button class="btn ghost sm" data-a="push" data-s="famName">${ic('edit',14)} Название</button>`:''}</div><p class="note">${pl(M.length,['участник','участника','участников'])}${adm?' · вы владелец':''}</p>
  <div class="list">${M.map(m=>`<button class="mrow li" data-a="push" data-s="member" data-id="${m.id}">${avatar(m,'lg')}<span class="grow col-xs"><span class="b">${esc(m.name)}${m.me?' <span class="mut">· вы</span>':''}</span><span class="note">${[m.role==='admin'?'владелец':'',m.group?esc(groupName(m.group)):'',m.me?'обновлено '+ago(st.at):'обновлял(а) '+ago(m.at)].filter(Boolean).join(' · ')}</span></span><span class="chev">${ic('right',18)}</span></button>`).join('')}</div></section>`;
 h+=`<section class="card col-s"><div class="between"><h2 class="sec-h">Группы</h2>${adm?`<button class="btn ghost sm" data-a="push" data-s="groups">${G.length?'Изменить':'Создать'}</button>`:''}</div>${G.length?`<div class="col-xs">${G.map(g=>{ const ms=M.filter(m=>m.group===g.id); return `<div class="between"><span class="b">${esc(g.name)}</span><span class="note">${ms.length?ms.map(m=>m.me?'вы':esc(m.name)).join(', '):'пусто'}</span></div>`; }).join('')}</div><p class="note">Задачу можно поручить целой группе — она появится у каждого в группе.</p>`:`<p class="note">${adm?'Соберите участников в группы — например, «Взрослые» и «Дети» — чтобы поручать дела сразу группе.':'Группы создаёт владелец семьи.'}</p>`}</section>`;
 h+=`<section class="card col-s"><h2 class="sec-h">Пригласить в семью</h2><p class="p">Отправьте приглашение. Его вставляют в Ритм·Семья → «+ Семья» → «У меня есть приглашение» — на Android или iPhone.</p><div class="code" aria-label="Приглашение">${esc(Fam.invite(fid).slice(0,90))}…</div><div class="split"><button class="btn pri" data-a="invShare">${ic('share',16)} Отправить</button><button class="btn sec" data-a="invCopy">${ic('copy',16)} Скопировать</button></div><p class="note">${ic('lock',13)} В приглашении ключ доступа и ключ шифрования. Отправляйте только своим и удалите сообщение, когда его вставят.</p></section>`;
 h+=`<section class="card col-s"><h2 class="sec-h">Что видит эта семья</h2><div class="chips"><button class="chip" data-a="famPit" data-v="${isPit()?'':fid}" aria-pressed="${isPit()}">Покупки и продукты дома</button><button class="chip" data-a="famBody" aria-pressed="${Fam.shareBody(fid)}">Мои тренировки</button></div><p class="note">Покупки и холодильник бывают общими только с одной семьёй. Задачи, траты и платежи уходят в семью только с её отметкой — в Целях и Деньгах. Остальное остаётся личным.</p></section>`;
 h+=`<section class="card col-s"><h2 class="sec-h">Вы</h2><label class="fld"><span class="lbl">Имя</span><input class="inp" id="meName" type="text" value="${esc(f.mname)}" maxlength="24" data-c="meName"></label><span class="lbl">Цвет</span><div class="colors">${Fam.COLORS.map(([col,n])=>`<button class="cdot" style="background:${col}" data-a="meColor" data-v="${col}" aria-pressed="${f.color===col}" aria-label="${n}"></button>`).join('')}</div><p class="note">Имя и цвет одинаковые во всех ваших семьях.</p></section>`;
 h+=`<section class="card col-s"><h2 class="sec-h">Синхронизация</h2><p class="p">Данные семьи лежат в закрытом репозитории <b>${esc(f.repo)}</b>${f.dir!=='family'?` (папка ${esc(f.dir)})`:''} на GitHub и зашифрованы на телефоне — без ключа из приглашения их не прочитать.</p><p class="note">${st.err?esc(st.err.msg):'Последняя синхронизация: '+ago(st.at)}</p><div class="row wrap gap6"><button class="btn sec sm" data-a="famSync">${ic('refresh',16)} Синхронизировать</button><button class="btn ghost sm" data-a="push" data-s="token">${ic('key',16)} Обновить ключ доступа</button></div></section>`;
 h+=ui.confirm==='leave'?confirmBox(`Выйти из семьи «${esc(Fam.famName(fid))}»? Ваши задачи и платежи этой семьи останутся у вас как личные, а у семьи пропадут ваши траты и тренировки.`,'famLeave','Выйти'):`<button class="btn ghost danger-t self-start" data-a="ask" data-v="leave">${ic('logout',16)} Выйти из семьи</button>`;
 return h; }
function wrap(h){ return `<div class="col">${h}</div>`; }

/* ============ Ритм·Семья — листы ============ */
const TOKEN_URL='https://github.com/settings/personal-access-tokens/new';
const NEWREPO_URL='https://github.com/new';
function colorPick(act,cur){ return `<div class="colors">${Fam.COLORS.map(([col,n])=>`<button class="cdot" style="background:${col}" data-a="${act}" data-v="${col}" aria-pressed="${cur===col}" aria-label="${n}"></button>`).join('')}</div>`; }
function obErr(){ const o=ui.ob; return o&&o.err?`<div class="callout warn"><p>${esc(o.err)}</p></div>`:''; }
function obBusyBtn(act,label){ const o=ui.ob; return `<button class="btn pri blk" data-a="${act}"${o.busy?' disabled':''}>${o.busy?'Проверяю…':label}</button>`; }

function newOb(add){ const f=add?Fam.fam():null; return {step:'intro',add:!!add,name:f?f.mname:'',color:f?f.color:Fam.COLORS[0][0],family:'',repo:f?f.repo:'',token:'',same:!!f,invite:'',err:'',busy:false}; }
SH.onboard=()=>famFlow(false);
SH.addFam=()=>famFlow(true);
function famFlow(add){ const o=ui.ob||(ui.ob=newOb(add)); let b='',foot='',title=add?'Добавить семью':'Семейный ритм';
 if(o.step==='intro'){
  b=`<div class="col-xs"><span class="eyebrow-l">Ритм для всей семьи</span><h1 class="h1">Общие покупки, дела и траты</h1></div><p class="p">Каждый ведёт свой Ритм на своём телефоне — Android или iPhone. Общее приходит ко всем само при открытии приложения, где бы вы ни были.</p>
  <div class="intro-g"><div><b>Покупки и холодильник</b><span>Купил один — у другого вычеркнулось</span></div><div><b>Дела семьи</b><span>Кто что делает и что уже сделано</span></div><div><b>Семейный бюджет</b><span>Общие траты, платежи и кто сколько</span></div><div><b>Тренировки</b><span>Кто тренировался на неделе</span></div></div>
  <div class="callout mut"><p>${ic('lock',14)} Личное остаётся личным: в семью уходит только то, что отмечено «Для семьи». Данные хранятся в вашем закрытом репозитории на GitHub и шифруются прямо на телефоне.</p></div>`;
  if(add) b=`<div class="col-xs"><span class="eyebrow-l">Ещё одна семья</span><h1 class="h1">Создать или войти по приглашению</h1></div><p class="p">Например, семья с родителями или с братьями и сёстрами. У каждой семьи свои участники, дела, траты и бюджет; переключаться — вверху Ритм·Семья.</p>`;
  foot=`<button class="btn pri blk" data-a="obGo" data-v="create1">Создать семью</button><button class="btn sec blk" data-a="obGo" data-v="join">У меня есть приглашение</button>`; }
 else if(o.step==='create1'){ title='Новая семья';
  b=`<div class="col-xs"><span class="eyebrow-l">Шаг 1 из 2</span><h1 class="h1">Кто вы в семье</h1></div><label class="fld"><span class="lbl">Ваше имя</span><input class="inp" id="obName" type="text" value="${esc(o.name)}" placeholder="Например, Faisal" maxlength="24" data-i="ob" data-k="name"></label><span class="lbl">Ваш цвет</span>${colorPick('obColor',o.color)}<label class="fld"><span class="lbl">Название семьи</span><input class="inp" id="obFam" type="text" value="${esc(o.family)}" placeholder="Например, Семья Абдулла" maxlength="40" data-i="ob" data-k="family"></label>`;
  foot=`<div class="split"><button class="btn sec" data-a="obGo" data-v="intro">Назад</button><button class="btn pri" data-a="obGo" data-v="create2">Дальше</button></div>`; }
 else if(o.step==='create2'){ title='Новая семья';
  const prev=add?Fam.fam():null;
  if(prev&&o.same){ b=`<div class="col-xs"><span class="eyebrow-l">Шаг 2 из 2</span><h1 class="h1">Где хранить данные семьи</h1></div><div class="chips"><button class="chip" data-a="obSame" data-v="1" aria-pressed="true">Там же, где «${esc(Fam.famName(prev.id))}»</button><button class="chip" data-a="obSame" data-v="" aria-pressed="false">Отдельный репозиторий</button></div><p class="p">Данные новой семьи лягут в отдельную папку репозитория <b>${esc(prev.repo)}</b> со своим ключом шифрования. Новый ключ GitHub не нужен.</p><p class="note">${ic('lock',13)} Участники новой семьи не смогут прочитать данные «${esc(Fam.famName(prev.id))}», но ключ доступа у вас будет общий. Для полной раздельности выберите отдельный репозиторий.</p>${obErr()}`;
   foot=`<div class="split"><button class="btn sec" data-a="obGo" data-v="create1"${o.busy?' disabled':''}>Назад</button>${obBusyBtn('obCreate','Создать семью')}</div>`; return sheet({title,left:add?'close':'',body:b,foot}); }
  b=`<div class="col-xs"><span class="eyebrow-l">Шаг 2 из 2</span><h1 class="h1">Где хранить данные семьи</h1></div>${prev?`<div class="chips"><button class="chip" data-a="obSame" data-v="1" aria-pressed="false">Там же, где «${esc(Fam.famName(prev.id))}»</button><button class="chip" data-a="obSame" data-v="" aria-pressed="true">Отдельный репозиторий</button></div>`:''}<p class="p">Нужен закрытый репозиторий на GitHub и ключ доступа к нему. Это делается один раз, на компьютере или в браузере телефона.</p>
  <ol class="steps-n"><li>Создайте <b>закрытый</b> репозиторий: имя <code>ritm-family</code>, видимость <b>Private</b>. <button class="btn ghost sm" data-a="obUrl" data-v="repo" style="padding:0">${ic('link',14)} github.com/new</button></li>
  <li>Создайте ключ: <button class="btn ghost sm" data-a="obUrl" data-v="token" style="padding:0">${ic('link',14)} Fine-grained token</button><br>Название — «Ритм семья», срок — максимальный.<br><b>Repository access</b> → Only select repositories → <code>ritm-family</code>.<br><b>Permissions</b> → Repository permissions → <b>Contents</b> → Read and write.<br>Нажмите Generate token и скопируйте ключ — он начинается с <code>github_pat_</code>.</li></ol>
  <label class="fld"><span class="lbl">Репозиторий</span><input class="inp mono" id="obRepo" type="text" value="${esc(o.repo)}" placeholder="NeAlta/ritm-family" autocapitalize="off" autocorrect="off" spellcheck="false" data-i="ob" data-k="repo"></label>
  <label class="fld"><span class="lbl">Ключ доступа</span><input class="inp mono" id="obToken" type="password" value="${esc(o.token)}" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false" data-i="ob" data-k="token"></label>${obErr()}`;
  foot=`<div class="split"><button class="btn sec" data-a="obGo" data-v="create1"${o.busy?' disabled':''}>Назад</button>${obBusyBtn('obCreate','Создать семью')}</div>`; }
 else if(o.step==='join'){ title='Присоединиться';
  const inv=o.invite?Fam.parseInvite(o.invite):null;
  b=`<div class="col-xs"><span class="eyebrow-l">По приглашению</span><h1 class="h1">Вставьте приглашение</h1></div><p class="p">Его отправляет тот, кто создал семью: Ритм·Семья → вкладка «Семья» → «Отправить».</p><label class="fld"><span class="lbl">Приглашение</span><textarea class="inp mono" id="obInv" rows="4" placeholder="RITM-FAMILY:…" autocapitalize="off" spellcheck="false" data-i="ob" data-k="invite">${esc(o.invite)}</textarea></label>${inv?`<div class="callout acc"><p>${ic('check',14)} Семья «${esc(inv.n||'Семья')}»</p></div>`:''}
  <label class="fld"><span class="lbl">Ваше имя</span><input class="inp" id="obName" type="text" value="${esc(o.name)}" placeholder="Например, Айжан" maxlength="24" data-i="ob" data-k="name"></label><span class="lbl">Ваш цвет</span>${colorPick('obColor',o.color)}${obErr()}`;
  foot=`<div class="split"><button class="btn sec" data-a="obGo" data-v="intro"${o.busy?' disabled':''}>Назад</button>${obBusyBtn('obJoin','Присоединиться')}</div>`; }
 else if(o.step==='done'){ title='Готово';
  b=`<div class="col-xs"><span class="eyebrow-l">${ic('check',14)} ${o.joined?'Вы в семье':'Семья создана'}</span><h1 class="h1">${esc(Fam.famName(Fam.cur()))}</h1></div>${o.joined?`<p class="p">Общие покупки, дела и траты уже на телефоне. В Целях и Деньгах появилась отметка «Для семьи».</p>`:`<p class="p">Теперь пригласите семью: отправьте приглашение, например, в Telegram. Его вставляют в Ритм·Семья → «У меня есть приглашение».</p><div class="code">${esc(Fam.invite(Fam.cur()).slice(0,90))}…</div><div class="split"><button class="btn pri" data-a="invShare">${ic('share',16)} Отправить</button><button class="btn sec" data-a="invCopy">${ic('copy',16)} Скопировать</button></div><p class="note">${ic('lock',13)} В приглашении ключ доступа — отправляйте только своим.</p>`}`;
  foot=`<button class="btn ${o.joined?'pri':'sec'} blk" data-a="obFinish">Готово</button>`; }
 return sheet({title,left:add&&o.step!=='done'?'close':'',body:b,foot}); }

SH.ftask=top=>{ const t=ui.ft; if(!t) return sheet({title:'',body:''}); const today=dkey(); const isNew=!t.id; const M=Fam.members(cur()); const G=Fam.groups(cur());
 const dch=[[today,'Сегодня'],[addDays(today,1),'Завтра'],['','Без даты']];
 let b=`<label class="fld"><span class="lbl">Задача</span><input class="inp" id="ftT" type="text" value="${esc(t.t)}" placeholder="Что нужно сделать?" maxlength="120" data-i="ft" data-k="t" enterkeyhint="done"></label>`;
 b+=`<div class="col-xs"><span class="lbl">Кто сделает</span><div class="chips"><button class="chip" data-a="ftWho" data-v="all" aria-pressed="${!t.who||t.who==='all'}">Любой</button>${G.map(g=>`<button class="chip" data-a="ftWho" data-v="g:${g.id}" aria-pressed="${t.who==='g:'+g.id}">${esc(g.name)}</button>`).join('')}${M.map(m=>`<button class="chip ichip" data-a="ftWho" data-v="${m.id}" aria-pressed="${t.who===m.id}"><i class="dot" style="background:${esc(m.color)};width:10px;height:10px;border-radius:50%;display:inline-block"></i> ${m.me?'Я':esc(m.name)}</button>`).join('')}</div></div>`;
 b+=`<div class="col-xs"><span class="lbl">Когда</span><div class="chips">${dch.map(([k,l])=>`<button class="chip" data-a="ftDate" data-v="${k}" aria-pressed="${(t.date||'')===k}">${l}</button>`).join('')}<label class="chip datechip" aria-pressed="${!!t.date&&!dch.some(([k])=>k===t.date)}">${ic('cal',16)} ${t.date&&!dch.some(([k])=>k===t.date)?relDay(t.date):'Дата'}<input type="date" value="${t.date||''}" data-c="ftDateIn" aria-label="Выбрать дату"></label></div></div>`;
 if(t.rep) b+=`<p class="note">${ic('repeat',13)} Повторяется ${REPN[t.rep.k]||''}. Повтор меняется в Ритм·Цели.</p>`;
 b+=`<label class="fld"><span class="lbl">Заметка</span><textarea class="inp" id="ftN" rows="3" data-i="ft" data-k="note" placeholder="Подробности">${esc(t.note||'')}</textarea></label>`;
 if(!isNew) b+=ui.confirm==='ftdel'?confirmBox('Удалить задачу у всей семьи?','ftDel'):`<button class="btn ghost danger-t self-start" data-a="ask" data-v="ftdel" style="padding:0">${ic('trash',16)} Удалить задачу</button>`;
 return sheet({title:isNew?'Задача для семьи':'Задача семьи',left:'close',body:b,foot:`<button class="btn pri blk" data-a="ftSave"${(t.t||'').trim()?'':' disabled'}>${isNew?'Добавить':'Сохранить'}</button>`}); };

SH.budget=()=>{ const v=ui.bud!=null?ui.bud:String(Fam.budget(cur())||'');
 const b=`<p class="p">Сколько семья готова тратить в месяц на общее: продукты, дом, детей. Считаются траты с отметкой «Для семьи» у всех.</p><label class="fld"><span class="lbl">Бюджет семьи на месяц, ₸</span><input class="inp" id="budIn" type="text" inputmode="numeric" value="${esc(v)}" placeholder="Например, 400 000" data-i="bud"></label><div class="chips">${[200000,300000,400000,500000].map(x=>`<button class="chip" data-a="budSet" data-v="${x}">${fmt(x,0)}</button>`).join('')}</div>`;
 return sheet({title:'Бюджет семьи',left:'close',body:b,foot:`<button class="btn pri blk" data-a="budSave">Сохранить</button>${Fam.budget(cur())?'<button class="btn ghost blk" data-a="budSet" data-v="0" data-save="1">Без бюджета</button>':''}`}); };

SH.token=()=>{ const b=`<p class="p">Если ключ истёк или его отозвали, создайте новый с теми же настройками и вставьте сюда. Потом отправьте семье новое приглашение — в нём новый ключ.</p><ol class="steps-n"><li><button class="btn ghost sm" data-a="obUrl" data-v="token" style="padding:0">${ic('link',14)} Создать fine-grained token</button></li><li>Only select repositories → <code>${esc((Fam.fam()||{}).repo||'ritm-family')}</code>; Contents → Read and write.</li></ol><label class="fld"><span class="lbl">Новый ключ доступа</span><input class="inp mono" id="tokIn" type="password" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false" data-i="tok"></label>`;
 return sheet({title:'Ключ доступа',left:'close',body:b,foot:`<button class="btn pri blk" data-a="tokSave">Сохранить ключ</button>`}); };

SH.settings=()=>sheet({title:'Настройки',body:themeCard()+`<section class="card col-s"><h2 class="sec-h">О Семейном ритме</h2><p class="p">Покупки и продукты дома — общие целиком. Задачи, траты и платежи — только с отметкой «Для семьи». Тренировки — только сколько и когда.</p><p class="note">Если одну запись поменяли двое, остаётся более поздняя правка. Удалённое удаляется у всех.</p></section>`});

/* участник семьи: группа, роль, удаление — у владельца */
SH.member=top=>{ const fid=cur(); const m=memberOf(top.id); if(!m) return sheet({title:'Участник',body:'<p class="p">Участника больше нет в семье.</p>'}); const adm=Fam.isAdmin(fid); const G=Fam.groups(fid); const st=Fam.status(fid);
 let b=`<div class="row" style="gap:14px">${avatar(m,'lg')}<div class="col-xs"><span class="hero-n b">${esc(m.name)}${m.me?' <span class="mut">· вы</span>':''}</span><span class="note">${m.role==='admin'?'<span class="role">владелец</span> ':''}${m.me?'обновлено '+ago(st.at):'обновлял(а) '+ago(m.at)}</span></div></div>`;
 if(adm){ b+=`<div class="col-xs"><span class="lbl">Группа</span><div class="chips"><button class="chip" data-a="mGroup" data-id="${m.id}" data-v="" aria-pressed="${!m.group}">Без группы</button>${G.map(g=>`<button class="chip" data-a="mGroup" data-id="${m.id}" data-v="${g.id}" aria-pressed="${m.group===g.id}">${esc(g.name)}</button>`).join('')}<button class="chip ichip" data-a="push" data-s="groups">${ic('plus',14)} Группа</button></div></div>`;
  const admins=Fam.members(fid).filter(x=>x.role==='admin').length;
  b+=`<div class="col-xs"><span class="lbl">Роль</span><div class="chips"><button class="chip" data-a="mRole" data-id="${m.id}" data-v="member" aria-pressed="${m.role!=='admin'}"${m.me&&admins<=1?' disabled':''}>Участник</button><button class="chip" data-a="mRole" data-id="${m.id}" data-v="admin" aria-pressed="${m.role==='admin'}">Владелец</button></div><span class="note">Владелец меняет название семьи, группы и состав.${m.me&&admins<=1?' Вы единственный владелец — сначала назначьте ещё одного.':''}</span></div>`;
  if(!m.me) b+=ui.confirm==='mdel'?confirmBox(`Удалить ${esc(m.name)} из семьи? Он(а) перестанет видеть общие дела и траты. Чтобы закрыть доступ полностью, создайте новый ключ доступа и отправьте остальным новое приглашение.`,'mDel','Удалить',`data-id="${m.id}"`):`<button class="btn ghost danger-t self-start" data-a="ask" data-v="mdel">${ic('trash',16)} Удалить из семьи</button>`; }
 else b+=`<p class="note">${m.group?'Группа: '+esc(groupName(m.group))+'. ':''}Группы и состав семьи меняет владелец.</p>`;
 if(m.me) b+=`<p class="note">Имя и цвет — во вкладке «Семья», раздел «Вы».</p>`;
 return sheet({title:m.me?'Вы в семье':m.name,body:b}); };

/* группы семьи */
SH.groups=()=>{ const fid=cur(); const G=Fam.groups(fid); const adm=Fam.isAdmin(fid); const M=Fam.members(fid);
 let b=`<p class="p">Группы помогают поручать дела сразу нескольким людям: «Взрослые», «Дети», «Кто водит машину».</p>`;
 b+=G.length?`<div class="col-s">${G.map(g=>`<div class="col-xs"><div class="grow-in"><input class="inp sm" type="text" value="${esc(g.name)}" maxlength="24" data-c="gName" data-id="${g.id}"${adm?'':' disabled'} aria-label="Название группы">${adm?`<button class="ibtn sm ghostb" data-a="gDel" data-id="${g.id}" aria-label="Удалить группу">${ic('trash',16)}</button>`:''}</div><div class="chips">${M.map(m=>`<button class="chip" data-a="gMem" data-id="${m.id}" data-v="${g.id}" aria-pressed="${m.group===g.id}"${adm?'':' disabled'}>${m.me?'Я':esc(m.name)}</button>`).join('')}</div></div>`).join('')}</div>`:'<p class="note">Групп пока нет.</p>';
 if(adm) b+=`<div class="grow-in"><input class="inp sm" id="gNew" type="text" placeholder="Новая группа" maxlength="24" data-enter="gAdd" enterkeyhint="done"><button class="ibtn acc" data-a="gAdd" aria-label="Добавить группу">${ic('plus',20)}</button></div>`;
 return sheet({title:'Группы',body:b}); };

SH.famName=()=>sheet({title:'Название семьи',left:'close',body:`<label class="fld"><span class="lbl">Название</span><input class="inp" id="fnIn" type="text" value="${esc(Fam.famName(cur()))}" maxlength="40" data-enter="fnSave" enterkeyhint="done"></label><p class="note">Название увидят все участники.</p>`,foot:`<button class="btn pri blk" data-a="fnSave">Сохранить</button>`});

/* ============ Ритм·Семья — действия ============ */
function ensureT(st){ if(!Array.isArray(st.tasks)) st.tasks=[]; if(!Array.isArray(st.goals)) st.goals=[]; }
function ensureP(st){ if(!Array.isArray(st.shop)) st.shop=[]; if(!Array.isArray(st.home)) st.home=[]; }
function obFail(e){ ui.ob.busy=false; ui.ob.err=e&&e.message?e.message:'Не получилось — проверьте интернет и попробуйте ещё раз'; render(); }
function obDone(joined){ const o=ui.ob; o.busy=false; o.step='done'; o.joined=joined; o.token=''; o.invite=''; S.setup=true; Store.save(); render(); }
Object.assign(A,{
 obStart:()=>{ ui.ob=null; if(!ui.stack.some(s=>s.type==='onboard')) ui.stack.push({type:'onboard'}); render(); },
 addFam:()=>{ ui.ob=null; ui.stack.push({type:'addFam'}); render(); },
 obGo:d=>{ const o=ui.ob; o.err='';
  if(d.v==='create2'&&!o.name.trim()){ toast('Введите имя'); const el=document.getElementById('obName'); if(el) el.focus(); return; }
  o.step=d.v; if(d.v==='join'&&!o.add&&o.color===Fam.COLORS[0][0]) o.color=Fam.COLORS[1][0]; render(); const b=document.querySelector('.sh-body'); if(b) b.scrollTop=0; },
 obColor:d=>{ ui.ob.color=d.v; render(); },
 obSame:d=>{ ui.ob.same=!!d.v; ui.ob.err=''; render(); },
 obUrl:d=>openUrl(d.v==='repo'?NEWREPO_URL:TOKEN_URL),
 obCreate:async()=>{ const o=ui.ob; if(o.busy) return; o.err=''; o.busy=true; render(); const prev=o.add&&o.same?Fam.fam():null;
  try{ await Fam.create({repo:prev?prev.repo:o.repo,token:prev?prev.token:o.token,name:o.name.trim()||'Я',color:o.color,family:o.family.trim()||'Наша семья',pit:o.add?false:undefined}); obDone(false); }
  catch(e){ obFail(e); } },
 obJoin:async()=>{ const o=ui.ob; if(o.busy) return; o.err='';
  if(!Fam.parseInvite(o.invite)){ o.err='Это не приглашение Ритма — скопируйте его целиком, вместе с RITM-FAMILY:'; render(); return; }
  if(!o.name.trim()){ toast('Введите имя'); return; }
  o.busy=true; render();
  try{ await Fam.join(o.invite,{name:o.name.trim(),color:o.color,pit:o.add?false:undefined}); obDone(true); }
  catch(e){ obFail(e); } },
 obFinish:()=>{ ui.ob=null; ui.stack=[]; ui.tab='today'; S.setup=true; commit(); },
 famCur:d=>{ Fam.setCur(d.v); ui.confirm=null; render(); },
 noticeOk:()=>{ Fam.clearNotice(); render(); },
 famSync:async()=>{ const r=await Fam.sync({force:true}); if(r&&r.ok) toast('Синхронизировано'); else if(r&&r.locked) toast('Синхронизация уже идёт'); render(); },
 famPit:d=>{ Fam.setPit(d.v||null); render(); toast(d.v?'Покупки и продукты дома — общие с «'+Fam.famName(d.v)+'»':'Покупки и продукты дома больше не общие'); },
 famBody:()=>{ Fam.setShareBody(cur(),!Fam.shareBody(cur())); render(); },
 meColor:d=>{ Fam.setMe({color:d.v}); render(); },
 invShare:()=>{ const t='Приглашение в семью «'+Fam.famName(cur())+'» в Ритме. Откройте Ритм·Семья → «У меня есть приглашение» и вставьте:\n\n'+Fam.invite(cur()); if(!Native.share(t,'Ритм — приглашение в семью')) A.invCopy(); },
 invCopy:async()=>{ try{ await navigator.clipboard.writeText(Fam.invite(cur())); toast('Приглашение скопировано'); }catch(e){ toast('Не удалось скопировать'); } },
 famLeave:async()=>{ const n=Fam.famName(cur()); ui.confirm=null; await Fam.leave(cur()); if(!Fam.on()){ S.setup=false; ui.stack=[{type:'onboard'}]; ui.ob=null; } commit(); toast('Вы вышли из семьи «'+n+'»'); },
 /* участники и группы */
 mGroup:d=>{ Fam.admin.setGroupOf(cur(),d.id,d.v||null).then(render); },
 mRole:d=>{ Fam.admin.setRole(cur(),d.id,d.v).then(render); },
 mDel:async d=>{ const m=memberOf(d.id); await Fam.admin.remove(cur(),d.id); ui.confirm=null; ui.stack.pop(); render(); toast((m?m.name:'Участник')+' удалён(а) из семьи'); },
 gAdd:async()=>{ const el=document.getElementById('gNew'); const v=el?el.value.trim():''; if(!v) return; const G=Fam.groups(cur()).slice(); if(G.some(g=>g.name.toLowerCase()===v.toLowerCase())){ toast('Такая группа уже есть'); return; }
  G.push({id:'g'+uid(),name:v.slice(0,24)}); await Fam.admin.setGroups(cur(),G); render(); const n=document.getElementById('gNew'); if(n){ n.value=''; n.focus(); } },
 gDel:async d=>{ await Fam.admin.setGroups(cur(),Fam.groups(cur()).filter(g=>g.id!==d.id)); render(); },
 gMem:async d=>{ const m=memberOf(d.id); await Fam.admin.setGroupOf(cur(),d.id,m&&m.group===d.v?null:d.v); render(); },
 fnSave:async()=>{ const el=document.getElementById('fnIn'); const v=el?el.value.trim():''; if(!v) return; await Fam.admin.setName(cur(),v); ui.stack.pop(); render(); },
 /* задачи семьи */
 ftAdd:async()=>{ const el=document.getElementById('ftIn'); const v=el?el.value.trim():''; if(!v) return;
  await Fam.editApp(T_KEY,st=>{ ensureT(st); st.tasks.push({id:'t'+uid(),t:v.slice(0,120),date:dkey(),time:null,rep:null,goal:null,note:'',created:Date.now(),done:false,fam:cur(),who:'all'}); });
  render(); const n=document.getElementById('ftIn'); if(n){ n.value=''; n.focus(); } toast('Добавлено для семьи «'+Fam.famName(cur())+'»'); },
 ftTog:async d=>{ const k=d.k||dkey(); let on=false;
  await Fam.editApp(T_KEY,st=>{ ensureT(st); const t=st.tasks.find(x=>x.id===d.id); if(!t) return; if(t.rep){ t.doneD=t.doneD||{}; if(t.doneD[k]) delete t.doneD[k]; else { t.doneD[k]=true; on=true; } } else { t.done=!t.done; t.doneAt=t.done?dkey():null; on=t.done; } });
  if(on) vibrate(10); render(); },
 ftEdit:d=>{ const t=famTasks().find(x=>x.id===d.id); if(!t) return; ui.ft=clone(t); ui.confirm=null; ui.stack.push({type:'ftask',id:t.id}); render(); },
 ftWho:d=>{ ui.ft.who=d.v; render(); },
 ftDate:d=>{ ui.ft.date=d.v||null; render(); },
 ftSave:async()=>{ const t=ui.ft; t.t=(t.t||'').trim(); if(!t.t) return;
  await Fam.editApp(T_KEY,st=>{ ensureT(st); const i=st.tasks.findIndex(x=>x.id===t.id); if(i>=0) st.tasks[i]=Object.assign(st.tasks[i],{t:t.t,who:t.who||'all',date:t.date,note:t.note||''}); else st.tasks.push(Object.assign({id:'t'+uid(),time:null,rep:null,goal:null,created:Date.now(),done:false},t,{fam:cur(),who:t.who||'all'})); });
  ui.ft=null; ui.stack.pop(); render(); },
 ftDel:async()=>{ const id=ui.ft&&ui.ft.id; await Fam.editApp(T_KEY,st=>{ ensureT(st); st.tasks=st.tasks.filter(x=>x.id!==id); }); ui.ft=null; ui.confirm=null; ui.stack.pop(); render(); toast('Задача удалена у всей семьи'); },
 /* покупки */
 fsAdd:async()=>{ const el=document.getElementById('fsIn'); const v=el?el.value.trim():''; if(!v) return;
  const dup=shopList().some(x=>!x.done&&x.n.toLowerCase()===v.toLowerCase()); if(dup){ toast('Уже в списке'); if(el) el.select(); return; }
  await Fam.editApp(P_KEY,st=>{ ensureP(st); st.shop.push({id:'s'+uid(),n:v.slice(0,40),food:null}); }); render(); const n=document.getElementById('fsIn'); if(n){ n.value=''; n.focus(); } },
 fsTog:async d=>{ await Fam.editApp(P_KEY,st=>{ ensureP(st); const x=st.shop.find(s=>s.id===d.id); if(x) x.done=!x.done; }); render(); },
 fsDel:async d=>{ await Fam.editApp(P_KEY,st=>{ ensureP(st); st.shop=st.shop.filter(s=>s.id!==d.id); }); render(); },
 fsClear:async()=>{ const n=shopList().filter(x=>x.done).length; await Fam.editApp(P_KEY,st=>{ ensureP(st); st.shop=st.shop.filter(s=>s.priv||!s.done); }); render(); toast('Убрано: '+pl(n,['покупка','покупки','покупок'])); },
 /* деньги */
 mOff:d=>{ ui.mOff=Number(d.v)||0; render(); },
 budSet:d=>{ ui.bud=d.v==='0'?'':String(d.v); if(d.save) A.budSave(); else render(); },
 budSave:async()=>{ const v=parseNum(ui.bud!=null?ui.bud:String(Fam.budget(cur())))||0; await Fam.admin.setBudget(cur(),v); ui.bud=null; ui.stack.pop(); render(); toast(v?'Бюджет семьи: '+money(v):'Бюджет семьи убран'); },
 tokSave:()=>{ const el=document.getElementById('tokIn'); if(!Fam.setToken(cur(),el?el.value:'')){ toast('Это не похоже на ключ GitHub — он начинается с github_pat_'); return; } ui.stack.pop(); render(); toast('Ключ сохранён — синхронизирую'); }
});
Object.assign(C,{ meName:(d,t)=>{ const v=t.value.trim(); if(v){ Fam.setMe({name:v}); render(); } }, ftDateIn:(d,t)=>{ if(t.value){ ui.ft.date=t.value; render(); } },
 gName:(d,t)=>{ const v=t.value.trim(); if(!v) return; Fam.admin.setGroups(cur(),Fam.groups(cur()).map(g=>g.id===d.id?{id:g.id,name:v.slice(0,24)}:g)).then(render); } });
Object.assign(I,{ ob:(d,t)=>{ ui.ob[d.k]=t.value; if(d.k==='invite'){ const ok=!!Fam.parseInvite(t.value); if(ok!==!!ui.ob._inv){ ui.ob._inv=ok; render(); } } },
 ft:(d,t)=>{ ui.ft[d.k]=t.value; const b=document.querySelector('[data-a="ftSave"]'); if(b) b.disabled=!ui.ft.t.trim(); },
 bud:(d,t)=>{ ui.bud=t.value; }, tok:()=>{} });
APP.onBack=t=>{ if(t&&t.type==='ftask'){ ui.ft=null; } if(t&&t.type==='budget') ui.bud=null; if(t&&(t.type==='addFam'||t.type==='onboard')) ui.ob=null; };
/* перерисовка после синхронизации; не мешать набору текста */
let famPend=false;
function famRender(){ if(ui.booting) return; if(!hasFam()&&S&&S.setup){ S.setup=false; if(!ui.stack.some(s=>s.type==='onboard')){ ui.stack=[{type:'onboard'}]; ui.ob=null; } }
 const ae=document.activeElement; if(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)){ famPend=true; return; } render(); }
window.addEventListener('ritm-family',famRender);
document.addEventListener('focusout',()=>{ if(famPend){ famPend=false; setTimeout(famRender,0); } });
APP.onResume=()=>{ if(S) S.setup=hasFam(); render(); };

if(typeof document!=='undefined'&&document.getElementById&&document.getElementById('view')) boot();
</script>
