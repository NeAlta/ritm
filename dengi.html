<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ритм">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F1EC">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="ritm-ios.css">
<script>window.RITM_APP=true;window.RITM_IOS=true;window.RITM_PAGE='dengi'</script>
<script src="ritm-ios.js"></script>
</head>
<body>
<title>Ритм·Деньги</title>
<style>
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --sunk:#EFEBE4; --line:#E6E0D6; --ink:#17161A; --muted:#5F5A52; --faint:#8C867C;
  --accent:#2FA36B; --accent-ink:#17673F; --accent-tint:#D8F1E3; --accent-soft:#93D3B0; --on-accent:#17161A;
  --btn:#17161A; --on-btn:#FFFFFF;
  --dark-card:#17161A; --on-dark:#FFFFFF; --on-dark-muted:#CFCBC4; --dk-eyebrow:#8FE0B4; --dk-line:#2E2C30;
  --good:#2F7A4D; --good-tint:#E3F2E8; --on-good:#FFFFFF;
  --warn:#8A5A0B; --warn-tint:#FCEFD2; --warn-ink:#6B4507;
  --bad:#B42318; --bad-tint:#FDE7E4; --on-bad:#FFFFFF;
  --shadow:rgba(23,22,26,.18);
  --c-telo:#F0643C; --c-dengi:#2FA36B; --c-pit:#E0A22E; --c-tseli:#6E63F2;
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-lg:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --card:#1E1C1A; --sunk:#292623; --line:#36322E; --ink:#F2EEE8; --muted:#AFA89E; --faint:#7E776E;
  --accent:#2FA36B; --accent-ink:#7BD7A6; --accent-tint:#16301F; --accent-soft:#2F6B4A; --on-accent:#17161A;
  --btn:#F2EEE8; --on-btn:#17161A;
  --dark-card:#2B2724; --on-dark:#F2EEE8; --on-dark-muted:#BDB5AA; --dk-eyebrow:#7BD7A6; --dk-line:#3E3934;
  --good:#7CCB9A; --good-tint:#1B2C21; --on-good:#0F1F15;
  --warn:#E9B455; --warn-tint:#33280F; --warn-ink:#F2C46A;
  --bad:#FF8A7A; --bad-tint:#3A1C18; --on-bad:#2A0F0B;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121110; --card:#1E1C1A; --sunk:#292623; --line:#36322E; --ink:#F2EEE8; --muted:#AFA89E; --faint:#7E776E;
  --accent:#2FA36B; --accent-ink:#7BD7A6; --accent-tint:#16301F; --accent-soft:#2F6B4A; --on-accent:#17161A;
  --btn:#F2EEE8; --on-btn:#17161A;
  --dark-card:#2B2724; --on-dark:#F2EEE8; --on-dark-muted:#BDB5AA; --dk-eyebrow:#7BD7A6; --dk-line:#3E3934;
  --good:#7CCB9A; --good-tint:#1B2C21; --on-good:#0F1F15;
  --warn:#E9B455; --warn-tint:#33280F; --warn-ink:#F2C46A;
  --bad:#FF8A7A; --bad-tint:#3A1C18; --on-bad:#2A0F0B;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px calc(100px + env(safe-area-inset-bottom,0px))}
.col{display:flex;flex-direction:column;gap:14px}
.col-s{display:flex;flex-direction:column;gap:10px}
.col-xs{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.gap6{gap:6px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top-al{align-items:flex-start}
.grow{flex:1;min-width:0}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.self-start{align-self:flex-start}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.tile{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);padding:0;flex-shrink:0}
.h1{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.15;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.25;margin:0;text-wrap:balance}
.h3{font-size:17px;font-weight:700;margin:0}
.sec-h{font-size:16px;font-weight:700;margin:0}
.lede{margin:0;color:var(--muted);font-size:14px}
.p{margin:0}
.note{margin:0;color:var(--muted);font-size:13px}
.lbl{font-size:13px;color:var(--muted)}
.mut{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dk-eyebrow)}
.eyebrow-l{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.card{background:var(--card);border-radius:var(--r-lg);padding:16px}
.card.dark{background:var(--dark-card);color:var(--on-dark)}
.dk-t{font-size:20px;font-weight:600;margin:0}
.dk-s,.dk-note{margin:0;font-size:14px;color:var(--on-dark-muted)}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.good{background:var(--good-tint);color:var(--good)}
.badge.warn{background:var(--warn-tint);color:var(--warn-ink)}
.badge.bad{background:var(--bad-tint);color:var(--bad)}
.badge.acc{background:var(--accent-tint);color:var(--accent-ink)}
.badge.mut{background:var(--sunk);color:var(--muted)}
.badge.on-dk{background:var(--dk-line);color:var(--on-dark)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid transparent;font-weight:700;font-size:15px;background:none;color:var(--ink);text-align:center}
.btn.pri{background:var(--btn);color:var(--on-btn)}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.sec{border-color:var(--ink);color:var(--ink)}
.btn.sec-dk{border-color:var(--on-dark-muted);color:var(--on-dark)}
.btn.ghost{color:var(--accent-ink);padding:0 10px;min-height:40px;font-weight:600}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.danger-t{color:var(--bad)!important}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.blk{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn:active:not([disabled]){transform:scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent-ink);background:var(--accent-tint);color:var(--accent-ink)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex-shrink:0}
.ready{display:flex;gap:16px;align-items:center}
.ring .rt{fill:none;stroke:var(--sunk);stroke-width:10}
.ring .rv{fill:none;stroke-width:10;stroke-linecap:round;stroke-dashoffset:var(--off)}
.ring.anim .rv{animation:ringIn 1s cubic-bezier(.2,.8,.2,1)}
@keyframes ringIn{from{stroke-dashoffset:var(--full)}}
.ring .rn{font-family:var(--f-display);font-size:28px;font-weight:600;fill:var(--ink)}
.ring .rl{font-size:11px;fill:var(--muted);font-family:var(--f-body)}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--dk-line);align-items:baseline}
.pi:first-child{border-top:none}
.pi-n{font-weight:500;text-align:left;background:none;border:none;padding:0;color:inherit;min-width:0}
.pi-v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.pi-r{grid-column:1/-1;font-size:12px;color:var(--muted)}
.plan-list.lt .pi{border-top-color:var(--line)}
.lnk{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wd-dot{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--on-accent);box-sizing:border-box}
.wd.plan .wd-dot{background:transparent;border:2px dashed var(--accent)}
.wd.done .wd-dot{background:var(--accent);border:none}
.wd.today .wd-l{color:var(--ink);font-weight:700}
.wd.today .wd-dot{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.lg{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-sizing:border-box}
.lg.done{background:var(--accent)} .lg.plan{border:2px dashed var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats.s2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:var(--sunk);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat-v{font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.stat-l{font-size:12px;color:var(--muted)}
.list{background:var(--card);border-radius:var(--r-lg);padding:2px 16px}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 0;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.li:last-child{border-bottom:none}
.li-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li-t{font-weight:600}
.li-s{font-size:13px;color:var(--muted)}
.li-e{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .chev{color:var(--faint);flex-shrink:0}
.grp-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 -6px}
.stp{display:flex;flex-direction:column;gap:6px;min-width:0}
.stp-c{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;background:var(--sunk);border-radius:16px;padding:4px}
.stp-b{width:44px;height:44px;border-radius:12px;border:none;background:var(--card);font-size:22px;font-weight:600;color:var(--accent-ink);padding:0}
.stp-v{width:100%;min-width:0;border:none;background:transparent;text-align:center;font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;color:var(--ink)}
.stp-v:focus{outline:none}
.stp-c:focus-within{box-shadow:0 0 0 2px var(--accent)}
.sets{display:flex;flex-direction:column;gap:6px}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes fadeUp{from{transform:translateY(-4px);opacity:.6}}
.warn-t{color:var(--warn)}
#sheet{position:fixed;inset:0;z-index:30;background:var(--bg)}
.sh{display:flex;flex-direction:column;height:100%}
.sh.enter{animation:shIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes shIn{from{transform:translateY(32px);opacity:.4}}
.sh-in{max-width:480px;margin:0 auto;width:100%}
.sh-head{padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.sh-head .sh-in{display:flex;align-items:center;gap:10px;min-height:44px}
.sh-t{flex:1;min-width:0}
.sh-title{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
.sh-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;border:none;background:none;color:var(--muted);font-size:11px;font-weight:500;border-radius:12px;padding:0}
.tab[aria-current="page"]{color:var(--accent-ink);font-weight:700}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.inp{width:100%;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--accent)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:14px;color:var(--muted)}
.search .inp{padding-left:42px}
.callout{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px;align-items:flex-start}
.callout p{margin:0}
.callout.warn{background:var(--warn-tint);color:var(--warn-ink)}
.callout.acc{background:var(--accent-tint);color:var(--accent-ink)}
.callout.good{background:var(--good-tint);color:var(--good)}
.callout.mut{background:var(--sunk);color:var(--ink)}
.callout .btn.ghost{color:inherit;padding:0;min-height:32px;text-decoration:underline;text-underline-offset:3px}
.confirm{background:var(--bad-tint);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;color:var(--bad);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.c-grid{stroke:var(--line);stroke-width:1}
.c-lbl{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.c-area{fill:var(--accent-tint)}
.c-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.c-pt{fill:var(--card);stroke:var(--accent);stroke-width:2}
.c-guide{stroke:var(--faint);stroke-dasharray:3 3}
.c-tip{fill:var(--ink)}
.c-tipt{fill:var(--bg);font-size:12px;font-weight:700;font-family:var(--f-body)}
.c-hit{fill:transparent;cursor:pointer}
.dchip{display:inline-grid;place-items:center;min-width:36px;height:30px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.dchip.on{background:var(--accent-tint);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(156px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px var(--shadow);animation:fadeUp .2s ease-out}
details.card summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:10px}
details.card[open] summary svg{transform:rotate(90deg)}
.tpl{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:14px;width:100%;color:var(--ink)}
.tpl[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tpl-t{font-weight:700;font-size:16px}
.splash{display:grid;place-items:center;min-height:50vh;color:var(--muted);text-align:center}
.seg2{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--card);border-radius:999px;padding:3px}
.seg2-b{min-height:34px;padding:0 12px;border:none;border-radius:999px;background:none;font-size:13px;font-weight:600;color:var(--muted)}
.seg2-b[aria-checked="true"]{background:var(--accent-tint);color:var(--accent-ink)}
.ta{min-height:120px;padding:12px 14px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical;line-height:1.4}
.ph{display:grid;place-items:center;text-align:center;gap:8px;padding:28px 16px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* Столбики */
.bars{display:flex;gap:6px;align-items:stretch}
.bc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.bc-v{font-size:11px;font-weight:700;color:var(--muted);min-height:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bc-t{width:100%;height:110px;display:flex;align-items:flex-end;background:var(--sunk);border-radius:8px;overflow:hidden}
.bc-t i{display:block;width:100%;background:var(--accent-soft);border-radius:8px 8px 0 0;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.bc.cur .bc-t i{background:var(--accent)} .bc.cur .bc-v,.bc.cur .bc-l{color:var(--accent-ink)}
.bc.dim .bc-t i{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 5px,var(--accent-tint) 5px 10px)}
.bc-l{font-size:11px;min-height:15px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.bars.dense .bc-l{font-size:10px;overflow:visible;text-overflow:clip;max-width:none} .bars.dense .bc-v{font-size:10px}
.bc-s{font-size:10px;color:var(--faint);white-space:nowrap}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.seg2-b[disabled]{opacity:.4}
/* Сегмент во всю ширину */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;background:var(--sunk);border-radius:999px;padding:3px}
.seg-b{min-height:40px;padding:0 8px;border:none;border-radius:999px;background:none;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-b[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.seg.on-card{background:var(--sunk)}
/* Главная карточка-число */
.hero{display:flex;flex-direction:column;gap:10px}
.hero-v{font-family:var(--f-display);font-size:36px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.hero-v.md{font-size:28px}
.hero-v small{font-size:.5em;font-weight:500;color:inherit;opacity:.75;margin-left:4px}
.card.dark .lbl,.card.dark .note{color:var(--on-dark-muted)}
.pbar{position:relative;height:8px;border-radius:4px;background:var(--sunk);overflow:visible}
.card.dark .pbar{background:var(--dk-line)}
.pbar>i{display:block;height:100%;border-radius:4px;background:var(--accent);max-width:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pbar.over>i{background:var(--bad)}
.pbar.good>i{background:var(--good)}

function overduePays(){ const t=dkey(); return S.pays.filter(p=>p.on&&p.next<t); }
function budgetStats(p){ const today=dkey(); const cur=today>=p.from&&today<=p.to; const spent=spentIn(p); const left=S.budget-spent;
 const days=dBetween(p.from,p.to)+1; const daysLeft=cur?dBetween(today,p.to)+1:(today<p.from?days:0);
 const res=cur&&S.planPays?reserved(p,today):0; const free=left-res; const daily=daysLeft>0?free/daysLeft:0;
 const todaySpent=cur?sum(allOps().filter(o=>o.t==='exp'&&o.date===today),o=>o.sum):0;
 const dailyStart=daysLeft>0?(left+todaySpent-res)/daysLeft:0; const todayLeft=dailyStart-todaySpent;
 const elapsed=cur?(dBetween(p.from,today)+.5)/days:(today>p.to?1:0);
 return {spent,left,res,free,daily,dailyStart,todayLeft,daysLeft,days,todaySpent,elapsed,cur}; }

function moneyReminders(){ const t=dkey(), to=addDays(t,14), tm=(S.remind&&S.remind.time)||'10:00'; const out=[];
 for(const p of S.pays){ if(!p.on||!(p.sum>0)) continue; for(const d of payDates(p,t,to)) out.push({id:'pay-'+p.id+'-'+d,at:atTime(d,tm),title:'Платёж сегодня: '+p.n,text:`${money(p.sum)} · ${catOf(p.cat).n}. Отметьте «Оплачено» в Ритм·Деньги.`}); }
 return out; }

/* ============ Ритм·Деньги — вкладки ============ */
function perNav(){ const p=periodOf(ui.per), c=curPeriod(); return `<div class="mnav"><button class="ibtn" data-a="perShift" data-v="-1" aria-label="Предыдущий месяц">${ic('left',18)}</button><button class="mnav-t btn ghost" data-a="perNow" style="padding:0 4px;color:var(--ink)">${esc(p.label)}</button><button class="ibtn" data-a="perShift" data-v="1" aria-label="Следующий месяц"${p.from>=c.from?' disabled':''}>${ic('right',18)}</button></div>`; }
function catIco(c,sm){ return `<span class="ico${sm?' sm':''}">${ic(c.ic||'more',sm?16:20)}</span>`; }
function opRow(o){ const c=o.t==='tr'?null:catOf(o.cat); const title=o.t==='tr'?`${accOf(o.acc).n} → ${accOf(o.to).n}`:c.n;
 const sub=[o.note,o.t==='tr'?'Перевод':accOf(o.acc).n].filter(Boolean).join(' · ');
 const v=o.t==='exp'?money(-o.sum):o.t==='inc'?money(o.sum,true):money(o.sum);
 return `<button class="li" data-a="opEdit" data-id="${o.id}"><span class="ico${o.t==='tr'?' mut':''}">${ic(o.t==='tr'?'swap':c.ic,20)}</span><span class="li-m"><span class="li-t">${esc(title)}</span><span class="li-s">${esc(sub)}</span></span><span class="li-e${o.t==='inc'?' good-t':''}">${v}</span></button>`; }
function payRow(p,act=true){ const t=dkey(); const od=p.next<t; const n=dBetween(t,p.next);
 const when=od?`<span class="bad-t b">просрочен с ${fmtDay(p.next)}</span>`:n===0?'<span class="acc-t b">сегодня</span>':n===1?'завтра':`${relDay(p.next)}`;
 return `<div class="li"><span class="ico${od?'':' mut'}">${ic(catOf(p.cat).ic,20)}</span><button class="li-m" data-a="push" data-s="pay" data-id="${p.id}" style="background:none;border:none;padding:0;text-align:left;color:inherit"><span class="li-t">${esc(p.n)}</span><span class="li-s">${when} · ${money(p.sum)}</span></button>${act?`<button class="btn ${od||n<=0?'acc':'sec'} sm" data-a="payDo" data-id="${p.id}">Оплачено</button>`:''}</div>`; }

/* ---------- Обзор ---------- */
VIEWS.home=()=>{ const p=periodOf(ui.per); const st=budgetStats(p); const t=dkey();
 let h=topBar()+`<div class="between"><h1 class="h1">Обзор</h1>${perNav()}</div>`;
 const over=st.left<0; const frac=S.budget?st.spent/S.budget:0;
 h+=`<section class="card dark hero"><span class="lbl">${st.cur?'Осталось до конца месяца':p.to<t?'Остаток бюджета в этом месяце':'Бюджет месяца'}</span><span class="hero-v${over?' bad-t':''}" style="${over?'color:#FF9A8A':''}">${money(st.left)}</span>
  ${pbar(frac,over?'over':'',st.cur?st.elapsed:null)}
  <div class="row-b"><span class="note">Потрачено ${money(st.spent)} из ${money(S.budget)}</span>${st.cur?`<span class="note">${pl(st.daysLeft,DAYS)}</span>`:''}</div>
  ${st.cur?(st.free>0?`<span class="pill">${ic('cal',16)} Можно тратить ≈ ${money(Math.max(0,st.dailyStart))} в день</span><p class="note">Сегодня ${st.todayLeft>=0?`осталось <b style="color:var(--on-dark)">${money(st.todayLeft)}</b>`:`<b style="color:#FF9A8A">перерасход ${money(-st.todayLeft)}</b>`}${st.res?` · отложено на платежи ${money(st.res)}`:''}</p>`:`<span class="pill" style="background:#FDE7E4;color:#B42318">${ic('warn',16)} Бюджет исчерпан${st.res?' с учётом платежей':''}</span><p class="note">Траты сверх бюджета: ${money(Math.max(0,-st.free))}. Можно поднять бюджет в настройках.</p>`):''}
  <button class="btn sec-dk sm self-start" data-a="push" data-s="budget">${ic('edit',16)} Бюджет</button></section>`;
 const od=overduePays(); const soon=S.pays.filter(x=>x.on&&x.next>=t&&dBetween(t,x.next)<=7).sort((a,b)=>a.next<b.next?-1:1);
 if(st.cur&&(od.length||soon.length)) h+=`<section class="col-s"><div class="between"><h2 class="sec-h">Платежи на неделе</h2><button class="btn ghost sm" data-a="tab" data-t="pays">Все</button></div><div class="list">${[...od,...soon].slice(0,4).map(x=>payRow(x)).join('')}</div></section>`;
 // категории
 const allC=expCats().map(c=>({c,v:spentIn(p,c.id)})); const cats=allC.filter(x=>x.v>0||ui.catAll).sort((a,b)=>{ const oa=a.c.lim&&a.v>a.c.lim, ob=b.c.lim&&b.v>b.c.lim; if(oa!==ob) return oa?-1:1; return b.v-a.v; });
 h+=`<section class="card col-s"><div class="between"><h2 class="sec-h">Категории</h2><button class="btn ghost sm" data-a="push" data-s="cats">Лимиты</button></div>${cats.length?cats.map(({c,v})=>{ const lim=c.lim||0; const ov=lim&&v>lim; return `<button class="catrow" data-a="opsCat" data-v="${c.id}">${catIco(c,true)}<span class="grow col-xs"><span class="row-b"><span class="b">${esc(c.n)}</span><span class="num ${ov?'bad-t b':''}">${money(v)}${lim?` <span class="mut" style="font-weight:400">из ${moneyShort(lim)}</span>`:''}</span></span>${lim?pbar(v/lim,ov?'over':''):''}${ov?`<span class="note bad-t">+${money(v-lim)} сверх лимита</span>`:''}</span></button>`; }).join(''):'<p class="note">Пока нет трат в этом месяце.</p>'}${allC.length>cats.length?`<button class="btn ghost sm self-start" data-a="catAll">Все категории (${allC.length})</button>`:ui.catAll?`<button class="btn ghost sm self-start" data-a="catAll">Только с тратами</button>`:''}</section>`;
 // сегодня
 if(st.cur){ const today=allOps().filter(o=>o.date===t); h+=`<section class="col-s"><div class="between"><h2 class="sec-h">Сегодня</h2>${today.length?`<span class="note">${money(-sum(today.filter(o=>o.t==='exp'),o=>o.sum))}</span>`:''}</div>${today.length?`<div class="list">${today.map(opRow).join('')}</div>`:`<div class="card">${empty('wallet','Сегодня операций нет. Нажмите «+», чтобы записать трату — это займёт пару секунд.')}</div>`}</section>`; }
 // счета и копилки
 h+=`<section class="card col-s"><div class="between"><h2 class="sec-h">Счета</h2><span class="b num">${money(totalBal())}</span></div><div class="col-s">${S.accs.map(a=>`<button class="catrow" data-a="push" data-s="acc" data-id="${a.id}"><span class="ico sm mut">${ic(ACC_IC[a.kind]||'card',16)}</span><span class="grow">${esc(a.n)}</span><span class="num b">${money(accBal(a.id))}</span></button>`).join('')}</div><button class="btn ghost sm self-start" data-a="opNew" data-v="tr">${ic('swap',16)} Перевод между счетами</button></section>`;
 h+=`<section class="card col-s"><div class="between"><h2 class="sec-h">Копилки</h2><button class="btn ghost sm" data-a="jarNew">${ic('plus',16)} Новая</button></div>${S.jars.length?S.jars.map(j=>{ const b=jarBal(j); return `<button class="catrow" data-a="push" data-s="jar" data-id="${j.id}"><span class="ico sm">${ic('piggy',16)}</span><span class="grow col-xs"><span class="row-b"><span class="b">${esc(j.n)}</span><span class="num">${money(b)}${j.target?` <span class="mut">из ${moneyShort(j.target)}</span>`:''}</span></span>${j.target?pbar(b/j.target,b>=j.target?'good':''):''}</span></button>`; }).join(''):'<p class="note">Копилка — деньги, отложенные на цель: отпуск, подушку, покупку. Пополняется переводом.</p>'}</section>`;
 return `<div class="col">${h}</div>`; };

/* ---------- Операции ---------- */
VIEWS.ops=()=>{ const p=periodOf(ui.per); const f=ui.opf||(ui.opf={t:'all',cat:'',q:''});
 let L=opsIn(p); if(f.t!=='all') L=L.filter(o=>o.t===f.t); if(f.cat) L=L.filter(o=>o.cat===f.cat);
 const q=(f.q||'').trim().toLowerCase(); if(q) L=L.filter(o=>(o.note||'').toLowerCase().includes(q)||(o.t!=='tr'&&catOf(o.cat).n.toLowerCase().includes(q))||String(o.sum).includes(q));
 let h=topBar()+`<div class="between"><h1 class="h1">Операции</h1>${perNav()}</div>`;
 const ex=sum(L.filter(o=>o.t==='exp'),o=>o.sum), inc=sum(L.filter(o=>o.t==='inc'),o=>o.sum);
 h+=`<div class="stats s2"><div class="stat"><span class="stat-v">${money(ex)}</span><span class="stat-l">расходы</span></div><div class="stat"><span class="stat-v good-t">${money(inc)}</span><span class="stat-l">доходы</span></div></div>`;
 h+=`<div class="search">${ic('search',18)}<input class="inp" id="opq" type="search" placeholder="Поиск: комментарий, категория, сумма" aria-label="Поиск операций" value="${esc(f.q)}" data-i="opq"></div>`;
 h+=`<div class="scroller">${[['all','Все'],['exp','Расходы'],['inc','Доходы'],['tr','Переводы']].map(([v,l])=>`<button class="chip" data-a="opfT" data-v="${v}" aria-pressed="${f.t===v}">${l}</button>`).join('')}${f.cat?`<button class="chip" data-a="opfCat" data-v="" aria-pressed="true">${esc(catOf(f.cat).n)} ${ic('close',14)}</button>`:''}</div>`;
 h+=`<div id="opList" class="col">${opList(L)}</div><button class="btn sec blk" data-a="imOpen">${ic('copy',18)} Импорт выписки из банка</button>`;
 return `<div class="col">${h}</div>`; };
function opList(L){ if(!L.length) return `<div class="card">${empty('list',ui.opf&&(ui.opf.q||ui.opf.cat||ui.opf.t!=='all')?'Ничего не нашлось. Сбросьте фильтр или измените поиск.':'В этом месяце операций нет.')}</div>`;
 const g={}; for(const o of L)(g[o.date]=g[o.date]||[]).push(o);
 return Object.keys(g).sort().reverse().map(d=>{ const e=sum(g[d].filter(o=>o.t==='exp'),o=>o.sum); return `<div class="between grp"><span class="grp-h" style="margin:0">${relDay(d)}</span>${e?`<span class="note num">${money(-e)}</span>`:''}</div><div class="list">${g[d].map(opRow).join('')}</div>`; }).join(''); }

/* ---------- Платежи ---------- */
VIEWS.pays=()=>{ const t=dkey(); let h=topBar()+`<h1 class="h1">Платежи</h1>`;
 const on=S.pays.filter(p=>p.on).sort((a,b)=>a.next<b.next?-1:1); const off=S.pays.filter(p=>!p.on);
 const perMonth=sum(on,p=>p.every==='w'?p.sum*52/12:p.every==='y'?p.sum/12:p.sum);
 h+=`<p class="lede">Регулярные платежи: аренда, коммуналка, подписки, кредиты. Ритм напомнит о дате и заранее отложит деньги в дневном лимите.</p>`;
 if(S.pays.length) h+=remindPrompt();
 if(on.length) h+=`<section class="card dark hero"><span class="lbl">Обязательные платежи в месяц</span><span class="hero-v md">${money(perMonth)}</span><p class="note">${S.budget?`${Math.round(perMonth/S.budget*100)}% бюджета`:''}${on.length?` · ${pl(on.length,['платёж','платежа','платежей'])}`:''}</p></section>`;
 const od=on.filter(p=>p.next<t), m=on.filter(p=>p.next>=t&&dBetween(t,p.next)<=31), later=on.filter(p=>dBetween(t,p.next)>31);
 if(od.length) h+=`<h2 class="sec-h bad-t">Просрочены</h2><div class="list">${od.map(p=>payRow(p)).join('')}</div>`;
 if(m.length) h+=`<h2 class="sec-h">Ближайший месяц</h2><div class="list">${m.map(p=>payRow(p)).join('')}</div>`;
 if(later.length) h+=`<h2 class="sec-h">Позже</h2><div class="list">${later.map(p=>payRow(p,false)).join('')}</div>`;
 if(off.length) h+=`<h2 class="sec-h mut">На паузе</h2><div class="list">${off.map(p=>payRow(p,false)).join('')}</div>`;
 if(!S.pays.length) h+=`<div class="card">${empty('cal','Добавьте платежи, которые повторяются: аренда, интернет, кредит. В день оплаты они появятся на «Обзоре».')}</div>`;
 h+=`<button class="btn pri blk" data-a="payNew">${ic('plus',18)} Добавить платёж</button>`;
 return `<div class="col">${h}</div>`; };

/* ---------- Отчёты ---------- */
VIEWS.rep=()=>{ const p=periodOf(ui.per); const prev=periodOf(shiftPeriod(p.from,-1)); const st=budgetStats(p);
 let h=topBar()+`<div class="between"><h1 class="h1">Отчёты</h1>${perNav()}</div>`;
 const ops=opsIn(p); const exp=ops.filter(o=>o.t==='exp'); const tot=sum(exp,o=>o.sum); const inc=sum(ops.filter(o=>o.t==='inc'),o=>o.sum);
 const days=st.cur?dBetween(p.from,dkey())+1:st.days;
 h+=`<div class="stats s2"><div class="stat"><span class="stat-v">${money(tot)}</span><span class="stat-l">расходы</span></div><div class="stat"><span class="stat-v">${money(inc)}</span><span class="stat-l">доходы</span></div><div class="stat"><span class="stat-v">${money(days?tot/days:0)}</span><span class="stat-l">в среднем за день</span></div><div class="stat"><span class="stat-v ${inc-tot>=0?'good-t':'bad-t'}">${money(inc-tot,true)}</span><span class="stat-l">${inc-tot>=0?'осталось от доходов':'расходы больше доходов'}</span></div></div>`;
 if(tot){ const by={}; for(const o of exp) by[o.cat]=(by[o.cat]||0)+o.sum; const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const top=rows.slice(0,7), rest=rows.slice(7); const parts=top.map(([c,v],i)=>({n:catOf(c).n,v,c:PALETTE[i%PALETTE.length]})); if(rest.length) parts.push({n:'Остальное',v:sum(rest,r=>r[1]),c:'var(--faint)'});
  h+=`<section class="card col-s"><h2 class="sec-h">Куда ушли деньги</h2><div class="donut-w">${donut(parts,190)}<div class="donut-c"><span class="lbl">всего</span><span class="b num">${moneyShort(tot)} ₸</span></div></div><div class="col-s">${rows.map(([c,v],i)=>{ const pv=spentIn(prev,c); const d=pv?(v-pv)/pv*100:null; const col=i<7?PALETTE[i%PALETTE.length]:'var(--faint)'; return `<button class="catrow" data-a="opsCat" data-v="${c}"><span class="dot" style="background:${col}"></span><span class="grow">${esc(catOf(c).n)}</span><span class="note num">${Math.round(v/tot*100)}%</span><span class="num b" style="min-width:92px;text-align:right">${money(v)}</span></button>${d!=null&&Math.abs(d)>=10?`<p class="note" style="margin:-6px 0 0 22px">${d>0?'↑':'↓'} на ${fmt(Math.abs(d),0)}% к прошлому месяцу</p>`:''}`; }).join('')}</div></section>`;
  const big=[...exp].sort((a,b)=>b.sum-a.sum).slice(0,3);
  h+=`<section class="col-s"><h2 class="sec-h">Самые крупные траты</h2><div class="list">${big.map(opRow).join('')}</div></section>`; }
 else h+=`<div class="card">${empty('chart','В этом месяце расходов нет — отчёт появится после первых операций.')}</div>`;
 const cols=[]; for(let i=5;i>=0;i--){ const pp=periodOf(shiftPeriod(p.from,-i)); const e=spentIn(pp), n=incomeIn(pp); cols.push({e,n,label:MON_SN[pkey(pp.from).getMonth()],cur:i===0}); }
 if(cols.some(c=>c.e||c.n)){ const max=Math.max(1,...cols.map(c=>Math.max(c.e,c.n)));
  h+=`<section class="card col-s"><h2 class="sec-h">Доходы и расходы за полгода</h2><div class="bars2">${cols.map(c=>`<div class="b2"><div class="b2-t"><i class="inc" style="height:${(c.n/max*100).toFixed(1)}%"></i><i class="exp" style="height:${(c.e/max*100).toFixed(1)}%"></i></div><span class="bc-l${c.cur?' acc-t b':''}">${c.label}</span></div>`).join('')}</div><div class="legend"><span><i class="lg" style="background:var(--good)"></i>доходы</span><span><i class="lg" style="background:var(--accent-soft)"></i>расходы</span></div></section>`; }
 return `<div class="col">${h}</div>`; };

/* ============ Ритм·Деньги — листы ============ */
function accChips(act,cur,withJars,exclude){ const L=[...S.accs.map(a=>[a.id,`${ic(ACC_IC[a.kind]||'card',16)} ${esc(a.n)}`])]; if(withJars) S.jars.forEach(j=>L.push(['jar:'+j.id,`${ic('piggy',16)} ${esc(j.n)}`]));
 return `<div class="chips">${L.filter(([v])=>v!==exclude).map(([v,l])=>`<button class="chip ichip" data-a="${act}" data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div>`; }
function opHint(o){ const v=kpValue(ui.kp&&ui.kp.v); if(o.t!=='exp'||!o.cat) return '';
 const c=catOf(o.cat); const p=periodOf(o.date); let spent=spentIn(p,c.id); if(o.id){ const old=findOp(o.id); if(old&&old.t==='exp'&&old.cat===c.id&&old.date>=p.from&&old.date<=p.to) spent-=old.sum; }
 const after=spent+v;
 if(c.lim){ const left=c.lim-after; return left>=0?`<div class="callout acc"><p>${esc(c.n)}: после операции останется <b>${money(left)}</b> из ${money(c.lim)}</p></div>`:`<div class="callout" style="background:var(--bad-tint);color:var(--bad)"><p>${esc(c.n)}: лимит будет превышен на <b>${money(-left)}</b></p></div>`; }
 const st=budgetStats(p); const left=st.left-v+(o.id&&findOp(o.id)&&findOp(o.id).t==='exp'?findOp(o.id).sum:0);
 return `<div class="callout mut"><p>В бюджете месяца останется <b>${money(left)}</b></p></div>`; }
function catTiles(o){ const all=sortedCats(o.t); const showAll=ui.catsAll||all.length<=8; let L=showAll?all:all.slice(0,7);
 if(!showAll&&o.cat&&!L.some(c=>c.id===o.cat)) L=[...L.slice(0,6),catOf(o.cat)];
 return `<div class="tiles">${L.map(c=>`<button class="tile-b" data-a="opCat" data-v="${c.id}" aria-pressed="${o.cat===c.id}"><span class="tile-i">${ic(c.ic,20)}</span><span class="tile-l">${esc(c.n)}</span></button>`).join('')}${showAll?'':`<button class="tile-b" data-a="catsAll"><span class="tile-i">${ic('dots',20)}</span><span class="tile-l">Все</span></button>`}</div>`; }
SH.op=()=>{ const o=ui.op; if(!o) return sheet({title:'Операция',body:''}); const isEdit=!!o.id; const v=kpValue(ui.kp.v);
 let b=seg([['exp','Расход'],['inc','Доход'],['tr','Перевод']],'opT',o.t,'Тип операции');
 b+=`<div class="amt"><span class="amt-v${v?'':' empty'}${o.t==='inc'?' good-t':''}" aria-live="polite">${v?(o.t==='exp'?'−':o.t==='inc'?'+':'')+fmt(v,2)+' ₸':'0 ₸'}</span><span class="amt-x">${ui.kp.v&&ui.kp.v.includes('+')?esc(ui.kp.v.replace(/\+/g,' + '))+' =':''}</span></div>`;
 if(o.t==='tr'){ b+=`<div class="col-xs"><span class="lbl">Откуда</span>${accChips('opAcc',o.acc,true,null)}</div><div class="col-xs"><span class="lbl">Куда</span>${accChips('opTo',o.to,true,o.acc)}</div>`; }
 else { if(!isEdit&&!kpValue(ui.kp.v)){ const fq=frequentOps(o.t); if(fq.length) b+=`<div class="scroller">${fq.map(x=>`<button class="chip ichip" data-a="opQuick" data-id="${x.id}">${ic(catOf(x.cat).ic,14)} ${esc(x.note||catOf(x.cat).n)} · ${money(x.sum)}</button>`).join('')}</div>`; } b+=catTiles(o); }
 b+=opHint(o);
 const t=dkey(); const dch=[[t,'Сегодня'],[addDays(t,-1),'Вчера']];
 const accs=o.t!=='tr'&&S.accs.length>1?S.accs.map(a=>`<button class="chip ichip" data-a="opAcc" data-v="${a.id}" aria-pressed="${o.acc===a.id}">${ic(ACC_IC[a.kind]||'card',16)} ${esc(a.n)}</button>`).join(''):'';

 b+=`<input class="inp sm" id="opNote" type="text" placeholder="Комментарий" value="${esc(o.note||'')}" data-i="opNote" maxlength="80" enterkeyhint="done">`;

 return sheet({title:isEdit?'Операция':'Новая операция',left:'close',body:b,foot:keypad({dec:true})+`<button class="btn pri blk big-btn" data-a="opSave"${ok?'':' disabled'}>${v?'Сохранить '+money(v):'Введите сумму'}</button>`}); };

 if(Family.has('tseli')) b+=`<div class="callout mut"><p>${lchip('tseli')}</p><p>Эта копилка видна как цель в Ритм·Цели — прогресс обновляется сам.</p></div>`;
 const hist=allOps().filter(o=>o.t==='tr'&&(o.to==='jar:'+j.id||o.acc==='jar:'+j.id)); if(hist.length) b+=`<h2 class="sec-h">История</h2><div class="list">${hist.slice(0,30).map(opRow).join('')}</div>`;
 b+=ui.confirm==='jardel'?confirmBox(bal?`В копилке ${money(bal)}. Удалить её? Переводы останутся в истории.`:'Удалить копилку?','jarDel','Удалить',`data-x="${j.id}"`):`<button class="btn ghost danger-t self-start" data-a="ask" data-v="jardel" style="padding:0">Удалить копилку</button>`;
 return sheet({title:j.n,body:b}); };

 let b=`<label class="fld"><span class="lbl">Название</span><input class="inp" id="payName" type="text" value="${esc(p.n)}" placeholder="Например, аренда" maxlength="40" data-c="payName" data-x="${p.id}"></label>${moneyField('Сумма, ₸',p.sum,'paySum',p.id)}`;
 b+=`<div class="col-xs"><span class="lbl">Как часто</span>${chips(Object.entries(EVERY),'payEvery',p.every,`data-x="${p.id}"`)}</div>`;

 if(S.accs.length>1) b+=`<div class="col-xs"><span class="lbl">Со счёта</span><div class="chips">${S.accs.map(a=>`<button class="chip" data-a="payAcc" data-x="${p.id}" data-v="${a.id}" aria-pressed="${p.acc===a.id}">${esc(a.n)}</button>`).join('')}</div></div>`;
 b+=`<div class="chips"><button class="chip" data-a="payOn" data-x="${p.id}" aria-pressed="${!p.on}">Поставить на паузу</button></div>`;
 const hist=allOps().filter(o=>o.pay===p.id).slice(0,12); if(hist.length) b+=`<h2 class="sec-h">Оплаты</h2><div class="list">${hist.map(opRow).join('')}</div>`;
 b+=ui.confirm==='paydel'?confirmBox('Удалить платёж? Прошлые оплаты останутся в операциях.','payDel','Удалить',`data-x="${p.id}"`):`<button class="btn ghost danger-t self-start" data-a="ask" data-v="paydel" style="padding:0">Удалить платёж</button>`;
 const t=dkey(); const due=p.on&&dBetween(t,p.next)<=3;
 return sheet({title:p.n||'Новый платёж',body:b,foot:due&&p.sum>0&&!p.fresh?`<div class="split"><button class="btn sec" data-a="paySkip" data-id="${p.id}">Пропустить</button><button class="btn acc" data-a="payDo" data-id="${p.id}">Оплачено</button></div>`:''}); };

 b+=`<section class="list"><button class="li" data-a="push" data-s="cats"><span class="ico">${ic('list',20)}</span><span class="li-m"><span class="li-t">Категории и лимиты</span><span class="li-s">${expCats().length} расходов, ${incCats().length} доходов</span></span><span class="chev">${ic('right',18)}</span></button><button class="li" data-a="imOpen"><span class="ico">${ic('copy',20)}</span><span class="li-m"><span class="li-t">Импорт выписки</span><span class="li-s">Перенести операции из банка разом</span></span><span class="chev">${ic('right',18)}</span></button><button class="li" data-a="push" data-s="accs"><span class="ico">${ic('card',20)}</span><span class="li-m"><span class="li-t">Счета</span><span class="li-s">${S.accs.map(a=>esc(a.n)).join(', ')}</span></span><span class="chev">${ic('right',18)}</span></button></section>`;
 b+=remindCard(`<span class="lbl">Во сколько напоминать о платежах</span>${timeChips('remTime',(S.remind&&S.remind.time)||'10:00')}`);
 b+=themeCard()+familyCard()+dataCard();
 return sheet({title:'Настройки',body:b}); };
SH.accs=()=>sheet({title:'Счета',body:`<div class="list">${S.accs.map(a=>`<button class="li" data-a="push" data-s="acc" data-id="${a.id}"><span class="ico">${ic(ACC_IC[a.kind]||'card',20)}</span><span class="li-m"><span class="li-t">${esc(a.n)}</span></span><span class="li-e">${money(accBal(a.id))}</span></button>`).join('')}</div><button class="btn sec blk" data-a="accNew">${ic('plus',18)} Добавить счёт</button>`});

SH.onboard=()=>{ const o=ui.ob||(ui.ob={step:1,budget:'',card:'',cash:'',pstart:1}); const st=o.step;
 const dots=`<div class="dots">${[1,2,3].map(i=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>`; let b='', foot='';
 if(st===1){ ui.kp=ui.kp&&ui.kp.ob===1?ui.kp:{v:o.budget,ob:1,on:v=>{ o.budget=ui.kp.v; }}; const v=kpValue(ui.kp.v);
  b=`${dots}<div class="col-xs"><span class="eyebrow-l">Шаг 1 из 3</span><h1 class="h1">Сколько вы готовы тратить в месяц?</h1><p class="lede">Ритм покажет, сколько можно тратить каждый день, чтобы уложиться. Сумму можно поменять в любой момент.</p></div><div class="amt"><span class="amt-v${v?'':' empty'}">${v?fmt(v,0):'0'} ₸</span></div>${keypad({dec:false,plus:false})}`;
  foot=`<button class="btn pri blk" data-a="obNext"${v>0?'':' disabled'}>Дальше</button>`; }
 else if(st===2){ b=`${dots}<div class="col-xs"><span class="eyebrow-l">Шаг 2 из 3</span><h1 class="h1">С какого числа считать месяц?</h1><p class="lede">Обычно — с первого. Если живёте от зарплаты до зарплаты, выберите день зарплаты.</p></div>${chips([1,5,10,15,20,25].map(d=>[d,d===1?'1 число':d+' число']),'obPstart',o.pstart)}`;
  foot=`<div class="split"><button class="btn sec" data-a="obPrev">Назад</button><button class="btn pri" data-a="obNext">Дальше</button></div>`; }
 else { b=`${dots}<div class="col-xs"><span class="eyebrow-l">Шаг 3 из 3</span><h1 class="h1">Сколько денег сейчас?</h1><p class="lede">Нужно, чтобы видеть баланс счетов. Можно пропустить и указать позже.</p></div><label class="fld"><span class="lbl">На карте, ₸</span><input class="inp money-in" type="text" inputmode="numeric" value="${esc(o.card)}" placeholder="0" data-i="obCard"></label><label class="fld"><span class="lbl">Наличными, ₸</span><input class="inp money-in" type="text" inputmode="numeric" value="${esc(o.cash)}" placeholder="0" data-i="obCash"></label><div class="callout acc"><p>Лимиты по категориям распределим автоматически — например, продукты ${money(round1000(kpValue(o.budget)*.25))}. Их легко поправить в настройках.</p></div>`;
  foot=`<div class="split"><button class="btn sec" data-a="obPrev">Назад</button><button class="btn pri" data-a="obDone">Готово</button></div>`; }
 return sheet({title:'Ритм·Деньги',left:'',body:b,foot}); };

/* ============ Ритм·Деньги — действия ============ */
function ACC_FN(k,x){ if(k==='pstart') return {get:()=>S.pstart,set:v=>{ S.pstart=clamp(Math.round(v),1,28); ui.per=curPeriod().from; },step:1}; return null; }
function newOp(t,extra={}){ const today=dkey(); const o={t,cat:null,acc:S.last.acc&&S.accs.some(a=>a.id===S.last.acc)?S.last.acc:S.accs[0].id,to:null,date:today,note:''};
 if(t==='exp'||t==='inc'){ const L=sortedCats(t); o.cat=L.some(c=>c.id===S.last[t])?S.last[t]:(L[0]&&L[0].id); }
 if(t==='tr'){ const other=S.accs.find(a=>a.id!==o.acc); o.to=other?other.id:(S.jars[0]?'jar:'+S.jars[0].id:null); }
 return Object.assign(o,extra); }
function openOp(o,v=''){ ui.op=o; ui.kp={v}; ui.catsAll=false; ui.confirm=null; ui.stack.push({type:'op',id:o.id||'new'}); render(); }
function spreadLimits(){ const E=S.cats.filter(c=>c.kind==='exp'); const lims=sum(E,c=>c.lim||0); for(const c of E){ const share=lims?((c.lim||0)/lims):((c.pct||0)/100); c.lim=round1000(S.budget*share); } }
function closeTop(){ ui.stack.pop(); ui.confirm=null; }
Object.assign(A,{
 perShift:d=>{ ui.per=shiftPeriod(ui.per,Number(d.v)); render(); },
 perNow:()=>{ ui.per=curPeriod().from; render(); },
 opNew:d=>openOp(newOp(d.v||'exp')),
 opEdit:d=>{ const o=findOp(d.id); if(!o) return; openOp(Object.assign({},o),fmtIn(o.sum)); },
 opT:d=>{ const o=ui.op; if(o.t===d.v) return; const n=newOp(d.v,{id:o.id,date:o.date,note:o.note,ts:o.ts}); if(d.v!=='tr'&&o.acc&&!o.acc.startsWith('jar:')) n.acc=o.acc; ui.op=n; render(); },
 opCat:d=>{ ui.op.cat=d.v; render(); },
 catsAll:()=>{ ui.catsAll=true; render(); },
 catAll:()=>{ ui.catAll=!ui.catAll; render(); },
 opAcc:d=>{ const o=ui.op; o.acc=d.v; if(o.t==='tr'&&o.to===d.v){ const other=S.accs.find(a=>a.id!==d.v); o.to=other?other.id:(S.jars.find(j=>'jar:'+j.id!==d.v)?'jar:'+S.jars.find(j=>'jar:'+j.id!==d.v).id:null); } render(); },
 opTo:d=>{ ui.op.to=d.v; render(); },
 opDate:d=>{ ui.op.date=d.v; render(); },
 opSave:()=>{ const o=ui.op; const v=kpValue(ui.kp.v); if(!(v>0)) return; const note=(o.note||'').trim().slice(0,80);
  const op={id:o.id||('o'+uid()),t:o.t,sum:v,acc:o.acc,date:o.date,note,ts:o.ts||Date.now()}; if(o.t==='tr') op.to=o.to; else op.cat=o.cat; if(o.pay) op.pay=o.pay;
  const was=o.id?delOp(o.id):null; addOp(op);
  if(!was&&op.cat){ S.use[op.cat]=(S.use[op.cat]||0)+1; S.last[op.t]=op.cat; } if(op.t!=='tr'&&!op.acc.startsWith('jar:')) S.last.acc=op.acc;
  ui.op=null; ui.kp=null; closeTop(); Store.save(); render();
  const label=op.t==='tr'?`Перевод ${money(v)} → ${accOf(op.to).n}`:`${op.t==='exp'?'−':'+'}${money(v)} · ${catOf(op.cat).n}`;
  vibrate(12);
  toast((was?'Изменено: ':'Записано: ')+label,was?null:()=>{ delOp(op.id); Store.save(); render(); toast('Операция отменена'); }); },
 opDel:()=>{ const o=ui.op; const old=delOp(o.id); ui.op=null; ui.kp=null; closeTop(); Store.save(); render(); if(old) toast('Операция удалена',()=>{ addOp(old); Store.save(); render(); }); },
 opsCat:d=>{ ui.opf={t:'exp',cat:d.v,q:''}; ui.tab='ops'; ui.stack=[]; render(); window.scrollTo(0,0); },
 opfT:d=>{ ui.opf.t=d.v; render(); },
 opfCat:d=>{ ui.opf.cat=d.v; render(); },
 budAdd:d=>{ S.budget=Math.max(0,S.budget+Number(d.v)); commit(); },

/* ============ Ритм·Деньги — импорт выписки и частые траты ============ */
/* Правила категорий по названию продавца. Свои правила пользователя (S.merch) важнее. */
const MERCH_RULES=[
 ['food',/magnum|small|galmart|анвар|anvar|ramstore|toimart|арзан|metro|супермаркет|продукт|minimarket|минимаркет|market|маркет|dina|fix price|astykzhan|астыкжан/i],
 ['cafe',/glovo|wolt|яндекс ?еда|yandex ?eda|chocofood|kfc|burger|бургер|coffee|кофе|caf[eé]|кафе|ресторан|restaurant|starbucks|mcdonald|макдон|doner|донер|пицц|pizza|sushi|суши|столов|бар |bar /i],
 ['transport',/yandex ?go|яндекс ?go|такси|taxi|onay|онай|автобус|uber|indriver|indrive|азс|бензин|helios|sinooil|qazaq ?oil|kazmunaygas|гелиос|парковк|parking|ktzh|ктж|air ?astana|scat|fly ?arystan|авиа/i],
 ['phone',/beeline|билайн|kcell|activ|актив|tele2|теле2|altel|алтел|казахтелеком|kazakhtelecom|интернет/i],
 ['health',/аптек|apteka|биосфер|europharma|клиник|clinic|invitro|инвитро|kdl|стомат|медцентр|медицин/i],
 ['home',/коммун|alseco|алсеко|ерц|кск|оси |osi |энерго|электр|водоканал|газ|аренд|ikea|икеа|leroy|леруа|мебел|хозтовар/i],
 ['clothes',/zara|lc ?waikiki|h&m|adidas|nike|одежд|обувь|reebok|puma|mango|defacto|koton|bershka/i],
 ['sport',/fitness|фитнес|gym|спортзал|invictus|sportmaster|спортмастер|бассейн|pool/i],
 ['fun',/кино|kinopark|chaplin|steam|netflix|spotify|яндекс ?плюс|yandex ?plus|ivi|playstation|игр|театр|концерт|ticketon|kassir/i],
 ['edu',/курс|udemy|coursera|школ|университет|книг|меломан|meloman|marwin|skillbox|обучени/i],
 ['credit',/кредит|рассрочк|погашени|займ|ипотек/i],
 ['gifts',/цвет|flowers|подар|gift/i]
];
const INC_RULES=[['salary',/зарплат|salary|заработн|зп /i],['refund',/кэшбэк|cashback|бонус|возврат/i]];
const OWN_RE=/между своими|на kaspi депозит|с kaspi депозита|на депозит|с депозита|own account|собственн/i;
const MK_STOP=new Set(['покупка','оплата','платеж','пополнение','зачисление','kz','kaz','almaty','алматы','astana','астана','тоо','ип','too','llp']);
function merchKey(desc){ return norm(desc).replace(/[^a-zа-я0-9 ]/gi,' ').split(/\s+/).filter(w=>w&&!MK_STOP.has(w)&&!/^\d+$/.test(w)).slice(0,2).join(' '); }
function norm(s){ return String(s||'').toLowerCase().replace(/ё/g,'е').trim(); }
function guessCat(desc,t){ const k=merchKey(desc); if(k&&S.merch&&S.merch[k]&&catOf(S.merch[k]).kind===(t==='inc'?'inc':'exp')) return S.merch[k];
 if(t==='inc'){ for(const [c,re] of INC_RULES) if(re.test(desc)) return c; return 'inc_other'; }
 for(const [c,re] of MERCH_RULES) if(re.test(desc)&&S.cats.some(x=>x.id===c)) return c; return 'other'; }
const DATE_RE=/^\s*(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})|^\s*(\d{4})-(\d{2})-(\d{2})/;
const AMT_RE=/([+\-−–]?)\s*(\d{1,3}(?:[   ]\d{3})+|\d+)(?:[.,](\d{1,2}))?\s*(?:₸|kzt|тг|тенге)?/i;
function parseStatement(text){ const lines=String(text||'').replace(/\r/g,'').split('\n').map(l=>l.replace(/[;\t]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean); const rows=[];
 for(const line of lines){ const dm=line.match(DATE_RE);
  if(!dm){ if(rows.length&&line.length<80&&!/итого|баланс|остаток|доступно|страниц|выписк/i.test(line)) rows[rows.length-1].desc=(rows[rows.length-1].desc+' '+line).trim(); continue; }
  let y,m,d; if(dm[4]){ y=+dm[4]; m=+dm[5]; d=+dm[6]; } else { d=+dm[1]; m=+dm[2]; y=+dm[3]; if(y<100) y+=2000; }
  if(m<1||m>12||d<1||d>31) continue; const date=dkey(new Date(y,m-1,d,12)); let rest=line.slice(dm[0].length).trim();
  rest=rest.replace(/^\d{1,2}:\d{2}(:\d{2})?\s*/,'').replace(/^\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4}\s*/,'');
  const am=rest.match(AMT_RE); if(!am) continue; const sum=parseFloat(am[2].replace(/[   ]/g,'')+(am[3]?'.'+am[3]:'')); if(!(sum>0)) continue;
  let desc=(rest.slice(0,am.index)+' '+rest.slice(am.index+am[0].length)).replace(/\s+/g,' ').trim();
  let t=am[1]==='+'?'inc':am[1]?'exp':(/пополнени|зачислени|поступлени|возврат|зарплат|кэшбэк|cashback|получен/i.test(desc)?'inc':'exp');
  rows.push({date,sum:Math.round(sum*100)/100,t,desc}); }
 for(const r of rows){ r.desc=r.desc.replace(/^(покупка|оплата)\s+/i,'').slice(0,80); r.own=OWN_RE.test(r.desc); r.cat=guessCat(r.desc,r.t); r.dup=allOps().some(o=>o.date===r.date&&Math.abs(o.sum-r.sum)<0.01&&o.t===r.t); r.on=!r.dup&&!r.own; }
 return rows; }

 b+=`<div class="list">${R.map((r,i)=>`<div class="imrow${r.on?'':' off'}"><button class="chk-hit" data-a="imTog" data-v="${i}" aria-pressed="${r.on}" aria-label="Переносить"><span class="chk${r.on?' on':''}">${ic('check',16)}</span></button><span class="grow col-xs" style="min-width:0"><span class="row-b"><span class="b imdesc">${esc(r.desc||'Без описания')}</span><span class="num b ${r.t==='inc'?'good-t':''}">${r.t==='inc'?'+':'−'}${money(r.sum)}</span></span><span class="row wrap gap6"><span class="note">${fmtDay(r.date)}</span>${r.dup?'<span class="badge mut">уже есть</span>':''}${r.own?'<span class="badge mut">свой перевод</span>':''}<select class="imsel" data-c="imCat" data-x="${i}" aria-label="Категория">${catOpts(r.t).map(c=>`<option value="${c.id}"${c.id===r.cat?' selected':''}>${esc(c.n)}</option>`).join('')}</select></span></span></div>`).join('')}</div>`;
 b+=`<p class="note">Категории запоминаются: в следующий раз тот же продавец попадёт в ту же категорию.</p>`;
