<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ритм">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F1EC">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="ritm-ios.css">
<script>window.RITM_APP=true;window.RITM_IOS=true;window.RITM_PAGE='pit'</script>
<script src="ritm-ios.js"></script>
<script src="family.js"></script>
</head>
<body>
<title>Ритм·Питание</title>
<style>
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --sunk:#EFEBE4; --line:#E6E0D6; --ink:#17161A; --muted:#5F5A52; --faint:#8C867C;
  --accent:#F2B33D; --accent-ink:#8A5A0B; --accent-tint:#FCEFD2; --accent-soft:#F7D58C; --on-accent:#17161A;
  --btn:#17161A; --on-btn:#FFFFFF;
  --dark-card:#17161A; --on-dark:#FFFFFF; --on-dark-muted:#CFCBC4; --dk-eyebrow:#F5C76A; --dk-line:#2E2C30;
  --good:#2F7A4D; --good-tint:#E3F2E8; --on-good:#FFFFFF;
  --warn:#8A5A0B; --warn-tint:#FCEFD2; --warn-ink:#6B4507;
  --bad:#B42318; --bad-tint:#FDE7E4; --on-bad:#FFFFFF;
  --shadow:rgba(23,22,26,.18);
  --c-telo:#F0643C; --c-dengi:#2FA36B; --c-pit:#E0A22E; --c-tseli:#6E63F2;
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-lg:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --card:#1E1C1A; --sunk:#292623; --line:#36322E; --ink:#F2EEE8; --muted:#AFA89E; --faint:#7E776E;
  --accent:#F2B33D; --accent-ink:#F5C76A; --accent-tint:#33280F; --accent-soft:#7A5A1C; --on-accent:#17161A;
  --btn:#F2EEE8; --on-btn:#17161A;
  --dark-card:#2B2724; --on-dark:#F2EEE8; --on-dark-muted:#BDB5AA; --dk-eyebrow:#F5C76A; --dk-line:#3E3934;
  --good:#7CCB9A; --good-tint:#1B2C21; --on-good:#0F1F15;
  --warn:#E9B455; --warn-tint:#33280F; --warn-ink:#F2C46A;
  --bad:#FF8A7A; --bad-tint:#3A1C18; --on-bad:#2A0F0B;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121110; --card:#1E1C1A; --sunk:#292623; --line:#36322E; --ink:#F2EEE8; --muted:#AFA89E; --faint:#7E776E;
  --accent:#F2B33D; --accent-ink:#F5C76A; --accent-tint:#33280F; --accent-soft:#7A5A1C; --on-accent:#17161A;
  --btn:#F2EEE8; --on-btn:#17161A;
  --dark-card:#2B2724; --on-dark:#F2EEE8; --on-dark-muted:#BDB5AA; --dk-eyebrow:#F5C76A; --dk-line:#3E3934;
  --good:#7CCB9A; --good-tint:#1B2C21; --on-good:#0F1F15;
  --warn:#E9B455; --warn-tint:#33280F; --warn-ink:#F2C46A;
  --bad:#FF8A7A; --bad-tint:#3A1C18; --on-bad:#2A0F0B;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px calc(100px + env(safe-area-inset-bottom,0px))}
.col{display:flex;flex-direction:column;gap:14px}
.col-s{display:flex;flex-direction:column;gap:10px}
.col-xs{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.gap6{gap:6px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top-al{align-items:flex-start}
.grow{flex:1;min-width:0}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.self-start{align-self:flex-start}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.tile{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);padding:0;flex-shrink:0}
.h1{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.15;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.25;margin:0;text-wrap:balance}
.h3{font-size:17px;font-weight:700;margin:0}
.sec-h{font-size:16px;font-weight:700;margin:0}
.lede{margin:0;color:var(--muted);font-size:14px}
.p{margin:0}
.note{margin:0;color:var(--muted);font-size:13px}
.lbl{font-size:13px;color:var(--muted)}
.mut{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dk-eyebrow)}
.eyebrow-l{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.card{background:var(--card);border-radius:var(--r-lg);padding:16px}
.card.dark{background:var(--dark-card);color:var(--on-dark)}
.dk-t{font-size:20px;font-weight:600;margin:0}
.dk-s,.dk-note{margin:0;font-size:14px;color:var(--on-dark-muted)}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.good{background:var(--good-tint);color:var(--good)}
.badge.warn{background:var(--warn-tint);color:var(--warn-ink)}
.badge.bad{background:var(--bad-tint);color:var(--bad)}
.badge.acc{background:var(--accent-tint);color:var(--accent-ink)}
.badge.mut{background:var(--sunk);color:var(--muted)}
.badge.on-dk{background:var(--dk-line);color:var(--on-dark)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid transparent;font-weight:700;font-size:15px;background:none;color:var(--ink);text-align:center}
.btn.pri{background:var(--btn);color:var(--on-btn)}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.sec{border-color:var(--ink);color:var(--ink)}
.btn.sec-dk{border-color:var(--on-dark-muted);color:var(--on-dark)}
.btn.ghost{color:var(--accent-ink);padding:0 10px;min-height:40px;font-weight:600}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.danger-t{color:var(--bad)!important}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.blk{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn:active:not([disabled]){transform:scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent-ink);background:var(--accent-tint);color:var(--accent-ink)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex-shrink:0}
.ready{display:flex;gap:16px;align-items:center}
.ring .rt{fill:none;stroke:var(--sunk);stroke-width:10}
.ring .rv{fill:none;stroke-width:10;stroke-linecap:round;stroke-dashoffset:var(--off)}
.ring.anim .rv{animation:ringIn 1s cubic-bezier(.2,.8,.2,1)}
@keyframes ringIn{from{stroke-dashoffset:var(--full)}}
.ring .rn{font-family:var(--f-display);font-size:28px;font-weight:600;fill:var(--ink)}
.ring .rl{font-size:11px;fill:var(--muted);font-family:var(--f-body)}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--dk-line);align-items:baseline}
.pi:first-child{border-top:none}
.pi-n{font-weight:500;text-align:left;background:none;border:none;padding:0;color:inherit;min-width:0}
.pi-v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.pi-r{grid-column:1/-1;font-size:12px;color:var(--muted)}
.plan-list.lt .pi{border-top-color:var(--line)}
.lnk{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wd-dot{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--on-accent);box-sizing:border-box}
.wd.plan .wd-dot{background:transparent;border:2px dashed var(--accent)}
.wd.done .wd-dot{background:var(--accent);border:none}
.wd.today .wd-l{color:var(--ink);font-weight:700}
.wd.today .wd-dot{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.lg{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-sizing:border-box}
.lg.done{background:var(--accent)} .lg.plan{border:2px dashed var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats.s2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:var(--sunk);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat-v{font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.stat-l{font-size:12px;color:var(--muted)}
.list{background:var(--card);border-radius:var(--r-lg);padding:2px 16px}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 0;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.li:last-child{border-bottom:none}
.li-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li-t{font-weight:600}
.li-s{font-size:13px;color:var(--muted)}
.li-e{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .chev{color:var(--faint);flex-shrink:0}
.grp-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 -6px}
.stp{display:flex;flex-direction:column;gap:6px;min-width:0}
.stp-c{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;background:var(--sunk);border-radius:16px;padding:4px}
.stp-b{width:44px;height:44px;border-radius:12px;border:none;background:var(--card);font-size:22px;font-weight:600;color:var(--accent-ink);padding:0}
.stp-v{width:100%;min-width:0;border:none;background:transparent;text-align:center;font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;color:var(--ink)}
.stp-v:focus{outline:none}
.stp-c:focus-within{box-shadow:0 0 0 2px var(--accent)}
.sets{display:flex;flex-direction:column;gap:6px}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes fadeUp{from{transform:translateY(-4px);opacity:.6}}
.warn-t{color:var(--warn)}
#sheet{position:fixed;inset:0;z-index:30;background:var(--bg)}
.sh{display:flex;flex-direction:column;height:100%}
.sh.enter{animation:shIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes shIn{from{transform:translateY(32px);opacity:.4}}
.sh-in{max-width:480px;margin:0 auto;width:100%}
.sh-head{padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.sh-head .sh-in{display:flex;align-items:center;gap:10px;min-height:44px}
.sh-t{flex:1;min-width:0}
.sh-title{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
.sh-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;border:none;background:none;color:var(--muted);font-size:11px;font-weight:500;border-radius:12px;padding:0}
.tab[aria-current="page"]{color:var(--accent-ink);font-weight:700}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.inp{width:100%;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--accent)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:14px;color:var(--muted)}
.search .inp{padding-left:42px}
.callout{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px;align-items:flex-start}
.callout p{margin:0}
.callout.warn{background:var(--warn-tint);color:var(--warn-ink)}
.callout.acc{background:var(--accent-tint);color:var(--accent-ink)}
.callout.good{background:var(--good-tint);color:var(--good)}
.callout.mut{background:var(--sunk);color:var(--ink)}
.callout .btn.ghost{color:inherit;padding:0;min-height:32px;text-decoration:underline;text-underline-offset:3px}
.confirm{background:var(--bad-tint);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;color:var(--bad);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.c-grid{stroke:var(--line);stroke-width:1}
.c-lbl{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.c-area{fill:var(--accent-tint)}
.c-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.c-pt{fill:var(--card);stroke:var(--accent);stroke-width:2}
.c-guide{stroke:var(--faint);stroke-dasharray:3 3}
.c-tip{fill:var(--ink)}
.c-tipt{fill:var(--bg);font-size:12px;font-weight:700;font-family:var(--f-body)}
.c-hit{fill:transparent;cursor:pointer}
.dchip{display:inline-grid;place-items:center;min-width:36px;height:30px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.dchip.on{background:var(--accent-tint);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(156px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px var(--shadow);animation:fadeUp .2s ease-out}
details.card summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:10px}
details.card[open] summary svg{transform:rotate(90deg)}
.tpl{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:14px;width:100%;color:var(--ink)}
.tpl[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tpl-t{font-weight:700;font-size:16px}
.splash{display:grid;place-items:center;min-height:50vh;color:var(--muted);text-align:center}
.seg2{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--card);border-radius:999px;padding:3px}
.seg2-b{min-height:34px;padding:0 12px;border:none;border-radius:999px;background:none;font-size:13px;font-weight:600;color:var(--muted)}
.seg2-b[aria-checked="true"]{background:var(--accent-tint);color:var(--accent-ink)}
.ta{min-height:120px;padding:12px 14px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical;line-height:1.4}
.ph{display:grid;place-items:center;text-align:center;gap:8px;padding:28px 16px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* Столбики */
.bars{display:flex;gap:6px;align-items:stretch}
.bc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.bc-v{font-size:11px;font-weight:700;color:var(--muted);min-height:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bc-t{width:100%;height:110px;display:flex;align-items:flex-end;background:var(--sunk);border-radius:8px;overflow:hidden}
.bc-t i{display:block;width:100%;background:var(--accent-soft);border-radius:8px 8px 0 0;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.bc.cur .bc-t i{background:var(--accent)} .bc.cur .bc-v,.bc.cur .bc-l{color:var(--accent-ink)}
.bc.dim .bc-t i{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 5px,var(--accent-tint) 5px 10px)}
.bc-l{font-size:11px;min-height:15px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.bars.dense .bc-l{font-size:10px;overflow:visible;text-overflow:clip;max-width:none} .bars.dense .bc-v{font-size:10px}
.bc-s{font-size:10px;color:var(--faint);white-space:nowrap}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.seg2-b[disabled]{opacity:.4}
/* Сегмент во всю ширину */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;background:var(--sunk);border-radius:999px;padding:3px}
.seg-b{min-height:40px;padding:0 8px;border:none;border-radius:999px;background:none;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-b[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.seg.on-card{background:var(--sunk)}
/* Главная карточка-число */
.hero{display:flex;flex-direction:column;gap:10px}
.hero-v{font-family:var(--f-display);font-size:36px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.hero-v.md{font-size:28px}
.hero-v small{font-size:.5em;font-weight:500;color:inherit;opacity:.75;margin-left:4px}
.card.dark .lbl,.card.dark .note{color:var(--on-dark-muted)}
.pbar{position:relative;height:8px;border-radius:4px;background:var(--sunk);overflow:visible}
.card.dark .pbar{background:var(--dk-line)}
.pbar>i{display:block;height:100%;border-radius:4px;background:var(--accent);max-width:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pbar.over>i{background:var(--bad)}

/* ---------- Норма ---------- */
function bmr(P){ return 10*P.kg+6.25*P.h-5*P.age+(P.sex==='f'?-161:5); }
/* беременность: обмен по весу до беременности, без похудения; прибавка по триместру — IOM: +0 / +340 / +452 ккал */
function pregP(P=S.profile){ return P&&P.sex==='f'?pregInfo(P.preg):null; }
const PREG_ADD=[0,0,340,452];
function normKcal(P=S.profile){ const i=pregP(P); if(i){ const P0=Object.assign({},P,{kg:P.preg.kg0||P.kg}); return Math.round(bmr(P0)*ACT[P.act][0]+PREG_ADD[i.tri]); } return Math.round(bmr(P)*ACT[P.act][0]*GOALS[P.goal][0]); }
function dayCaf(k){ return sum(dayItems(k),e=>{ const f=food(e.f)||{id:e.f,n:e.n}; return cafPer100(f)*(e.g||0)/100; }); }
function macroTargets(P=S.profile){ const n=normKcal(P); const kgP=pregP(P)&&P.preg.kg0?P.preg.kg0:P.kg; const p=Math.max(pregP(P)?71:0,Math.round(1.6*kgP)), f=Math.round(n*.3/9), c=Math.max(0,Math.round((n-p*4-f*9)/4)); return {p,f,c}; }
/* ---------- Продукты ---------- */
function recipeById(id){ return RECIPES.find(r=>r.id===id)||S.myrec.find(r=>r.id===id)||null; }
function recipeTotals(r){ const t={kcal:0,p:0,f:0,c:0,m:MIC.map(()=>0),g:0}; for(const [fid,g] of r.ing){ const f=food(fid); if(!f) continue; addN(t,scale(f,g)); t.g+=g; } return t; }
function food(id){ if(!id) return null; if(FOODS[id]) return FOODS[id]; if(id.startsWith('r:')){ const r=recipeById(id.slice(2)); if(!r) return null; const t=recipeTotals(r); const k=t.g?100/t.g:0; return {id,n:r.n,cat:'dish',kcal:t.kcal*k,p:t.p*k,f:t.f*k,c:t.c*k,m:t.m.map(v=>v*k),por:[{l:'порция',g:Math.round(t.g/r.srv)}],rec:true}; }
 return S.custom.find(f=>f.id===id)||null; }
function scale(f,g){ const k=g/100; return {kcal:f.kcal*k,p:f.p*k,f:f.f*k,c:f.c*k,m:f.m.map(v=>v*k)}; }
function addN(t,n){ t.kcal+=n.kcal; t.p+=n.p; t.f+=n.f; t.c+=n.c; n.m.forEach((v,i)=>t.m[i]+=v); return t; }
function zero(){ return {kcal:0,p:0,f:0,c:0,m:MIC.map(()=>0)}; }
function pieceG(f){ const p=f&&f.por.find(x=>/^шт|^пачка|^банка|^упаковка|^бутылка|^баночка/.test(x.l)); return p?p.g:100; }
function allFoods(){ return [...Object.values(FOODS),...S.custom]; }
function norm(s){ return String(s||'').toLowerCase().replace(/ё/g,'е').trim(); }
function searchFoods(q,lim=40){ q=norm(q); if(!q) return []; const words=q.split(/\s+/);
 const L=[...allFoods(),...[...RECIPES,...S.myrec].map(r=>food('r:'+r.id))].filter(Boolean);
 const sc=f=>{ const n=norm(f.n); if(!words.every(w=>n.includes(w))) return -1; return (n.startsWith(q)?3:0)+(n.split(/[\s(,]+/).some(w=>w.startsWith(words[0]))?2:0)+(f.raw?0:.5)+(S.recent.some(r=>r.f===f.id)?2:0); };
 return L.map(f=>[f,sc(f)]).filter(x=>x[1]>=0).sort((a,b)=>b[1]-a[1]).slice(0,lim).map(x=>x[0]); }
/* ---------- Дневник ---------- */
function dayRec(k,make){ const b=bucket(mkey(k),make?()=>({days:{}}):null); if(!b) return null; if(!b.days) b.days={}; if(!b.days[k]&&make) b.days[k]={items:[],water:0}; return b.days[k]||null; }
function touchDay(k){ Store.touch(mkey(k)); }
function dayItems(k){ const d=dayRec(k); return d?d.items:[]; }
function dayTotals(k){ const t=zero(); for(const it of dayItems(k)) addN(t,it); return t; }
function activity(k){ const T=Family.read('telo'); if(T){ const ws=T.workouts.filter(w=>w.date===k); const v=Math.round(sum(ws,w=>w.kcal||0)); const d=dayRec(k); const man=d&&d.act?d.act:0; return {v:v+man,telo:v,man,src:'telo',n:ws.length}; } const d=dayRec(k); return {v:d&&d.act?d.act:0,telo:0,man:d&&d.act?d.act:0,src:'manual',n:0}; }
function mealOfNow(){ const h=new Date().getHours(); return h>=5&&h<11?'b':h<16?'l':h<21?'d':'s'; }
function entry(fid,g,meal){ const f=food(fid); const n=scale(f,g); return {id:'e'+uid(),f:fid,n:f.n,g:Math.round(g),meal,kcal:r1(n.kcal),p:r1(n.p),f_:r1(n.f),c:r1(n.c),m:n.m.map(v=>r2(v)),ts:Date.now()}; }
/* В записи жиры хранятся в f_ (поле f занято id продукта) */
function itemN(it){ return {kcal:it.kcal,p:it.p,f:it.f_||0,c:it.c,m:it.m||MIC.map(()=>0)}; }

function pushRecent(fid,g){ S.recent=[{f:fid,g},...S.recent.filter(r=>r.f!==fid)].slice(0,30); }
function weekAvg(k){ const t=zero(); let n=0; for(let i=0;i<7;i++){ const d=addDays(k,-i); const its=dayItems(d); if(!its.length) continue; n++; addN(t,dayTotalsN(d)); } if(!n) return {t,n}; t.kcal/=n; t.p/=n; t.f/=n; t.c/=n; t.m=t.m.map(v=>v/n); return {t,n}; }
function micStatus(i,v,N){ const key=MIC[i]; const nv=N[key]; const pct=nv?v/nv:0; if(key==='na') return {pct,flag:pct>1?'over':''}; return {pct,flag:pct<.5?'low':''}; }
/* ---------- Дома ---------- */
function toGrams(it){ const f=food(it.food); const q=it.qty||0; switch(it.unit){ case 'кг': case 'л': return q*1000; case 'шт': return q*pieceG(f); default: return q; } }
function homeMatch(fid){ const f=food(fid); const nn=f?norm(f.n).split(/[\s(]/)[0]:''; return S.home.filter(it=>it.food===fid||(!it.food&&nn&&norm(it.n).includes(nn))); }
function haveG(fid){ return sum(homeMatch(fid),toGrams); }
function expLeft(it){ return it.exp?dBetween(dkey(),it.exp):null; }
function expLabel(it){ const n=expLeft(it); if(n==null) return ''; if(n<0) return `<span class="bad-t b">просрочено</span>`; if(n===0) return `<span class="bad-t b">до сегодня</span>`; if(n===1) return `<span class="warn-t b">до завтра</span>`; if(n<=3) return `<span class="warn-t b">ещё ${pl(n,DAYS)}</span>`; return `до ${fmtDay(it.exp)}`; }
function qtyText(it){ return fmt(it.qty,it.unit==='кг'||it.unit==='л'?2:0)+' '+it.unit; }
function recipeNeeds(r,srv){ const k=srv/r.srv; return r.ing.map(([fid,g])=>{ const need=g*k; const have=haveG(fid); const f=food(fid); const minor=['salt','oil','olive_oil','sugar','butter'].includes(fid)||(f&&f.cat==='oil'&&need<=30)||(['greens','garlic','lemon'].includes(fid)&&need<=40); return {fid,f,need,have,ok:have>=need*.95||(minor&&have>0),minor}; }); }
function recipeHave(r){ const L=recipeNeeds(r,r.srv); const miss=L.filter(x=>!x.ok&&!x.minor); return {miss,ratio:(L.length-miss.length)/L.length}; }
function recipeServing(r){ const t=recipeTotals(r); const k=1/r.srv; return {kcal:t.kcal*k,p:t.p*k,f:t.f*k,c:t.c*k,g:t.g*k}; }
function writeOff(fid,g){ let left=g; for(const it of homeMatch(fid)){ if(left<=0) break; const have=toGrams(it); const take=Math.min(have,left); const f=food(it.food); const per=it.unit==='кг'||it.unit==='л'?1000:it.unit==='шт'?pieceG(f):1; it.qty=r2(Math.max(0,it.qty-take/per)); left-=take; }
 S.home=S.home.filter(it=>it.qty>0.001); }

function pitReminders(){ const R=Object.assign({exp:true,time:'10:00',log:false,logTime:'20:00'},S.remind||{}); const t=dkey(); const out=[];
 if(R.exp){ const by={}; for(const it of S.home){ if(!it.exp) continue; const n=dBetween(t,it.exp); if(n<0||n>14) continue; const day=n===0?t:addDays(it.exp,-1); (by[day]=by[day]||[]).push(it); }
  for(const [day,L] of Object.entries(by)){ const today=L.filter(it=>it.exp===day), tom=L.filter(it=>it.exp!==day);
   const parts=[]; if(today.length) parts.push('сегодня: '+today.map(x=>x.n.toLowerCase()).join(', ')); if(tom.length) parts.push('завтра: '+tom.map(x=>x.n.toLowerCase()).join(', '));
   out.push({id:'exp-'+day,at:atTime(day,R.time),title:'Срок годности заканчивается',text:parts.join('; ')+'. Посмотрите рецепты в Ритм·Питание.'}); } }

 const low=st.filter(x=>x.flag==='low'), ovr=st.filter(x=>x.flag==='over');
 if(dayItems(k).length){ const show=[...st].filter(x=>x.key!=='na').sort((a,b)=>a.pct-b.pct).slice(0,3); show.push(st.find(x=>x.key==='na'));
  h+=`<button class="card col-s cardbtn" data-a="tab" data-t="nut"><div class="between"><h2 class="sec-h">Витамины и минералы</h2><span class="note">${low.length?`<span class="warn-t b">${low.length} мало</span>`:''}${low.length&&ovr.length?' · ':''}${ovr.length?`<span class="bad-t b">${ovr.length} сверх</span>`:''}${!low.length&&!ovr.length?'в норме':''} ${ic('right',16)}</span></div><div class="micg">${show.map(x=>`<div class="col-xs"><span class="row-b"><span class="lbl">${MIC_N[x.key][0].replace('Витамин ','Вит. ')}</span><span class="num b ${x.flag==='low'?'warn-t':x.flag==='over'?'bad-t':''}">${Math.round(x.pct*100)}%</span></span>${pbar(x.pct,x.flag==='over'?'over':x.flag==='low'?'low':'')}</div>`).join('')}</div></button>`; }
 // приёмы пищи
 for(const m of ['b','l','d','s']){ const its=dayItems(k).filter(it=>it.meal===m); const kk=sum(its,it=>it.kcal);
  h+=`<section class="col-s"><div class="between"><h2 class="sec-h">${MEALS[m]}</h2><span class="row" style="gap:6px">${its.length?`<span class="note num">${kc(kk)} ккал</span>`:''}<button class="ibtn sm acc" data-a="addFood" data-v="${m}" aria-label="Добавить: ${MEALS[m]}">${ic('plus',18)}</button></span></div>${its.length?`<div class="list">${its.map(itemRow).join('')}</div>`:repeatBtn(k,m)}</section>`; }
 // подсказка
 const sug=suggestRecipe(left); if(sug&&k===dkey()) h+=`<button class="callout acc cardbtn" data-a="push" data-s="recipe" data-id="${sug.r.id}"><p class="b">${ic('chef',18)} ${sug.title}</p><p>${esc(sug.r.n)} — ${kc(recipeServing(sug.r).kcal)} ккал на порцию${sug.miss.length?`, не хватает: ${sug.miss.map(x=>x.f.n.toLowerCase()).slice(0,2).join(', ')}`:', всё есть дома'}.</p></button>`;
 return `<div class="col">${h}</div>`; };
function repeatBtn(k,m){ const y=dayItems(addDays(k,-1)).filter(it=>it.meal===m);
 return `<div class="split">${y.length?`<button class="btn sec sm" data-a="repeatMeal" data-v="${m}">${ic('repeat',16)} Как вчера · ${kc(sum(y,i=>i.kcal))} ккал</button>`:''}<button class="btn ghost sm${y.length?'':' self-start'}" data-a="addFood" data-v="${m}" style="${y.length?'':'grid-column:1/-1;justify-self:start'}">${ic('plus',16)} Добавить</button></div>`; }
function suggestRecipe(left){ const h=new Date().getHours(); const meal=h<11?'b':h<16?'l':'d'; const L=[...RECIPES,...S.myrec].map(r=>({r,...recipeHave(r),s:recipeServing(r)})).filter(x=>x.ratio>=.6);
 if(!L.length) return null; L.sort((a,b)=>{ const fa=(a.r.meal===meal?1:0)+a.ratio+(left>0&&a.s.kcal<=left?1:0), fb=(b.r.meal===meal?1:0)+b.ratio+(left>0&&b.s.kcal<=left?1:0); return fb-fa; });
 const x=L[0]; return {...x,title:`${MEALS[meal==='b'?'b':meal]} из того, что есть дома`}; }

/* ---------- Нутриенты ---------- */
VIEWS.nut=()=>{ const P=S.profile, Nm=norms(P); const mode=ui.nmode||'day'; const k=ui.day;
 let tot, n=1; if(mode==='week'){ const w=weekAvg(k); tot=w.t; n=w.n; } else tot=dayTotalsN(k);
 const st=MIC.map((key,i)=>({key,i,v:tot.m[i],...micStatus(i,tot.m[i],Nm)})); const low=st.filter(x=>x.flag==='low'), ovr=st.filter(x=>x.flag==='over');
 let h=topBar()+`<h1 class="h1">Витамины и минералы</h1>`+(pregP(P)?`<p class="note">${ic('baby',13)} Нормы для беременных (NIH ODS): больше фолата, железа, витамина D, цинка и B12.</p>`:'');
 h+=seg([['day',k===dkey()?'Сегодня':relDay(k)],['week','Среднее за неделю']],'nmode',mode,'Период');
 if(mode==='week'&&!n) return `<div class="col">${h}<div class="card">${empty('leaf','За последнюю неделю записей нет. Записывайте еду — здесь появится средний рацион.')}</div></div>`;
 if(mode==='day'&&!dayItems(k).length) return `<div class="col">${h}<div class="card">${empty('leaf','Добавьте еду в дневник — здесь появится, каких витаминов и минералов хватает, а каких мало.','<button class="btn pri" data-a="addFood">Добавить еду</button>')}</div></div>`;
 h+=`<div class="stats s2"><div class="stat"><span class="stat-v ${low.length?'warn-t':''}">${low.length}</span><span class="stat-l">мало (меньше половины нормы)</span></div><div class="stat"><span class="stat-v ${ovr.length?'bad-t':''}">${ovr.length}</span><span class="stat-l">сверх лимита</span></div></div>`;
 if(mode==='week') h+=`<p class="note">Среднее за ${pl(n,DAYS)} с записями из последних 7.</p>`;
 const worst=low.sort((a,b)=>a.pct-b.pct)[0];
 if(worst){ const tips=richFoods(worst.key,3); h+=`<button class="callout acc cardbtn" data-a="push" data-s="micro" data-id="${worst.key}"><p class="b">Чем добрать: ${MIC_N[worst.key][0].replace(/^./,c=>c.toLowerCase())}</p><p>${tips.map(t=>`${esc(t.f.n.toLowerCase())}${t.home?' (есть дома)':''}`).join(', ')} ›</p></button>`; }
 else if(ovr.length) h+=`<div class="callout warn"><p>Натрия больше лимита — это в основном соль, колбасы, соусы и готовая еда. Лимит — около 1 чайной ложки соли в день.</p></div>`;
 else h+=`<div class="callout good"><p>${mode==='week'?'В среднем за неделю':'Сегодня'} всего хватает. Так держать!</p></div>`;
 const row=x=>{ const [nm,u]=MIC_N[x.key]; const nv=Nm[x.key]; return `<button class="mrow" data-a="push" data-s="micro" data-id="${x.key}"><span class="col-xs grow"><span class="row-b"><span class="b">${nm}${x.flag==='low'?' <span class="badge warn">мало</span>':x.flag==='over'?' <span class="badge bad">сверх лимита</span>':''}</span><span class="num ${x.flag==='low'?'warn-t':x.flag==='over'?'bad-t':''} b">${Math.round(x.pct*100)}%</span></span>${pbar(x.pct,x.flag==='over'?'over':x.flag==='low'?'low':'')}<span class="note">${fmt(x.v,x.v<10?1:0)} из ${fmt(nv,0)} ${u}${x.key==='na'?' (лимит)':''} · ${MIC_WHY[x.key]}</span></span></button>`; };
 h+=`<section class="card col-s"><h2 class="sec-h">Витамины</h2>${st.filter(x=>VIT.includes(x.key)).map(row).join('')}</section><section class="card col-s"><h2 class="sec-h">Минералы</h2>${st.filter(x=>MINR.includes(x.key)).map(row).join('')}</section>`;
 h+=`<p class="note">Нормы — для ${P.sex==='f'?'женщины':'мужчины'} ${P.age} ${plural(P.age,['года','лет','лет'])}. Содержание витаминов в продуктах — среднее по таблицам состава. Если нехватка держится неделями, стоит обсудить анализы с врачом.</p>`;
 return `<div class="col">${h}</div>`; };
function richFoods(key,n=8){ const i=MIC.indexOf(key); const L=allFoods().filter(f=>f.m[i]>0&&f.cat!=='oil'&&f.id!=='salt').map(f=>{ const g=f.por[0]?f.por[0].g:100; const v=f.m[i]*g/100; const home=haveG(f.id)>0; return {f,g,v,home,score:v/Math.max(40,f.kcal*g/100)*(home?1.6:1)*(f.m[9]>800?.4:1)}; });
 L.sort((a,b)=>b.score-a.score); return L.slice(0,n); }

/* ---------- Дома ---------- */
VIEWS.home=()=>{ const pl_=ui.place||'all'; const t=dkey();
 let h=topBar()+`<h1 class="h1">Дома</h1>`;
 h+=`<div class="scroller">${[['all','Всё',''],...Object.entries(PLACES).map(([k,v])=>[k,v[0],v[1]])].map(([k,l,i])=>`<button class="chip ichip" data-a="place" data-v="${k}" aria-pressed="${pl_===k}">${i?ic(i,16)+' ':''}${l} <span class="mut">${k==='all'?S.home.length:S.home.filter(x=>x.place===k).length}</span></button>`).join('')}</div>`;
 const L=S.home.filter(it=>pl_==='all'||it.place===pl_);
 const soon=L.filter(it=>{ const n=expLeft(it); return n!=null&&n<=3; }).sort((a,b)=>a.exp<b.exp?-1:1);
 if(S.home.some(it=>it.exp)) h+=remindPrompt();
 if(soon.length) h+=`<section class="card col-s soon"><h2 class="sec-h">${ic('warn',18)} Использовать в первую очередь</h2><div class="col-s">${soon.map(it=>`<button class="catrow" data-a="push" data-s="hitem" data-id="${it.id}"><span class="grow col-xs"><span class="b">${esc(it.n)}</span><span class="note">${qtyText(it)} · ${expLabel(it)}</span></span>${ic('right',16)}</button>`).join('')}</div>${(()=>{ const r=[...RECIPES,...S.myrec].find(r=>r.ing.some(([fid])=>soon.some(it=>it.food===fid))); return r?`<button class="btn ghost sm self-start" data-a="push" data-s="recipe" data-id="${r.id}" style="padding:0">${ic('chef',16)} Рецепт: ${esc(r.n)}</button>`:''; })()}</section>`;
 const rest=L.filter(it=>!soon.includes(it));
 if(rest.length){ const g={}; for(const it of rest){ const c=food(it.food)?food(it.food).cat:'other'; (g[c]=g[c]||[]).push(it); }
  h+=`<section class="col-s"><h2 class="sec-h">Есть в запасе</h2>${Object.keys(g).sort((a,b)=>(FCAT[a]||'я').localeCompare(FCAT[b]||'я')).map(c=>`<p class="grp-h">${FCAT[c]||'Другое'}</p><div class="list">${g[c].sort((a,b)=>a.n.localeCompare(b.n)).map(homeRow).join('')}</div>`).join('')}</section>`; }
 if(!L.length) h+=`<div class="card">${empty('fridge',pl_==='all'?'Добавьте продукты, которые есть дома, — Ритм подскажет рецепты из них и напомнит о сроках годности.':'Здесь пока пусто.','<button class="btn pri" data-a="homeNew">Добавить продукт</button>')}</div>`;
 // покупки
 const sh=S.shop; const done=sh.filter(x=>x.done);
 h+=`<section class="card col-s" id="shop"><div class="between"><h2 class="sec-h">${ic('cart',18)} Купить</h2>${sh.length?`<span class="note">${sh.length-done.length} из ${sh.length}</span>`:''}</div>
  <div class="addrow"><input class="inp sm" id="shopIn" type="text" placeholder="${ui.shopPriv?'Только для меня':'Добавить в список'}" maxlength="40" data-enter="shopAdd" enterkeyhint="done" autocomplete="off">${famShop()?`<button class="ibtn${ui.shopPriv?' acc':''}" data-a="shopPriv" aria-pressed="${!!ui.shopPriv}" aria-label="Только мне — не показывать семье" title="Только мне">${ic('lock',18)}</button>`:''}<button class="ibtn acc" data-a="shopAdd" aria-label="Добавить в список">${ic('plus',20)}</button></div>${famShop()?`<p class="note">${ui.shopPriv?ic('lock',13)+' Следующая покупка — только для вас, семья её не увидит.':'Список общий с семьёй «'+esc(Fam.famName(Fam.pitFam()))+'». '+ic('lock',13)+' — купить что-то только для себя.'}</p>`:''}
  ${sh.length?`<div class="col-xs">${sh.map(x=>`<div class="shrow"><button class="chk-hit" data-a="shopTog" data-id="${x.id}" aria-pressed="${!!x.done}" aria-label="Куплено: ${esc(x.n)}"><span class="chk${x.done?' on':''}">${ic('check',18)}</span></button><span class="grow${x.done?' done-t':''}">${esc(x.n)}${x.qty?` <span class="mut">· ${esc(x.qty)}</span>`:''}${famTag(x.fa)}${x.priv&&famShop()?' <span class="fsc">'+ic('lock',12)+' только мне</span>':''}</span><button class="ibtn sm ghostb" data-a="shopDel" data-id="${x.id}" aria-label="Убрать из списка">${ic('close',16)}</button></div>`).join('')}</div>`:'<p class="note">Список пуст. Закончившийся продукт отправляется сюда одной кнопкой.</p>'}
  ${done.length?`<button class="btn pri blk" data-a="shopStore">Разложить купленное дома (${done.length})</button>`:''}</section>`;
 return `<div class="col">${h}</div>`; };
/* покупки и продукты дома общие с «домашней» семьёй */
function famShop(){ return famOn()&&!!Fam.pitFam(); }
function homeRow(it){ const lvl=it.full?clamp(toGrams(it)/it.full,0,1):null; return `<div class="li hrow"><button class="li-m" data-a="push" data-s="hitem" data-id="${it.id}" style="background:none;border:none;padding:0;text-align:left;color:inherit"><span class="li-t">${esc(it.n)}</span><span class="li-s">${qtyText(it)}${it.exp?' · '+expLabel(it):''} · ${PLACES[it.place]?PLACES[it.place][0].toLowerCase():''}${famTag(it.fa)}</span>${lvl!=null?`<span class="lvl"><i style="width:${(lvl*100).toFixed(0)}%"></i></span>`:''}</button><button class="btn ghost sm" data-a="homeOut" data-id="${it.id}" title="Закончилось — в покупки">Кончилось</button></div>`; }

/* ---------- Рецепты ---------- */
VIEWS.rec=()=>{ const f=ui.rf||'all'; const q=norm(ui.rq||'');
 let L=[...S.myrec.map(r=>({r,my:true})),...RECIPES.map(r=>({r}))].map(x=>({...x,...recipeHave(x.r),s:recipeServing(x.r)}));
 if(f==='can') L=L.filter(x=>!x.miss.length); if(f==='fav') L=L.filter(x=>S.fav.includes(x.r.id)); if(f==='my') L=L.filter(x=>x.my);
 if(q) L=L.filter(x=>norm(x.r.n).includes(q)||x.r.ing.some(([fid])=>food(fid)&&norm(food(fid).n).includes(q)));
 if(f==='all') L.sort((a,b)=>b.ratio-a.ratio);
 let h=topBar()+`<h1 class="h1">Рецепты</h1>`;
 h+=`<div class="search">${ic('search',18)}<input class="inp" id="rq" type="search" placeholder="Блюдо или продукт" aria-label="Поиск рецептов" value="${esc(ui.rq||'')}" data-i="rq"></div>`;
 h+=`<div class="scroller">${[['all','Все'],['can','Можно приготовить'],['fav','Избранное'],['my','Мои']].map(([v,l])=>`<button class="chip" data-a="rf" data-v="${v}" aria-pressed="${f===v}">${l}</button>`).join('')}</div>`;
 h+=`<div id="recList" class="col-s">${recCards(L)}</div><button class="btn sec blk" data-a="myrecNew">${ic('plus',18)} Свой рецепт</button>`;
 return `<div class="col">${h}</div>`; };
function recCards(L){ if(!L.length) return `<div class="card">${empty('chef',ui.rf==='can'?'Пока ни один рецепт не собирается целиком из продуктов дома. Добавьте продукты во вкладке «Дома».':ui.rf==='fav'?'Нажмите сердечко в рецепте, чтобы он появился здесь.':ui.rf==='my'?'Здесь будут ваши рецепты.':'Ничего не нашлось.')}</div>`;
 return L.map(x=>`<button class="rcard" data-a="push" data-s="recipe" data-id="${x.r.id}"><span class="rc-ic">${ic(x.r.meal==='b'?'sun':x.r.meal==='l'?'bowl':'chef',22)}</span><span class="col-xs grow"><span class="b">${esc(x.r.n)}${S.fav.includes(x.r.id)?` <span class="acc-t">${ic('heartF',14)}</span>`:''}</span><span class="note">${x.r.min} мин · ${kc(x.s.kcal)} ккал на порцию</span><span class="note ${x.miss.length?'':'good-t b'}">${x.miss.length?`не хватает: ${x.miss.slice(0,3).map(m=>m.f?m.f.n.toLowerCase():'').join(', ')}${x.miss.length>3?' и ещё '+(x.miss.length-3):''}`:'всё есть дома'}</span></span>${ic('right',18)}</button>`).join(''); }

function pregCard(k){ const i=pregP(); if(!i) return ''; const caf=Math.round(dayCaf(k));
 return `<button class="card col-s cardbtn" data-a="push" data-s="preg"><div><div class="b row gap6">${ic('baby',18)} ${pregLabel(i)}</div><div class="note">${pregLeft(i)}</div></div><div class="between"><span class="note">Кофеин ${caf} из 200 мг</span><span class="note">${PREG_ADD[i.tri]?'+'+PREG_ADD[i.tri]+' ккал к норме':'прибавки к норме нет'}</span></div>${pbar(caf/200,caf>200?'over':'')}</button>`; }

/* ============ Ритм·Питание — листы ============ */
function foodRow(f,g,act='pickFood',extra=''){ const gg=g||(f.por[0]?f.por[0].g:100); const n=scale(f,gg);
 return `<button class="li" data-a="${act}" data-id="${f.id}" data-g="${gg}" ${extra}><span class="li-m"><span class="li-t">${esc(f.n)}</span><span class="li-s">${g?fmt(gg,0)+' г':f.por[0]?f.por[0].l+' '+f.por[0].g+' г':'100 г'} · ${kc(n.kcal)} ккал${haveG(f.id)>0?' · <span class="good-t">есть дома</span>':''}${pregTag(f,gg)}</span></span><span class="chev">${ic('plus',18)}</span></button>`; }
SH.add=()=>{ const a=ui.add||(ui.add={meal:mealOfNow(),q:'',mode:'log'}); const pick=a.mode!=='log';
 let b=pick?'':seg(Object.entries(MEALS),'addMeal',a.meal,'Приём пищи');
 b+=`<div class="search">${ic('search',18)}<input class="inp" id="fq" type="search" placeholder="Например, гречка или яблоко" aria-label="Поиск продукта" value="${esc(a.q)}" data-i="fq" autocomplete="off" enterkeyhint="search"></div><div id="fres" class="col">${addResults()}</div>`;
 return sheet({title:pick?'Ингредиент':'Добавить еду',left:'close',body:b}); };
function addResults(){ const a=ui.add; const q=a.q.trim(); const pick=a.mode!=='log'; let h='';
 if(q){ const L=searchFoods(q).filter(f=>!pick||!f.rec); h+=L.length?`<div class="list">${L.map(f=>foodRow(f,pick?null:(S.recent.find(r=>r.f===f.id)||{}).g)).join('')}</div>`:`<p class="note">Ничего не нашлось по запросу «${esc(q)}».</p>`;
  h+=`<button class="btn sec blk" data-a="customNew">${ic('plus',18)} Создать продукт «${esc(q.slice(0,30))}»</button>`;
  if(!pick) h+=`<button class="btn ghost blk" data-a="push" data-s="quick">Записать только калории</button>`; return h; }
 if(!pick){ const y=dayItems(addDays(ui.day,-1)).filter(it=>it.meal===a.meal); if(y.length) h+=`<button class="btn sec blk" data-a="repeatMeal" data-v="${a.meal}">${ic('repeat',18)} ${MEALS[a.meal]} как вчера: ${y.map(i=>i.n.toLowerCase()).slice(0,3).join(', ')}${y.length>3?'…':''}</button>`; }
 const rec=S.recent.map(r=>({f:food(r.f),g:r.g})).filter(x=>x.f&&(!pick||!x.f.rec)).slice(0,12);
 if(rec.length) h+=`<h2 class="sec-h">Недавние</h2><div class="list">${rec.map(x=>foodRow(x.f,pick?null:x.g)).join('')}</div>`;
 const homeF=S.home.map(it=>food(it.food)).filter(Boolean).filter((f,i,arr)=>arr.indexOf(f)===i&&!rec.some(x=>x.f===f)).slice(0,10);
 if(homeF.length) h+=`<h2 class="sec-h">Есть дома</h2><div class="list">${homeF.map(f=>foodRow(f)).join('')}</div>`;
 if(!pick){ const R=[...S.myrec,...RECIPES].map(r=>food('r:'+r.id)).slice(0,6); h+=`<h2 class="sec-h">Блюда из рецептов</h2><div class="list">${R.map(f=>foodRow(f)).join('')}</div>`; }
 const pop=['egg','oats','buckwheat','rice','chicken','tvorog','banana','apple','bread_rye','kefir','tomato','cucumber'].map(id=>FOODS[id]).filter(f=>!rec.some(x=>x.f===f));
 h+=`<h2 class="sec-h">Часто едят</h2><div class="list">${pop.map(f=>foodRow(f)).join('')}</div>`;
 if(!pick) h+=`<button class="btn ghost blk" data-a="push" data-s="quick">Записать только калории</button>`;
 return h; }
SH.amount=()=>{ const x=ui.amt; if(!x) return sheet({title:'',body:''}); const f=food(x.f); if(!f) return sheet({title:'Продукт удалён',body:''});
 const g=kpValue(ui.kp.v); const n=scale(f,g);
 let b=`<div class="col-xs"><h2 class="h2">${esc(f.n)}</h2><span class="note">${kc(f.kcal)} ккал · Б ${fmt(f.p,1)} · Ж ${fmt(f.f,1)} · У ${fmt(f.c,1)} на 100 г</span></div>`;
 const pw=pregP()&&pregFood(f); if(pw){ const cf=cafPer100(f); b+=`<div class="callout ${pw.lvl==='no'?'bad':'warn'}"><p>${ic('baby',14)} ${esc(pw.t)}.${cf&&g?` В этой порции ≈ ${Math.round(cf*g/100)} мг кофеина, сегодня уже ${Math.round(dayCaf(ui.day))} мг.`:''}</p></div>`; }
 if(x.mode==='log'&&!x.edit) b+=seg(Object.entries(MEALS),'amtMeal',x.meal,'Приём пищи');
 else if(x.edit) b+=seg(Object.entries(MEALS),'amtMeal',x.meal,'Приём пищи');

 const pors=[...f.por]; b+=`<div class="chips">${pors.map(p=>[1,2].map(k=>`<button class="chip" data-a="amtPor" data-v="${p.g*k}">${k>1?k+' × ':''}${esc(p.l)} · ${fmt(p.g*k,0)} г</button>`).join('')).join('')}${[100,200].filter(v=>!pors.some(p=>p.g===v)).map(v=>`<button class="chip" data-a="amtPor" data-v="${v}">${v} г</button>`).join('')}</div>`;
 if(x.edit) b+=ui.confirm==='itdel'?confirmBox('Удалить из дневника?','itemDel'):`<button class="btn ghost danger-t self-start" data-a="ask" data-v="itdel" style="padding:0">${ic('trash',16)} Удалить из дневника</button>`;
 const lab=x.mode==='ing'?'Добавить в рецепт':x.edit?'Сохранить':'Добавить'+(g?' · '+kc(n.kcal)+' ккал':'');
 return sheet({title:x.mode==='ing'?'Сколько нужно':x.edit?'Изменить':MEALS[x.meal],body:b,foot:keypad({dec:true})+`<button class="btn pri blk big-btn" data-a="amtSave"${g>0?'':' disabled'}>${lab}</button>`}); };
SH.quick=()=>{ const q=ui.quick||(ui.quick={n:'',kcal:''}); const a=ui.add||{meal:mealOfNow()};
 const b=`<p class="note">Когда нет времени искать продукт — запишите только калории.</p><label class="fld"><span class="lbl">Что съели</span><input class="inp" id="qn" type="text" value="${esc(q.n)}" placeholder="Например, перекус в кафе" data-i="qn" maxlength="40"></label><label class="fld"><span class="lbl">Калории</span><input class="inp" id="qk" type="text" inputmode="numeric" value="${esc(q.kcal)}" placeholder="0" data-i="qk"></label>${seg(Object.entries(MEALS),'addMeal',a.meal,'Приём пищи')}`;
 return sheet({title:'Только калории',body:b,foot:`<button class="btn pri blk" data-a="quickSave">Записать</button>`}); };
SH.custom=()=>{ const c=ui.cust||{n:'',kcal:'',p:'',f:'',c:'',por:''};
 const fld=(k,l,ph)=>`<label class="fld"><span class="lbl">${l}</span><input class="inp" id="cu-${k}" type="text" inputmode="decimal" value="${esc(c[k])}" placeholder="${ph}" data-i="cust" data-k="${k}"></label>`;
 const b=`<p class="note">Перепишите с упаковки: значения на 100 г.</p><label class="fld"><span class="lbl">Название</span><input class="inp" id="cu-n" type="text" value="${esc(c.n)}" data-i="cust" data-k="n" maxlength="50"></label><div class="split">${fld('kcal','Ккал на 100 г','0')}${fld('p','Белки, г','0')}</div><div class="split">${fld('f','Жиры, г','0')}${fld('c','Углеводы, г','0')}</div>${fld('por','Вес 1 штуки или порции, г (необязательно)','')}`;
 return sheet({title:'Новый продукт',body:b,foot:`<button class="btn pri blk" data-a="customSave">Сохранить продукт</button>`}); };
SH.act=()=>{ const k=ui.day; const a=activity(k); const d=dayRec(k);
 let b=`<p class="p">Калории тренировок, прогулок и шагов прибавляются к норме — в норму они не заложены, чтобы не считать активность дважды.</p>`;
 if(a.src==='telo') b+=`<div class="callout mut">${lchip('telo')}<p>${a.n?`${pl(a.n,['тренировка','тренировки','тренировок'])} — ${kc(a.telo)} ккал. Добавляется само.`:'Тренировок за этот день нет.'}</p></div>`;
 b+=stepper(a.src==='telo'?'Ещё активность, ккал (прогулка, шаги)':'Активность за день, ккал',d&&d.act||0,'act','',false);
 b+=`<div class="chips">${[[100,'Прогулка 30 мин'],[250,'Прогулка час'],[300,'Велосипед 45 мин'],[400,'Тренировка']].map(([v,l])=>`<button class="chip" data-a="actAdd" data-v="${v}">+${v} · ${l}</button>`).join('')}</div>`;
 return sheet({title:'Активность',body:b}); };
SH.norm=()=>{ const P=S.profile; const N=normKcal(), mt=macroTargets(), B=Math.round(bmr(P)); const T=Family.read('telo');
 const pi=pregP(P); const B0=pi?Math.round(bmr(Object.assign({},P,{kg:P.preg.kg0||P.kg}))):B;
 let b=`<section class="card dark hero"><span class="lbl">Норма в день</span><span class="hero-v">${kc(N)} <small>ккал</small></span><p class="note">${pi?`Базовый обмен ${kc(B0)} (по весу до беременности) × активность ${fmt(ACT[P.act][0],3)} + ${PREG_ADD[pi.tri]} ккал за ${['I','II','III'][pi.tri-1]} триместр`:`Базовый обмен ${kc(B)} × активность ${fmt(ACT[P.act][0],3)} × цель ${fmt(GOALS[P.goal][0],2)}`}</p><div class="kv" style="color:var(--on-dark)"><span>Белки</span><span>${mt.p} г</span><span>Жиры</span><span>${mt.f} г</span><span>Углеводы</span><span>${mt.c} г</span></div></section>`;
 if(T&&T.state.profile) b+=`<button class="btn sec blk" data-a="fromTelo">${ic('pulse',18)} Взять рост, вес и возраст из Ритм·Тело</button>`;
 b+=`<section class="card col-s"><span class="lbl">Пол</span>${seg([['m','Мужской'],['f','Женский']],'psex',P.sex)}<div class="split">${stepper('Возраст',P.age,'age')}${stepper('Рост, см',P.h,'h')}</div>${stepper('Вес, кг',P.kg,'kg','',true)}</section>`;
 b+=`<section class="card col-s"><h2 class="sec-h">Активность вне тренировок</h2>${Object.entries(ACT).map(([k,v])=>`<button class="opt" data-a="pact" data-v="${k}" aria-pressed="${P.act===k}"><span class="b">${v[1]}</span><span class="note">${v[2]}</span></button>`).join('')}</section>`;
 b+=pi?`<section class="card col-s"><h2 class="sec-h">${ic('baby',18)} Беременность</h2><p class="p">${pregLabel(pi)}. Худеть во время беременности не рекомендуется, поэтому цель — без снижения, а к норме прибавляется энергия по триместру: I — 0, II — +340, III — +452 ккал (IOM).</p><p class="note">Белок — не меньше 71 г в день, жиры — 30 % калорий.</p><button class="btn sec sm self-start" data-a="push" data-s="preg">Подробнее</button></section>`:`<section class="card col-s"><h2 class="sec-h">Цель</h2>${seg(Object.entries(GOALS).map(([k,v])=>[k,v[1]]),'pgoal',P.goal)}<p class="note">${GOALS[P.goal][2]}. Белок — 1,6 г на кг веса, жиры — 30 % калорий, остальное — углеводы.</p></section>`;
 b+=`<p class="note">Формула Миффлина — Сан Жеора. Тренировки и шаги прибавляются к норме каждый день отдельно${Family.has('telo')?' — из Ритм·Тело':''}.</p>`;
 return sheet({title:'Норма калорий',body:b}); };
SH.micro=top=>{ const key=top.id; const i=MIC.indexOf(key); const [nm,u]=MIC_N[key]; const Nm=norms(S.profile); const v=dayTotalsN(ui.day).m[i];
 const L=richFoods(key,10);
 let b=`<section class="card col-s"><div class="row-b"><span class="b">${relDay(ui.day)}</span><span class="num b">${fmt(v,1)} из ${fmt(Nm[key],0)} ${u}</span></div>${pbar(v/Nm[key],key==='na'&&v>Nm[key]?'over':'')}<p class="note">${MIC_WHY[key]}</p></section>`;
 if(key==='na') b+=`<div class="callout warn"><p>Натрий — это в первую очередь соль: 1 чайная ложка соли ≈ 2 300 мг натрия. Больше всего его в колбасах, сыре, соусах, солёной рыбе, чипсах и готовой еде.</p></div>`;
 else { b+=`<h2 class="sec-h">Чем добрать</h2><p class="note">Продукты с большим содержанием на обычную порцию${L.some(x=>x.home)?'; сначала — те, что есть дома':''}.</p><div class="list">${L.map(x=>`<button class="li" data-a="pickFood" data-id="${x.f.id}" data-g="${x.g}"><span class="li-m"><span class="li-t">${esc(x.f.n)}${x.home?' <span class="badge good">есть дома</span>':''}</span><span class="li-s">${x.g} г — ${fmt(x.v,1)} ${u} (${Math.round(x.v/Nm[key]*100)}% нормы) · ${kc(x.f.kcal*x.g/100)} ккал</span></span><span class="chev">${ic('plus',18)}</span></button>`).join('')}</div>`; }
 const src=dayItems(ui.day).filter(it=>it.m&&it.m[i]>0).sort((a,b)=>b.m[i]-a.m[i]).slice(0,5);
 if(src.length) b+=`<h2 class="sec-h">Откуда сегодня</h2><div class="kv">${src.map(it=>`<span>${esc(it.n)}</span><span>${fmt(it.m[i],1)} ${u}</span>`).join('')}</div>`;
 return sheet({title:nm,body:b}); };

/* ---------- Дома ---------- */
SH.hitem=top=>{ const isNew=top.id==='new'; const it=isNew?ui.hnew:S.home.find(x=>x.id===top.id); if(!it) return sheet({title:'Продукт',body:''});
 const f=food(it.food); const t=dkey();
 let b=isNew?`<label class="fld"><span class="lbl">Продукт</span><input class="inp" id="hn" type="text" value="${esc(it.n)}" placeholder="Например, молоко" data-i="hn" autocomplete="off" maxlength="40"></label><div id="hsug" class="chips">${homeSug(it.n)}</div>`:`<div class="col-xs"><h2 class="h2">${esc(it.n)}</h2>${f?`<span class="note">${FCAT[f.cat]||''}</span>`:''}</div>`;
 b+=`<div class="qty-row">${stepper('Сколько',it.qty,'hq','',true)}<div class="col-xs"><span class="lbl">Единица</span><div class="seg units">${UNITS.map(u=>`<button class="seg-b" data-a="hunit" data-v="${u}" aria-checked="${it.unit===u}">${u}</button>`).join('')}</div></div></div>`;
 b+=`<div class="col-xs"><span class="lbl">Где хранится</span>${seg(Object.entries(PLACES).map(([k,v])=>[k,v[0]]),'hplace',it.place)}</div>`;
 b+=`<div class="col-xs"><span class="lbl">Годен до</span><div class="chips">${[[3,'+3 дня'],[7,'+неделя'],[14,'+2 недели'],[30,'+месяц']].map(([n,l])=>`<button class="chip" data-a="hexp" data-v="${addDays(t,n)}" aria-pressed="${it.exp===addDays(t,n)}">${l}</button>`).join('')}<label class="chip datechip" aria-pressed="${!!it.exp&&![3,7,14,30].some(n=>addDays(t,n)===it.exp)}">${ic('cal',16)} ${it.exp?fmtDay(it.exp):'Дата'}<input type="date" value="${it.exp||''}" data-c="hexpIn" aria-label="Годен до"></label>${it.exp?`<button class="chip" data-a="hexp" data-v="">Без срока</button>`:''}</div></div>`;
 if(!isNew){ b+=`<div class="split"><button class="btn sec" data-a="homeOut" data-id="${it.id}">${ic('cart',18)} Кончилось</button><button class="btn sec" data-a="homeEat" data-id="${it.id}">Съел часть</button></div>`;
  b+=ui.confirm==='hdel'?confirmBox('Убрать продукт из списка «Дома»?','homeDel','Убрать',`data-id="${it.id}"`):`<button class="btn ghost danger-t self-start" data-a="ask" data-v="hdel" style="padding:0">Убрать без покупки</button>`; }
 return sheet({title:isNew?'Новый продукт дома':'Продукт',body:b,foot:isNew?`<button class="btn pri blk" data-a="homeSave"${it.n.trim()?'':' disabled'}>Добавить</button>`:''}); };
function homeSug(q){ q=norm(q); if(q.length<2) return ''; const L=allFoods().filter(f=>norm(f.n).includes(q)).sort((a,b)=>(b.raw?1:0)-(a.raw?1:0)).slice(0,6);
 return L.map(f=>`<button class="chip" data-a="hpick" data-id="${f.id}" aria-pressed="${ui.hnew&&ui.hnew.food===f.id}">${esc(f.n)}</button>`).join(''); }

/* ---------- Рецепт ---------- */
SH.recipe=top=>{ const r=recipeById(top.id); if(!r) return sheet({title:'Рецепт',body:''}); const srv=ui.srv&&ui.srv.id===r.id?ui.srv.n:r.srv;
 const need=recipeNeeds(r,srv); const miss=need.filter(x=>!x.ok&&!x.minor); const s=recipeServing(r); const fav=S.fav.includes(r.id);
 let b=`<div class="rhero"><span class="rh-ic">${ic(r.meal==='b'?'sun':r.meal==='l'?'bowl':'chef',40)}</span></div><div class="col-xs"><h1 class="h1" style="font-size:24px">${esc(r.n)}</h1><span class="note">${r.min} мин · ${kc(s.kcal)} ккал на порцию · Б ${fmt(s.p,0)} · Ж ${fmt(s.f,0)} · У ${fmt(s.c,0)}</span></div>`;
 b+=`<section class="card col-s"><div class="between"><h2 class="sec-h">Ингредиенты</h2><div class="stp-c mini"><button class="stp-b" data-a="srv" data-x="${r.id}" data-v="-1" aria-label="Меньше порций">−</button><span class="stp-v" style="font-size:15px">${pl(srv,['порция','порции','порций'])}</span><button class="stp-b" data-a="srv" data-x="${r.id}" data-v="1" aria-label="Больше порций">+</button></div></div>
  <div class="col-xs">${need.map(x=>`<div class="ingrow"><span class="grow">${esc(x.f?x.f.n:'?')}</span><span class="num">${fmtG(x.need,x.f)}</span>${x.ok?`<span class="badge good">есть</span>`:x.minor?`<span class="badge mut">по вкусу</span>`:`<span class="badge bad">нет</span>`}</div>`).join('')}</div>
  ${miss.length?`<div class="callout" style="background:var(--bad-tint);color:var(--bad)"><p>Не хватает: ${miss.map(x=>x.f.n.toLowerCase()).join(', ')}</p><button class="btn ghost" data-a="missToShop" data-x="${r.id}">Добавить в покупки</button></div>`:`<div class="callout good"><p>Всё есть дома.</p></div>`}</section>`;
 b+=`<section class="card col-s"><h2 class="sec-h">Шаги</h2><ol class="steps-l">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><button class="btn sec blk" data-a="push" data-s="cook" data-id="${r.id}">${ic('chef',18)} Готовить по шагам</button></section>`;
 if(S.myrec.some(x=>x.id===r.id)) b+=`<div class="split"><button class="btn sec" data-a="myrecEdit" data-id="${r.id}">${ic('edit',16)} Изменить</button>${ui.confirm==='rdel'?'':`<button class="btn ghost danger-t" data-a="ask" data-v="rdel">Удалить</button>`}</div>${ui.confirm==='rdel'?confirmBox('Удалить рецепт?','myrecDel','Удалить',`data-id="${r.id}"`):''}`;
 return sheet({title:'Рецепт',right:`<button class="ibtn" data-a="fav" data-id="${r.id}" aria-pressed="${fav}" aria-label="${fav?'Убрать из избранного':'В избранное'}">${ic(fav?'heartF':'heart',20)}</button>`,body:b,foot:`<div class="split"><button class="btn sec" data-a="cooked" data-id="${r.id}">Приготовил</button><button class="btn pri" data-a="ateRecipe" data-id="${r.id}">Съел порцию</button></div>`}); };
function fmtG(g,f){ if(f&&f.por.length&&/^шт|^зубчик/.test(f.por[0].l)){ const n=g/f.por[0].g; if(Math.abs(n-Math.round(n))<.15&&n>=1) return `${Math.round(n)} ${f.por[0].l} (${fmt(g,0)} г)`; } return fmt(g,0)+' г'; }
SH.cook=top=>{ const r=recipeById(top.id); if(!r) return sheet({title:'',body:''}); const i=clamp(ui.step||0,0,r.steps.length-1);
 const b=`<div class="cook"><span class="eyebrow-l">Шаг ${i+1} из ${r.steps.length}</span><div class="dots">${r.steps.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div><p class="cook-t">${esc(r.steps[i])}</p></div>`;
 return sheet({title:r.n,body:b,foot:`<div class="split"><button class="btn sec big" data-a="cookStep" data-v="-1"${i?'':' disabled'}>Назад</button>${i<r.steps.length-1?`<button class="btn pri big" data-a="cookStep" data-v="1">Дальше</button>`:`<button class="btn acc big" data-a="back">Готово</button>`}</div>`}); };
SH.myrec=()=>{ const r=ui.mr; if(!r) return sheet({title:'',body:''});
 let b=`<label class="fld"><span class="lbl">Название</span><input class="inp" id="mrn" type="text" value="${esc(r.n)}" placeholder="Например, бабушкины котлеты" data-i="mr" data-k="n" maxlength="50"></label><div class="split">${stepper('Порций',r.srv,'mrsrv')}${stepper('Минут',r.min,'mrmin')}</div>`;
 b+=`<div class="col-xs"><span class="lbl">Когда едят</span>${seg([['b','Завтрак'],['l','Обед'],['d','Ужин']],'mrmeal',r.meal)}</div>`;

 b+=`<label class="fld"><span class="lbl">Шаги — каждый с новой строки</span><textarea class="inp" id="mrs" rows="6" data-i="mr" data-k="steps" placeholder="Нарежьте лук…">${esc(r.steps.join('\n'))}</textarea></label>`;
 return sheet({title:r.id?'Изменить рецепт':'Свой рецепт',left:'close',body:b,foot:`<button class="btn pri blk" data-a="myrecSave"${r.n.trim()&&r.ing.length?'':' disabled'}>Сохранить рецепт</button>`}); };

SH.settings=()=>{ const P=S.profile; let b=`<section class="list"><button class="li" data-a="push" data-s="norm"><span class="ico">${ic('fire',20)}</span><span class="li-m"><span class="li-t">Норма калорий</span><span class="li-s">${kc(normKcal())} ккал · ${GOALS[P.goal][1].toLowerCase()}</span></span><span class="chev">${ic('right',18)}</span></button></section>`;
 if(P.sex==='f'||P.preg){ const pi=pregP(P); b+=`<section class="card col-s"><h2 class="sec-h">${ic('baby',18)} Беременность</h2><p class="p">${pi?pregLabel(pi)+' · '+pregLeft(pi):'Норма калорий, витамины и минералы подстроятся под срок, а Ритм подскажет, какие продукты лучше исключить.'}</p><div class="row wrap gap6"><button class="btn ${pi?'sec':'pri'} sm" data-a="pregOpen">${pi?'Изменить срок':'Включить режим беременности'}</button>${pi?'<button class="btn ghost sm" data-a="push" data-s="preg">Подробнее</button>':''}</div></section>`; }
 b+=`<section class="card col-s"><h2 class="sec-h">Вода</h2>${stepper('Цель, стаканов по 250 мл',S.water,'water')}<p class="note">Обычно 30 мл на кг веса — для вас около ${fmt(P.kg*.03,1)} л (${Math.round(P.kg*30/250)} стаканов).</p></section>`;
 const R=Object.assign({exp:true,time:'10:00',log:false,logTime:'20:00'},S.remind||{});
 b+=remindCard(`<div class="chips"><button class="chip" data-a="remTog" data-v="exp" aria-pressed="${R.exp}">Сроки продуктов</button><button class="chip" data-a="remTog" data-v="log" aria-pressed="${R.log}">Записать еду вечером</button></div>${R.exp?`<span class="lbl">О сроках — накануне в</span>${timeChips('remTime',R.time,['08:00','09:00','10:00','12:00','18:00'])}`:''}${R.log?`<span class="lbl">Записать еду — в</span>${timeChips('remLogTime',R.logTime,['19:00','20:00','21:00','22:00'])}`:''}`);
 b+=themeCard()+familyCard()+dataCard();
 return sheet({title:'Настройки',body:b}); };
SH.onboard=()=>{ const o=ui.ob||(ui.ob={step:1}); const P=S.profile; const T=Family.read('telo'); const dots=`<div class="dots">${[1,2].map(i=>`<i class="${i<=o.step?'on':''}"></i>`).join('')}</div>`; let b, foot;

 shopDel:d=>{ S.shop=S.shop.filter(s=>s.id!==d.id); commit(); },
 shopStore:()=>{ const done=S.shop.filter(x=>x.done); for(const x of done){ const f=food(x.food)||searchFoods(x.n,1).find(m=>norm(m.n).startsWith(norm(x.n).split(' ')[0])); const unit=f&&f.por.some(p=>/^шт/.test(p.l))?'шт':'г'; const qty=unit==='шт'?1:(f&&f.por[0]?Math.max(100,f.por[0].g):500);
   const it={id:'h'+uid(),n:x.n,food:f?f.id:null,qty,unit,place:f?CAT_PLACE[f.cat]||'fridge':'fridge',exp:null,added:dkey()}; it.full=toGrams(it); S.home.push(it); }
  S.shop=S.shop.filter(x=>!x.done); commit(); toast(`Дома: +${pl(done.length,['продукт','продукта','продуктов'])}. Проверьте количество и сроки`); },
 srv:d=>{ const r=recipeById(d.x); const cur=ui.srv&&ui.srv.id===r.id?ui.srv.n:r.srv; ui.srv={id:r.id,n:clamp(cur+Number(d.v),1,20)}; render(); },
 missToShop:d=>{ const r=recipeById(d.x); const srv=ui.srv&&ui.srv.id===r.id?ui.srv.n:r.srv; const miss=recipeNeeds(r,srv).filter(x=>!x.ok&&!x.minor); let n=0; for(const x of miss){ if(S.shop.some(s=>s.food===x.fid&&!s.done)) continue; S.shop.push({id:'s'+uid(),n:x.f.n,food:x.fid,qty:fmtG(x.need-x.have,x.f)}); n++; } commit(); toast(n?`В покупках: +${n}`:'Уже в списке покупок'); },
 fav:d=>{ S.fav=S.fav.includes(d.id)?S.fav.filter(x=>x!==d.id):[...S.fav,d.id]; commit(); },
 cooked:d=>{ const r=recipeById(d.id); const srv=ui.srv&&ui.srv.id===r.id?ui.srv.n:r.srv; const before=clone(S.home); for(const x of recipeNeeds(r,srv)) writeOff(x.fid,x.need); commit(); toast('Продукты списаны из «Дома»',()=>{ S.home=before; commit(); }); },
 ateRecipe:d=>{ const r=recipeById(d.id); const s=recipeServing(r); const k=dkey(); const e=logEntry('r:'+r.id,s.g,mealOfNow(),k); ui.day=k; ui.stack=[]; ui.tab='today'; commit(); toast(`${MEALS[e.meal]}: ${r.n.toLowerCase()} · ${kc(e.kcal)} ккал`,()=>{ undoEntry(k,e.id); commit(); }); },
 cookStep:d=>{ ui.step=(ui.step||0)+Number(d.v); render(); },
 myrecNew:()=>{ ui.mr={id:null,n:'',srv:2,min:30,meal:'d',ing:[],steps:[]}; ui.stack.push({type:'myrec'}); render(); },
 myrecEdit:d=>{ const r=S.myrec.find(x=>x.id===d.id); if(!r) return; ui.mr=clone(r); ui.stack.push({type:'myrec'}); render(); },
 mrmeal:d=>{ ui.mr.meal=d.v; render(); },
 mrIngAdd:()=>{ ui.add={mode:'ing',q:'',meal:'l'}; ui.stack.push({type:'add'}); render(); },
 mrIngDel:d=>{ ui.mr.ing.splice(Number(d.v),1); render(); },
 myrecSave:()=>{ const r=ui.mr; r.n=r.n.trim(); r.steps=(r.steps||[]).map(s=>s.trim()).filter(Boolean); if(!r.n||!r.ing.length) return; if(!r.steps.length) r.steps=['Приготовьте по своему вкусу.'];
  if(r.id){ const i=S.myrec.findIndex(x=>x.id===r.id); if(i>=0) S.myrec[i]=r; } else { r.id='m'+uid(); S.myrec.unshift(r); }
  ui.mr=null; ui.stack.pop(); const t=topSheet(); if(!t||t.type!=='recipe') ui.stack.push({type:'recipe',id:r.id}); commit(); toast('Рецепт сохранён'); },
 myrecDel:d=>{ S.myrec=S.myrec.filter(x=>x.id!==d.id); S.fav=S.fav.filter(x=>x!==d.id); ui.stack.pop(); commit(); toast('Рецепт удалён'); },
 obNext:()=>{ ui.ob.step=2; render(); }, obPrev:()=>{ ui.ob.step=1; render(); },
 obDone:()=>{ S.setup=true; ui.ob=null; ui.stack=[]; ui.tab='today'; commit(); toast('Готово! Добавляйте еду кнопкой «+»'); }
});
Object.assign(C,{ pgDate:(d,t)=>{ ui.pg[d.k]=t.value; render(); },
 hexpIn:(d,t)=>{ const it=curHome(); if(it){ it.exp=t.value||null; if(topSheet().id!=='new') Store.save(); render(); } }
});
Object.assign(I,{
 fq:(d,t)=>{ ui.add.q=t.value; const el=document.getElementById('fres'); if(el) el.innerHTML=addResults(); },
 qn:(d,t)=>{ ui.quick.n=t.value; }, qk:(d,t)=>{ ui.quick.kcal=t.value; },
 cust:(d,t)=>{ ui.cust[d.k]=t.value; },
 rq:(d,t)=>{ ui.rq=t.value; const el=document.getElementById('recList'); if(!el) return; const q=norm(ui.rq); const f=ui.rf||'all';
  let L=[...S.myrec.map(r=>({r,my:true})),...RECIPES.map(r=>({r}))].map(x=>({...x,...recipeHave(x.r),s:recipeServing(x.r)})); if(f==='can') L=L.filter(x=>!x.miss.length); if(f==='fav') L=L.filter(x=>S.fav.includes(x.r.id)); if(f==='my') L=L.filter(x=>x.my);
  if(q) L=L.filter(x=>norm(x.r.n).includes(q)||x.r.ing.some(([fid])=>food(fid)&&norm(food(fid).n).includes(q))); el.innerHTML=recCards(L); },
 hn:(d,t)=>{ if(!ui.hnew) return; ui.hnew.n=t.value; if(ui.hnew.food&&norm(food(ui.hnew.food).n)!==norm(t.value)) ui.hnew.food=null; const s=document.getElementById('hsug'); if(s) s.innerHTML=homeSug(t.value); const btn=document.querySelector('[data-a="homeSave"]'); if(btn) btn.disabled=!t.value.trim(); },
 mr:(d,t)=>{ if(d.k==='steps') ui.mr.steps=t.value.split('\n'); else ui.mr.n=t.value; const btn=document.querySelector('[data-a="myrecSave"]'); if(btn) btn.disabled=!(ui.mr.n.trim()&&ui.mr.ing.length); }
});
APP.onPush=t=>{ if(t.type==='cook'){ ui.step=0; wakeOn(); } };
APP.onBack=t=>{ if(!t) return; if(t.type==='add'){ ui.add=null; } if(t.type==='amount'){ ui.amt=null; ui.kp=null; } if(t.type==='cook') wakeOff(); if(t.type==='hitem'&&t.id==='new') ui.hnew=null; if(t.type==='myrec') ui.mr=null; if(t.type==='quick') ui.quick=null; if(t.type==='custom') ui.cust=null; if(t.type==='recipe') ui.srv=null; };
APP.afterReset=()=>{ ui.ob=null; ui.stack=[{type:'onboard'}]; };
A.fabAdd=()=>{ if(ui.tab==='home') A.homeNew(); else A.addFood({}); };
APP.tick=()=>{ if(ui.dayAuto!==false&&ui.day!==dkey()&&!ui.stack.length){ ui.day=dkey(); render(); } };

A.remTime=d=>{ S.remind=Object.assign({},S.remind,{time:d.v}); commit(); };
A.remLogTime=d=>{ S.remind=Object.assign({},S.remind,{logTime:d.v}); commit(); };
A.remTog=d=>{ const R=Object.assign({exp:true,log:false},S.remind||{}); R[d.v]=!R[d.v]; S.remind=R; commit(); };

if(typeof document!=='undefined'&&document.getElementById&&document.getElementById('view')) boot();
</script>
