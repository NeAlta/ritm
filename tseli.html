<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ритм">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F1EC">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="ritm-ios.css">
<script>window.RITM_APP=true;window.RITM_IOS=true;window.RITM_PAGE='tseli'</script>
<script src="ritm-ios.js"></script>
<script src="family.js"></script>
</head>
<body>
<title>Ритм·Цели</title>
<style>
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --sunk:#EFEBE4; --line:#E6E0D6; --ink:#17161A; --muted:#5F5A52; --faint:#8C867C;
  --accent:#6E63F2; --accent-ink:#3D33B8; --accent-tint:#E5E3FD; --accent-soft:#B3ADF8; --on-accent:#FFFFFF;
  --btn:#17161A; --on-btn:#FFFFFF;
  --dark-card:#17161A; --on-dark:#FFFFFF; --on-dark-muted:#CFCBC4; --dk-eyebrow:#B3ADFF; --dk-line:#2E2C30;
  --good:#2F7A4D; --good-tint:#E3F2E8; --on-good:#FFFFFF;
  --warn:#8A5A0B; --warn-tint:#FCEFD2; --warn-ink:#6B4507;
  --bad:#B42318; --bad-tint:#FDE7E4; --on-bad:#FFFFFF;
  --shadow:rgba(23,22,26,.18);
  --c-telo:#F0643C; --c-dengi:#2FA36B; --c-pit:#E0A22E; --c-tseli:#6E63F2;
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-lg:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --card:#1E1C1A; --sunk:#292623; --line:#36322E; --ink:#F2EEE8; --muted:#AFA89E; --faint:#7E776E;
  --accent:#6E63F2; --accent-ink:#B3ADFF; --accent-tint:#24204A; --accent-soft:#4A43A0; --on-accent:#FFFFFF;
  --btn:#F2EEE8; --on-btn:#17161A;
  --dark-card:#2B2724; --on-dark:#F2EEE8; --on-dark-muted:#BDB5AA; --dk-eyebrow:#B3ADFF; --dk-line:#3E3934;
  --good:#7CCB9A; --good-tint:#1B2C21; --on-good:#0F1F15;
  --warn:#E9B455; --warn-tint:#33280F; --warn-ink:#F2C46A;
  --bad:#FF8A7A; --bad-tint:#3A1C18; --on-bad:#2A0F0B;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121110; --card:#1E1C1A; --sunk:#292623; --line:#36322E; --ink:#F2EEE8; --muted:#AFA89E; --faint:#7E776E;
  --accent:#6E63F2; --accent-ink:#B3ADFF; --accent-tint:#24204A; --accent-soft:#4A43A0; --on-accent:#FFFFFF;
  --btn:#F2EEE8; --on-btn:#17161A;
  --dark-card:#2B2724; --on-dark:#F2EEE8; --on-dark-muted:#BDB5AA; --dk-eyebrow:#B3ADFF; --dk-line:#3E3934;
  --good:#7CCB9A; --good-tint:#1B2C21; --on-good:#0F1F15;
  --warn:#E9B455; --warn-tint:#33280F; --warn-ink:#F2C46A;
  --bad:#FF8A7A; --bad-tint:#3A1C18; --on-bad:#2A0F0B;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px calc(100px + env(safe-area-inset-bottom,0px))}
.col{display:flex;flex-direction:column;gap:14px}
.col-s{display:flex;flex-direction:column;gap:10px}
.col-xs{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.gap6{gap:6px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top-al{align-items:flex-start}
.grow{flex:1;min-width:0}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.self-start{align-self:flex-start}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.tile{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);padding:0;flex-shrink:0}
.h1{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.15;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.25;margin:0;text-wrap:balance}
.h3{font-size:17px;font-weight:700;margin:0}
.sec-h{font-size:16px;font-weight:700;margin:0}
.lede{margin:0;color:var(--muted);font-size:14px}
.p{margin:0}
.note{margin:0;color:var(--muted);font-size:13px}
.lbl{font-size:13px;color:var(--muted)}
.mut{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dk-eyebrow)}
.eyebrow-l{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.card{background:var(--card);border-radius:var(--r-lg);padding:16px}
.card.dark{background:var(--dark-card);color:var(--on-dark)}
.dk-t{font-size:20px;font-weight:600;margin:0}
.dk-s,.dk-note{margin:0;font-size:14px;color:var(--on-dark-muted)}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.good{background:var(--good-tint);color:var(--good)}
.badge.warn{background:var(--warn-tint);color:var(--warn-ink)}
.badge.bad{background:var(--bad-tint);color:var(--bad)}
.badge.acc{background:var(--accent-tint);color:var(--accent-ink)}
.badge.mut{background:var(--sunk);color:var(--muted)}
.badge.on-dk{background:var(--dk-line);color:var(--on-dark)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid transparent;font-weight:700;font-size:15px;background:none;color:var(--ink);text-align:center}
.btn.pri{background:var(--btn);color:var(--on-btn)}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.sec{border-color:var(--ink);color:var(--ink)}
.btn.sec-dk{border-color:var(--on-dark-muted);color:var(--on-dark)}
.btn.ghost{color:var(--accent-ink);padding:0 10px;min-height:40px;font-weight:600}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.danger-t{color:var(--bad)!important}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.blk{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn:active:not([disabled]){transform:scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent-ink);background:var(--accent-tint);color:var(--accent-ink)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex-shrink:0}
.ready{display:flex;gap:16px;align-items:center}
.ring .rt{fill:none;stroke:var(--sunk);stroke-width:10}
.ring .rv{fill:none;stroke-width:10;stroke-linecap:round;stroke-dashoffset:var(--off)}
.ring.anim .rv{animation:ringIn 1s cubic-bezier(.2,.8,.2,1)}
@keyframes ringIn{from{stroke-dashoffset:var(--full)}}
.ring .rn{font-family:var(--f-display);font-size:28px;font-weight:600;fill:var(--ink)}
.ring .rl{font-size:11px;fill:var(--muted);font-family:var(--f-body)}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--dk-line);align-items:baseline}
.pi:first-child{border-top:none}
.pi-n{font-weight:500;text-align:left;background:none;border:none;padding:0;color:inherit;min-width:0}
.pi-v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.pi-r{grid-column:1/-1;font-size:12px;color:var(--muted)}
.plan-list.lt .pi{border-top-color:var(--line)}
.lnk{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wd-dot{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--on-accent);box-sizing:border-box}
.wd.plan .wd-dot{background:transparent;border:2px dashed var(--accent)}
.wd.done .wd-dot{background:var(--accent);border:none}
.wd.today .wd-l{color:var(--ink);font-weight:700}
.wd.today .wd-dot{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.lg{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-sizing:border-box}
.lg.done{background:var(--accent)} .lg.plan{border:2px dashed var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats.s2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:var(--sunk);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat-v{font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.stat-l{font-size:12px;color:var(--muted)}
.list{background:var(--card);border-radius:var(--r-lg);padding:2px 16px}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 0;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.li:last-child{border-bottom:none}
.li-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li-t{font-weight:600}
.li-s{font-size:13px;color:var(--muted)}
.li-e{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .chev{color:var(--faint);flex-shrink:0}
.grp-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 -6px}
.stp{display:flex;flex-direction:column;gap:6px;min-width:0}
.stp-c{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;background:var(--sunk);border-radius:16px;padding:4px}
.stp-b{width:44px;height:44px;border-radius:12px;border:none;background:var(--card);font-size:22px;font-weight:600;color:var(--accent-ink);padding:0}
.stp-v{width:100%;min-width:0;border:none;background:transparent;text-align:center;font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;color:var(--ink)}
.stp-v:focus{outline:none}
.stp-c:focus-within{box-shadow:0 0 0 2px var(--accent)}
.sets{display:flex;flex-direction:column;gap:6px}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes fadeUp{from{transform:translateY(-4px);opacity:.6}}
.warn-t{color:var(--warn)}
#sheet{position:fixed;inset:0;z-index:30;background:var(--bg)}
.sh{display:flex;flex-direction:column;height:100%}
.sh.enter{animation:shIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes shIn{from{transform:translateY(32px);opacity:.4}}
.sh-in{max-width:480px;margin:0 auto;width:100%}
.sh-head{padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.sh-head .sh-in{display:flex;align-items:center;gap:10px;min-height:44px}
.sh-t{flex:1;min-width:0}
.sh-title{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
.sh-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;border:none;background:none;color:var(--muted);font-size:11px;font-weight:500;border-radius:12px;padding:0}
.tab[aria-current="page"]{color:var(--accent-ink);font-weight:700}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.inp{width:100%;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--accent)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:14px;color:var(--muted)}
.search .inp{padding-left:42px}
.callout{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px;align-items:flex-start}
.callout p{margin:0}
.callout.warn{background:var(--warn-tint);color:var(--warn-ink)}
.callout.acc{background:var(--accent-tint);color:var(--accent-ink)}
.callout.good{background:var(--good-tint);color:var(--good)}
.callout.mut{background:var(--sunk);color:var(--ink)}
.callout .btn.ghost{color:inherit;padding:0;min-height:32px;text-decoration:underline;text-underline-offset:3px}
.confirm{background:var(--bad-tint);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;color:var(--bad);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.c-grid{stroke:var(--line);stroke-width:1}
.c-lbl{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.c-area{fill:var(--accent-tint)}
.c-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.c-pt{fill:var(--card);stroke:var(--accent);stroke-width:2}
.c-guide{stroke:var(--faint);stroke-dasharray:3 3}
.c-tip{fill:var(--ink)}
.c-tipt{fill:var(--bg);font-size:12px;font-weight:700;font-family:var(--f-body)}
.c-hit{fill:transparent;cursor:pointer}
.dchip{display:inline-grid;place-items:center;min-width:36px;height:30px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.dchip.on{background:var(--accent-tint);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(156px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px var(--shadow);animation:fadeUp .2s ease-out}
details.card summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:10px}
details.card[open] summary svg{transform:rotate(90deg)}
.tpl{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:14px;width:100%;color:var(--ink)}
.tpl[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tpl-t{font-weight:700;font-size:16px}
.splash{display:grid;place-items:center;min-height:50vh;color:var(--muted);text-align:center}
.seg2{display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--card);border-radius:999px;padding:3px}
.seg2-b{min-height:34px;padding:0 12px;border:none;border-radius:999px;background:none;font-size:13px;font-weight:600;color:var(--muted)}
.seg2-b[aria-checked="true"]{background:var(--accent-tint);color:var(--accent-ink)}
.ta{min-height:120px;padding:12px 14px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;resize:vertical;line-height:1.4}
.ph{display:grid;place-items:center;text-align:center;gap:8px;padding:28px 16px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* Столбики */
.bars{display:flex;gap:6px;align-items:stretch}
.bc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.bc-v{font-size:11px;font-weight:700;color:var(--muted);min-height:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bc-t{width:100%;height:110px;display:flex;align-items:flex-end;background:var(--sunk);border-radius:8px;overflow:hidden}
.bc-t i{display:block;width:100%;background:var(--accent-soft);border-radius:8px 8px 0 0;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.bc.cur .bc-t i{background:var(--accent)} .bc.cur .bc-v,.bc.cur .bc-l{color:var(--accent-ink)}
.bc.dim .bc-t i{background:repeating-linear-gradient(135deg,var(--accent-soft) 0 5px,var(--accent-tint) 5px 10px)}
.bc-l{font-size:11px;min-height:15px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.bars.dense .bc-l{font-size:10px;overflow:visible;text-overflow:clip;max-width:none} .bars.dense .bc-v{font-size:10px}
.bc-s{font-size:10px;color:var(--faint);white-space:nowrap}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.seg2-b[disabled]{opacity:.4}
/* Сегмент во всю ширину */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;background:var(--sunk);border-radius:999px;padding:3px}
.seg-b{min-height:40px;padding:0 8px;border:none;border-radius:999px;background:none;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg-b[aria-checked="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.seg.on-card{background:var(--sunk)}
/* Главная карточка-число */
.hero{display:flex;flex-direction:column;gap:10px}
.hero-v{font-family:var(--f-display);font-size:36px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.hero-v.md{font-size:28px}
.hero-v small{font-size:.5em;font-weight:500;color:inherit;opacity:.75;margin-left:4px}
.card.dark .lbl,.card.dark .note{color:var(--on-dark-muted)}
.pbar{position:relative;height:8px;border-radius:4px;background:var(--sunk);overflow:visible}
.card.dark .pbar{background:var(--dk-line)}
.pbar>i{display:block;height:100%;border-radius:4px;background:var(--accent);max-width:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pbar.over>i{background:var(--bad)}
.pbar.good>i{background:var(--good)}

const GCATS={health:['Здоровье и спорт','run'],money:['Деньги','coins'],learn:['Учёба и чтение','book'],work:['Работа','brief'],home:['Дом','home'],family:['Семья и друзья','people'],travel:['Путешествия','plane'],self:['Для себя','spark']};
const GKIND={steps:['Этапы','разбить на шаги'],num:['Число','накопить, прочитать, пробежать'],habit:['Привычка','делать регулярно']};
const REP={day:'Каждый день',wd:'По будням',week:'Каждую неделю',days:'По дням недели',month:'Каждый месяц'};
function DEF(){ return {v:1,setup:false,theme:'auto',goals:[],tasks:[],arch:0,remind:{on:true,morning:true,mtime:'09:00',lead:0}}; }
function normalize(s){ const o=Object.assign(DEF(),s||{}); if(!Array.isArray(o.goals)) o.goals=[]; if(!Array.isArray(o.tasks)) o.tasks=[]; return o; }
const APP={id:'tseli',name:'Цели',icon:'goal',tabs:['today','goals','plan','stats'],normalize,
 fab:t=>t==='goals'||t==='plan',
 remindWhy:'Ритм напомнит о задачах со временем и утром покажет план на день.',
 reminders:()=>goalReminders(),
 familyNote:'Когда приложения Ритм установлены вместе на телефоне, сюда сами приходят задачи: тренировка дня из «Тела», платежи и копилки из «Денег», покупки из «Питания».',
 acc:(k,x)=>ACC_FN(k,x),
 afterLoad:()=>{ archive(); },
 onResume:()=>render()
};
/* ---------- Задачи ---------- */
function isDue(t,k){ if(!t.rep) return t.date===k; if(t.date&&k<t.date) return false; if(t.until&&k>t.until) return false; const w=wdi(k);
 switch(t.rep.k){ case 'day': return true; case 'wd': return w<5; case 'week': return w===wdi(t.date||t.created||k); case 'days': return (t.rep.days||[]).includes(w); case 'month': return pkey(k).getDate()===pkey(t.date||k).getDate(); } return false; }
function isDone(t,k){ return t.rep?!!(t.doneD&&t.doneD[k]):!!t.done; }
/* семейная задача, назначенная другому участнику, видна только в Ритм·Семья */
function mine(t){ return !t.fam||!famOn()||Fam.mine(t); }
function tasksOn(k){ return S.tasks.filter(t=>isDue(t,k)&&mine(t)); }
function overdue(today=dkey()){ return S.tasks.filter(t=>!t.rep&&t.date&&t.date<today&&!t.done&&mine(t)); }
function inbox(){ return S.tasks.filter(t=>!t.rep&&!t.date&&!t.done&&mine(t)); }
function goalOf(id){ return S.goals.find(g=>g.id===id)||null; }
function fmtTime(t){ return t?t:''; }
function sortTasks(L,k){ return [...L].sort((a,b)=>{ const da=isDone(a,k), db=isDone(b,k); if(da!==db) return da?1:-1; if((a.time||'99')!==(b.time||'99')) return (a.time||'99')<(b.time||'99')?-1:1; return (a.created||0)-(b.created||0); }); }
/* Выполненные разовые задачи старше 45 дней уходят в архив по месяцам */
function archive(){ const lim=addDays(dkey(),-45); const old=S.tasks.filter(t=>!t.rep&&t.done&&(t.doneAt||t.date||'')<lim); if(!old.length) return; for(const t of old){ const k=mkey(t.doneAt||t.date); const b=bucket(k,()=>({tasks:[]})); b.tasks.push(t); Store.touch(k); } S.tasks=S.tasks.filter(t=>!old.includes(t)); Store.save(); }
function doneCountOn(k){ let n=0; for(const t of S.tasks){ if(t.rep){ if(t.doneD&&t.doneD[k]) n++; } else if(t.done&&t.doneAt===k) n++; } for(const b of Object.values(B)) for(const t of (b.tasks||[])) if(t.doneAt===k) n++; return n; }
/* Разбор быстрого ввода: «завтра», «в пт», «25.10», «в 18:00» */
const WD_PARSE=[['понедельник','пн'],['вторник','вт'],['среду','среда','ср'],['четверг','чт'],['пятницу','пятница','пт'],['субботу','суббота','сб'],['воскресенье','вс']];
function parseQuick(text,base){ let s=' '+text.replace(/\s+/g,' ')+' '; let date=base, time=null; const t=dkey();
 const tm=s.match(/\s(?:в|к)?\s?(\d{1,2}):(\d{2})(?=\s)/i); if(tm&&+tm[1]<24&&+tm[2]<60){ time=String(tm[1]).padStart(2,'0')+':'+tm[2]; s=s.replace(tm[0],' '); }
 else { const th=s.match(/\s(?:в|к)\s(\d{1,2})\s?(?:ч|час|часов|часа)?(?=\s)/i); if(th&&+th[1]>=6&&+th[1]<24){ time=String(th[1]).padStart(2,'0')+':00'; s=s.replace(th[0],' '); } }
 const low=s.toLowerCase(); let m;
 if(/\sпослезавтра(?=\s)/.test(low)){ date=addDays(t,2); s=s.replace(/\sпослезавтра(?=\s)/i,' '); }
 else if(/\sзавтра(?=\s)/.test(low)){ date=addDays(t,1); s=s.replace(/\sзавтра(?=\s)/i,' '); }
 else if(/\sсегодня(?=\s)/.test(low)){ date=t; s=s.replace(/\sсегодня(?=\s)/i,' '); }
 else if(/\sбез даты(?=\s)/.test(low)){ date=null; s=s.replace(/\sбез даты(?=\s)/i,' '); }
 else if((m=s.match(/\s(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?(?=\s)/))){ const y0=pkey(t).getFullYear(); const y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):y0; let d=dkey(new Date(y,+m[2]-1,+m[1],12)); if(!m[3]&&d<t) d=dkey(new Date(y0+1,+m[2]-1,+m[1],12)); if(+m[2]>=1&&+m[2]<=12&&+m[1]>=1&&+m[1]<=31){ date=d; s=s.replace(m[0],' '); } }
 else { for(let i=0;i<7;i++){ let hit=null; for(const nm of WD_PARSE[i]){ const re=new RegExp('\\s(?:в|во)?\\s?'+nm+'(?=\\s)','i'); const mm=s.match(re); if(mm){ hit=mm[0]; break; } } if(hit){ let n=(i-wdi(t)+7)%7; if(n===0) n=7; date=addDays(t,n); s=s.replace(hit,' '); break; } } }
 const title=s.replace(/\s+/g,' ').trim(); return {title:title?title[0].toUpperCase()+title.slice(1):'',date,time}; }
/* ---------- Цели: прогресс ---------- */
function linkVal(g){ const L=g.link; if(!L) return null;
 if(L.app==='dengi'){ const D=Family.read('dengi'); if(!D) return null; const j=(D.state.jars||[]).find(x=>x.id===L.jar); if(!j) return null; let v=j.start||0; for(const b of Object.values(D.b||{})) for(const o of (b.ops||[])) if(o.t==='tr'){ if(o.to==='jar:'+j.id) v+=o.sum; if(o.acc==='jar:'+j.id) v-=o.sum; } return {v,name:j.n,target:j.target}; }
 if(L.app==='telo'){ const T=Family.read('telo'); if(!T) return null; const from=g.created||'0000'; const ws=T.workouts.filter(w=>w.date>=from);
  if(L.m==='km') return {v:r1(sum(ws,w=>sum(w.ex||[],x=>x.cardio&&x.cardio.dist||0)))}; return {v:ws.length}; }
 return null; }
function goalCur(g){ if(g.kind==='num'){ const lv=linkVal(g); return lv?lv.v:(g.cur||0); } if(g.kind==='steps') return g.steps.filter(s=>s.done).length; return habitWeek(g,dkey()).n; }
function goalTotal(g){ if(g.kind==='num') return g.target||0; if(g.kind==='steps') return g.steps.length; return g.times||1; }
function goalFrac(g){ if(g.kind==='habit') return clamp(habitWeek(g,dkey()).n/(g.per==='day'?7:g.times||1),0,1); const t=goalTotal(g); const s=g.kind==='num'?(g.start||0):0; return t>s?clamp((goalCur(g)-s)/(t-s),0,1):0; }
function goalText(g){ if(g.kind==='steps') return `${goalCur(g)} из ${goalTotal(g)} ${plural(goalTotal(g),['этапа','этапов','этапов'])}`; if(g.kind==='num'){ const u=g.unit||''; return u==='₸'?`${fmtNum(goalCur(g),u)} из ${fmtNum(goalTotal(g),u)}`:`${fmt(goalCur(g),1)} из ${fmtNum(goalTotal(g),u)}`; } const w=habitWeek(g,dkey()); return g.per==='day'?`${w.n} из 7 на этой неделе`:`${w.n} из ${g.times} на этой неделе`; }
function fmtNum(v,u){ if(u==='₸'||u==='тг'){ return (Math.abs(v)>=1e6?fmt(v/1e6,2)+' млн':Math.abs(v)>=1e4?fmt(v/1e3,0)+' тыс':fmt(v,0))+' ₸'; } return fmt(v,1)+(u?' '+u:''); }
function habitWeek(g,k){ const ws=weekStart(k); let n=0; for(let i=0;i<7;i++){ const d=addDays(ws,i); if(hd(g,d)) n++; } return {n}; }
function habitDueToday(g,k){ if(g.kind!=='habit'||g.done) return false; if(g.per==='day') return true; return habitWeek(g,k).n<(g.times||1)||(hd(g,k)); }
function habitStreak(g){ let n=0, k=dkey(); if(g.per==='day'){ if(!(hd(g,k))) k=addDays(k,-1); while(hd(g,k)){ n++; k=addDays(k,-1); } return {n,u:DAYS}; }
 let ws=weekStart(k); if(habitWeek(g,ws).n<(g.times||1)) ws=addDays(ws,-7); while(habitWeek(g,ws).n>=(g.times||1)){ n++; ws=addDays(ws,-7); } return {n,u:['неделя','недели','недель']}; }
function goalPace(g){ if(!g.deadline||g.done||g.kind==='habit') return null; const t=dkey(); const left=dBetween(t,g.deadline); const tot=Math.max(1,dBetween(g.created||t,g.deadline)); const el=clamp(1-left/tot,0,1); const f=goalFrac(g);
 if(left<0) return {cls:'bad',t:`срок прошёл ${fmtDay(g.deadline)}`};
 if(f>=1) return {cls:'good',t:'цель достигнута'};
 const ahead=f-el; const rest=g.kind==='num'?goalTotal(g)-goalCur(g):goalTotal(g)-goalCur(g);
 const weeks=Math.max(1,left/7); const rate=rest/weeks; const per=g.kind==='num'?(g.unit==='₸'?`нужно ≈ ${fmtNum(rate*4.35,g.unit)} в месяц`:rate>=1?`нужно ≈ ${fmt(rate,1)}${g.unit?' '+g.unit:''} в неделю`:`нужно ≈ 1 раз в ${pl(Math.round(1/rate),['неделю','недели','недель'])}`):rate>=1?`нужно ≈ ${fmt(rate,1)} ${plural(Math.ceil(rate),['этап','этапа','этапов'])} в неделю`:`нужно ≈ 1 этап в ${pl(Math.max(1,Math.round(1/rate)),['неделю','недели','недель'])}`;
 if(ahead>=-.05) return {cls:'good',t:`в графике · осталось ${pl(left,DAYS)}`,per};
 return {cls:'warn',t:`отстаёте от графика · осталось ${pl(left,DAYS)}`,per}; }
/* ---------- Задачи из других приложений ---------- */
function linkedTasks(k){ const out=[]; const today=dkey(); if(k!==today) return out;
 const T=Family.read('telo'); if(T&&T.state.program){ const p=T.state.program; if((p.schedule||[]).includes(wdi(k))){ const n=(p.days||[]).length; const day=n?p.days[((p.seq||0)%n+n)%n]:null; const done=T.workouts.some(w=>w.date===k); out.push({id:'l-telo',app:'telo',t:done?`Тренировка сделана`:`Тренировка: ${day?day.name:'по программе'}`,done}); } }
 const D=Family.read('dengi'); if(D){ const st=D.state; for(const p of (st.pays||[])) if(p.on&&p.next<=k) out.push({id:'l-pay-'+p.id,app:'dengi',t:`Оплатить: ${p.n} — ${fmt(p.sum,0)} ₸`,done:false,od:p.next<k});
  for(const j of (st.jars||[])){ if(!j.target||!j.date) continue; const g=S.goals.find(x=>x.link&&x.link.jar===j.id); const ms=mkey(k); let bal=j.start||0, mon=0; for(const b of Object.values(D.b||{})) for(const o of (b.ops||[])) if(o.t==='tr'){ const d=(o.to==='jar:'+j.id?o.sum:0)-(o.acc==='jar:'+j.id?o.sum:0); bal+=d; if(mkey(o.date)===ms) mon+=d; }
   const months=Math.max(1,(pkey(j.date)-pkey(k))/(30.44*864e5)); const need=Math.max(0,(j.target-bal+mon)/months); if(need>=1000&&bal<j.target){ const left=Math.max(0,need-mon); out.push({id:'l-jar-'+j.id,app:'dengi',t:left>0?`Отложить в «${j.n}»: ещё ${fmt(Math.round(left/100)*100,0)} ₸ в этом месяце`:`«${j.n}»: план месяца выполнен`,done:left<=0,goal:g?g.id:null}); } } }
 const P=Family.read('pit'); if(P){ const sh=(P.state.shop||[]).filter(x=>!x.done); if(sh.length) out.push({id:'l-shop',app:'pit',t:`Купить продукты: ${sh.slice(0,3).map(x=>x.n.toLowerCase()).join(', ')}${sh.length>3?' и ещё '+(sh.length-3):''}`,done:false}); }
 return out; }
function hd(g,k){ if(g.hist&&g.hist[k]) return true; if(g.link&&g.link.app==='telo'){ const T=Family.read('telo'); if(T) return T.workouts.some(w=>w.date===k); } return false; }

function goalReminders(){ const R=Object.assign({morning:true,mtime:'09:00',lead:0},S.remind||{}); const t=dkey(); const out=[];
 for(let i=0;i<8;i++){ const k=addDays(t,i); const L=tasksOn(k).filter(x=>!isDone(x,k));
  for(const x of L) if(x.time){ const g=x.goal?goalOf(x.goal):null; out.push({id:'t-'+x.id+'-'+k,at:atTime(k,x.time)-(R.lead||0)*60000,title:x.t,text:(R.lead?`Через ${R.lead>=60?'час':R.lead+' минут'} · `:'')+(x.time)+(g?' · цель «'+g.n+'»':'')+(x.note?' · '+x.note.slice(0,80):'')}); }
  if(R.morning){ const od=i===0?overdue(k).length:0; const hab=S.goals.filter(g=>g.kind==='habit'&&!g.done&&g.per==='day').length; const n=L.length;
   if(n||od) out.push({id:'m-'+k,at:atTime(k,R.mtime),title:`На сегодня ${pl(n,['задача','задачи','задач'])}${od?` и ${od} просрочено`:''}`,text:L.slice(0,4).map(x=>(x.time?x.time+' ':'')+x.t).join(' · ')+(n>4?` и ещё ${n-4}`:'')+(hab?` · привычек: ${hab}`:'')}); } }
 return out; }

/* ============ Ритм·Цели — вкладки ============ */
function taskRow(t,k,opts={}){ const done=isDone(t,k); const g=t.goal?goalOf(t.goal):null; const pop=ui.pop===t.id+k;
 const meta=[opts.showDate&&t.date?`<span class="${t.date<dkey()&&!done?'bad-t b':''}">${relDay(t.date)}</span>`:'',t.time?ic('clock',13)+' '+t.time:'',t.rep?ic('repeat',13)+' '+REP[t.rep.k].toLowerCase():'',famOf(t)?`<span class="gchip fam">${ic('users',12)} ${esc(famLabel(t))}${t.who&&t.who!=='all'?' · '+esc(Fam.whoLabel(t)):''}</span>`:'',g?`<span class="gchip">${ic(GCATS[g.cat]?GCATS[g.cat][1]:'target',12)} ${esc(g.n)}</span>`:''].filter(Boolean).join('<span class="sep">·</span>');
 return `<div class="trow${done?' is-done':''}"><button class="chk-hit" data-a="tTog" data-id="${t.id}" data-k="${k}" aria-pressed="${done}" aria-label="${done?'Снять отметку':'Готово'}: ${esc(t.t)}"><span class="chk${done?' on':''}${pop?' pop':''}">${ic('check',18)}</span></button><button class="tmain" data-a="tEdit" data-id="${t.id}"><span class="tt${done?' done-t':''}">${esc(t.t)}</span>${meta?`<span class="tmeta">${meta}</span>`:''}</button>${opts.move&&!done?`<button class="ibtn sm ghostb" data-a="tMove" data-id="${t.id}" aria-label="Перенести на завтра" title="На завтра">${ic('arrowR',18)}</button>`:''}</div>`; }
function habitRow(g,k){ const done=!!(hd(g,k)); const w=habitWeek(g,k);
 return `<div class="trow${done?' is-done':''}"><button class="chk-hit" data-a="hTog" data-id="${g.id}" data-k="${k}" aria-pressed="${done}" aria-label="Привычка ${esc(g.n)}"><span class="chk round${done?' on':''}${ui.pop===g.id+k?' pop':''}">${ic('check',18)}</span></button><button class="tmain" data-a="push" data-s="goal" data-id="${g.id}"><span class="tt${done?' done-t':''}">${esc(g.n)}</span><span class="tmeta"><span class="gchip">${ic('fire',12)} привычка</span><span class="sep">·</span>${g.per==='day'?`${w.n} из 7 на неделе`:`${w.n} из ${g.times} на неделе`}</span></button></div>`; }
function linkRow(x){ return `<div class="trow${x.done?' is-done':''}"><span class="chk-hit"><span class="chk ext${x.done?' on':''}" style="${x.done?`background:${FAMILY[x.app].c};border-color:${FAMILY[x.app].c}`:`border-color:${FAMILY[x.app].c}`}">${ic('check',18)}</span></span><button class="tmain" data-a="openApp" data-v="${x.app}"><span class="tt${x.done?' done-t':''}${x.od?' bad-t':''}">${esc(x.t)}</span><span class="tmeta">${lchip(x.app)}</span></button></div>`; }
function goalRing(g,size=64){ const f=goalFrac(g); const lbl=g.kind==='steps'?`${goalCur(g)}/${goalTotal(g)}`:Math.round(f*100)+'%'; return ring(f,size,size>60?7:6,lbl,f>=1?'good':''); }

/* ---------- Сегодня ---------- */
VIEWS.today=()=>{ const k=dkey(); const sc=ui.tsc||'all'; const own=tasksOn(k).filter(t=>inScope(t,sc)); const habits=S.goals.filter(g=>habitDueToday(g,k)); const links=linkedTasks(k); const od=overdue(k);
 const total=own.length+habits.length+links.length; const done=own.filter(t=>isDone(t,k)).length+habits.filter(g=>hd(g,k)).length+links.filter(x=>x.done).length;
 let h=topBar()+`<div class="today-h"><div class="col-xs grow"><span class="lede">${esc(fmtLong(k))}</span><h1 class="h1">Сегодня</h1>${total?`<span class="note">${done} из ${total} готово${done===total?' — отличный день!':''}</span>`:''}</div>${total?ring(done/total,64,7,`${done}/${total}`,done===total?'good':''):''}</div>`;
 const pins=S.goals.filter(g=>!g.done&&g.pinned!==false);
 if(pins.length) h+=`<div class="gscroll">${pins.map(g=>`<button class="gcard" data-a="push" data-s="goal" data-id="${g.id}">${goalRing(g,56)}<span class="gc-n">${esc(g.n)}</span><span class="gc-s">${goalText(g)}</span></button>`).join('')}<button class="gcard add" data-a="goalNew">${ic('plus',22)}<span class="gc-n">Новая цель</span></button></div>`;
 else h+=`<button class="callout acc cardbtn" data-a="goalNew"><p class="b">${ic('target',18)} Поставьте первую цель</p><p>Пробежать полумарафон, накопить на отпуск, прочитать 24 книги — Ритм разобьёт её на шаги и покажет, успеваете ли вы.</p></button>`;
 if(S.tasks.some(x=>x.time)) h+=remindPrompt();
 if(od.length) h+=`<section class="col-s"><div class="between"><h2 class="sec-h bad-t">Просрочено · ${od.length}</h2><button class="btn ghost sm" data-a="odToday">Всё на сегодня</button></div><div class="tlist">${sortTasks(od,k).map(t=>taskRow(t,k,{showDate:true})).join('')}</div></section>`;
 const L=[...sortTasks(own,k).map(t=>({d:isDone(t,k),h:taskRow(t,k,{move:true})})),...habits.map(g=>({d:!!(hd(g,k)),h:habitRow(g,k)})),...links.map(x=>({d:x.done,h:linkRow(x)}))].sort((a,b)=>a.d-b.d);
 const hasFamT=famOn()&&S.tasks.some(t=>famOf(t));
 h+=`<section class="col-s"><div class="between"><h2 class="sec-h">Задачи</h2>${hasFamT?`<span class="note">${own.filter(t=>!famOf(t)).length} личных · ${own.filter(t=>famOf(t)).length} семейных</span>`:''}</div>${hasFamT?`<div class="scroller">${scopeChips('tScope',sc)}</div>`:''}<div class="tlist">${L.map(x=>x.h).join('')||`<div class="empty sm"><p class="p">На сегодня задач нет. Добавьте первую — например, «позвонить маме в 19:00».</p></div>`}</div></section>`;
 h+=quickAdd(k);

 h+=`<button class="btn sec blk" data-a="goalNew">${ic('plus',18)} Новая цель</button>`;

 let h=topBar()+`<div class="between"><h1 class="h1">План</h1><div class="mnav"><button class="ibtn" data-a="wkShift" data-v="-7" aria-label="Прошлая неделя">${ic('left',18)}</button><button class="mnav-t btn ghost" data-a="wkNow" style="padding:0 4px;color:var(--ink);min-width:116px">${fmtDay(ws)} – ${fmtDay(we)}</button><button class="ibtn" data-a="wkShift" data-v="7" aria-label="Следующая неделя">${ic('right',18)}</button></div></div>`;
 const ib=inbox(); h+=`<section class="col-s"><h2 class="sec-h">${ic('inbox',18)} Без даты${ib.length?' · '+ib.length:''}</h2>${ib.length?`<div class="tlist">${ib.map(x=>taskRow(x,t)).join('')}</div>`:'<p class="note">Сюда попадают задачи «когда-нибудь». Напишите «без даты» при добавлении.</p>'}</section>`;
 for(let i=0;i<7;i++){ const k=addDays(ws,i); const L=sortTasks(tasksOn(k),k); const hs=S.goals.filter(g=>g.kind==='habit'&&!g.done&&(k===t?habitDueToday(g,k):k<t&&hd(g,k)));
  const past=k<t; const n=L.length+hs.length; const dn=L.filter(x=>isDone(x,k)).length+hs.filter(g=>hd(g,k)).length;
  h+=`<section class="day${k===t?' today':''}${past?' past':''}"><div class="day-h"><span class="day-n">${WD_FULL[i]}${k===t?' · сегодня':''}</span><span class="note">${fmtDayG(k)}${n?` · ${dn}/${n}`:''}</span><button class="ibtn sm ghostb" data-a="tNew" data-v="${k}" aria-label="Задача на ${fmtDayG(k)}">${ic('plus',18)}</button></div>${n?`<div class="tlist">${L.map(x=>taskRow(x,k)).join('')}${hs.map(g=>habitRow(g,k)).join('')}</div>`:''}</section>`; }

VIEWS.stats=()=>{ const mode=ui.smode||'week'; const t=dkey(); const from=mode==='week'?weekStart(t):addDays(t,-29); const days=[]; for(let k=from;k<=t;k=addDays(k,1)) days.push(k);
 let h=topBar()+`<h1 class="h1">Итоги</h1>`+seg([['week','Эта неделя'],['month','30 дней']],'smode',mode,'Период');
 const doneBy=days.map(k=>doneCountOn(k)); const total=sum(doneBy);
 let planned=0, pdone=0; for(const k of days){ for(const x of tasksOn(k)){ planned++; if(isDone(x,k)) pdone++; } }
 let streak=0; for(let k=t;;k=addDays(k,-1)){ if(doneCountOn(k)>0) streak++; else if(k!==t) break; if(streak>400) break; }
 h+=`<div class="stats s2"><div class="stat"><span class="stat-v">${total}</span><span class="stat-l">${plural(total,['задача выполнена','задачи выполнено','задач выполнено'])}</span></div><div class="stat"><span class="stat-v">${planned?Math.round(pdone/planned*100):0}%</span><span class="stat-l">запланированного сделано</span></div><div class="stat"><span class="stat-v">${streak}</span><span class="stat-l">${plural(streak,['день','дня','дней'])} подряд с делами</span></div><div class="stat"><span class="stat-v">${S.goals.filter(g=>g.done&&g.doneAt>=from).length}</span><span class="stat-l">целей достигнуто</span></div></div>`;
 h+=`<section class="card col-s"><h2 class="sec-h">Выполнено по дням</h2>${barCols(days.map((k,i)=>({v:doneBy[i],label:mode==='week'?WD[wdi(k)]:(i%5===0||k===t?String(pkey(k).getDate()):''),title:fmtDayG(k),top:mode==='week'&&doneBy[i]?String(doneBy[i]):'',cur:k===t})))}</section>`;
 const hab=S.goals.filter(g=>g.kind==='habit'&&!g.done);
 if(hab.length) h+=`<section class="card col-s"><h2 class="sec-h">Привычки</h2>${hab.map(g=>{ const n=days.filter(k=>hd(g,k)).length; const need=g.per==='day'?days.length:Math.round(days.length/7*(g.times||1)); const s=habitStreak(g); return `<button class="catrow" data-a="push" data-s="goal" data-id="${g.id}"><span class="grow col-xs"><span class="row-b"><span class="b">${esc(g.n)}</span><span class="num">${n} из ${Math.max(1,need)}</span></span>${pbar(n/Math.max(1,need),n>=need?'good':'')}${s.n?`<span class="note">${ic('fire',13)} серия ${pl(s.n,s.u)}</span>`:''}</span></button>`; }).join('')}</section>`;
 const act=S.goals.filter(g=>!g.done&&g.kind!=='habit');
 if(act.length) h+=`<section class="card col-s"><h2 class="sec-h">Цели</h2>${act.map(g=>{ const p=goalPace(g); return `<button class="catrow" data-a="push" data-s="goal" data-id="${g.id}">${goalRing(g,44)}<span class="grow col-xs"><span class="b">${esc(g.n)}</span><span class="note">${goalText(g)}</span>${p?`<span class="note ${p.cls}-t">${p.t}</span>`:''}</span></button>`; }).join('')}</section>`;
 if(!total&&!hab.length&&!act.length) h+=`<div class="card">${empty('chart','Итоги появятся, когда вы начнёте отмечать задачи и привычки.')}</div>`;
 else h+=`<p class="note">${total?`${mode==='week'?'На этой неделе':'За 30 дней'} сделано ${pl(total,['дело','дела','дел'])}.`:''} ${streak>=3?`Серия ${pl(streak,DAYS)} — не прерывайте её!`:''}</p>`;
 return `<div class="col">${h}</div>`; };

 te:(d,t)=>{ ui.te[d.k]=t.value; const b=document.querySelector('[data-a="teSave"]'); if(b) b.disabled=!ui.te.t.trim(); },
 qa:(d,t)=>{ ui.qa={k:d.k,v:t.value}; refreshQa(); },
 ge:(d,t)=>{ const g=ui.ge; if(d.k==='target'||d.k==='cur') g[d.k]=parseNum(t.value)||0; else g[d.k]=t.value; const ok=g.n.trim()&&(g.kind!=='num'||g.target>0)&&(g.kind!=='steps'||(g.stepsTxt!=null?g.stepsTxt:(g.steps||[]).map(s=>s.n).join('\n')).trim()); const b=document.querySelector('[data-a="geSave"]'); if(b) b.disabled=!ok; }
});
APP.onBack=t=>{ if(!t) return; if(t.type==='task') ui.te=null; if(t.type==='goalEdit') ui.ge=null; };
APP.afterReset=()=>{ ui.ob=null; ui.stack=[{type:'onboard'}]; };
APP.tick=()=>{ if(!ui.stack.length&&ui.tab==='today'&&document.activeElement&&document.activeElement.id!=='qa') render(); };

A.remLead=d=>{ S.remind=Object.assign({},S.remind,{lead:Number(d.v)}); commit(); };
A.remMorning=d=>{ const R=Object.assign({morning:true},S.remind||{}); R.morning=!R.morning; S.remind=R; commit(); };
A.remMTime=d=>{ S.remind=Object.assign({},S.remind,{mtime:d.v}); commit(); };

if(typeof document!=='undefined'&&document.getElementById&&document.getElementById('view')) boot();
</script>

</body>
</html>
