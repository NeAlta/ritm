<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ритм">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F1EC">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="ritm-ios.css">
<script>window.RITM_APP=true;window.RITM_IOS=true;window.RITM_PAGE='telo'</script>
<script src="ritm-ios.js"></script>
</head>
<body>
<title>Ритм·Тело</title>
<style>
/* Layout: одна колонка до 480px, нижняя навигация из 4 вкладок; тренировка и редакторы — полноэкранные листы поверх */
:root{
  --bg:#F4F1EC; --card:#FFFFFF; --sunk:#EFEBE4; --line:#E6E0D6; --ink:#17161A; --muted:#5F5A52; --faint:#8C867C;
  --accent:#F0643C; --accent-ink:#A83A17; --accent-tint:#FCE3D9; --on-accent:#17161A;
  --btn:#17161A; --on-btn:#FFFFFF;
  --dark-card:#17161A; --on-dark:#FFFFFF; --on-dark-muted:#CFCBC4; --dk-eyebrow:#F7A589; --dk-line:#2E2C30;
  --good:#2F7A4D; --good-tint:#E3F2E8; --on-good:#FFFFFF;
  --warn:#8A5A0B; --warn-tint:#FCEFD2; --warn-ink:#6B4507;
  --bad:#B42318; --bad-tint:#FDE7E4; --on-bad:#FFFFFF;
  --shadow:rgba(23,22,26,.18);
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-lg:24px;
  --heat1:#FCD9CB; --heat2:#F7A285; --heat3:#F0643C; --heat4:#A83A17;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121110; --card:#1E1C1A; --sunk:#292623; --line:#36322E; --ink:#F2EEE8; --muted:#AFA89E; --faint:#7E776E;
  --accent:#F0643C; --accent-ink:#FF9877; --accent-tint:#3D2419; --on-accent:#17161A;
  --btn:#F2EEE8; --on-btn:#17161A;
  --dark-card:#2B2724; --on-dark:#F2EEE8; --on-dark-muted:#BDB5AA; --dk-eyebrow:#FF9877; --dk-line:#3E3934;
  --good:#7CCB9A; --good-tint:#1B2C21; --on-good:#0F1F15;
  --warn:#E9B455; --warn-tint:#33280F; --warn-ink:#F2C46A;
  --bad:#FF8A7A; --bad-tint:#3A1C18; --on-bad:#2A0F0B;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
  --heat1:#4A2A1E; --heat2:#8C3F26; --heat3:#F0643C; --heat4:#FFB59C;
}}
:root[data-theme="dark"]{
  --bg:#121110; --card:#1E1C1A; --sunk:#292623; --line:#36322E; --ink:#F2EEE8; --muted:#AFA89E; --faint:#7E776E;
  --accent:#F0643C; --accent-ink:#FF9877; --accent-tint:#3D2419; --on-accent:#17161A;
  --btn:#F2EEE8; --on-btn:#17161A;
  --dark-card:#2B2724; --on-dark:#F2EEE8; --on-dark-muted:#BDB5AA; --dk-eyebrow:#FF9877; --dk-line:#3E3934;
  --good:#7CCB9A; --good-tint:#1B2C21; --on-good:#0F1F15;
  --warn:#E9B455; --warn-tint:#33280F; --warn-ink:#F2C46A;
  --bad:#FF8A7A; --bad-tint:#3A1C18; --on-bad:#2A0F0B;
  --shadow:rgba(0,0,0,.5); color-scheme:dark;
  --heat1:#4A2A1E; --heat2:#8C3F26; --heat3:#F0643C; --heat4:#FFB59C;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px calc(100px + env(safe-area-inset-bottom,0px))}
.col{display:flex;flex-direction:column;gap:14px}
.col-s{display:flex;flex-direction:column;gap:10px}
.col-xs{display:flex;flex-direction:column;gap:4px;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.gap6{gap:6px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top-al{align-items:flex-start}
.grow{flex:1;min-width:0}
.split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.self-start{align-self:flex-start}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.tile{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink);padding:0;flex-shrink:0}
.h1{font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.15;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.25;margin:0;text-wrap:balance}
.h3{font-size:17px;font-weight:700;margin:0}
.sec-h{font-size:16px;font-weight:700;margin:0}
.lede{margin:0;color:var(--muted);font-size:14px}
.p{margin:0}
.note{margin:0;color:var(--muted);font-size:13px}
.lbl{font-size:13px;color:var(--muted)}
.mut{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dk-eyebrow)}
.eyebrow-l{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.card{background:var(--card);border-radius:var(--r-lg);padding:16px}
.card.dark{background:var(--dark-card);color:var(--on-dark)}
.dk-t{font-size:20px;font-weight:600;margin:0}
.dk-s,.dk-note{margin:0;font-size:14px;color:var(--on-dark-muted)}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.good{background:var(--good-tint);color:var(--good)}
.badge.warn{background:var(--warn-tint);color:var(--warn-ink)}
.badge.bad{background:var(--bad-tint);color:var(--bad)}
.badge.acc{background:var(--accent-tint);color:var(--accent-ink)}
.badge.mut{background:var(--sunk);color:var(--muted)}
.badge.on-dk{background:var(--dk-line);color:var(--on-dark)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid transparent;font-weight:700;font-size:15px;background:none;color:var(--ink);text-align:center}
.btn.pri{background:var(--btn);color:var(--on-btn)}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn.sec{border-color:var(--ink);color:var(--ink)}
.btn.sec-dk{border-color:var(--on-dark-muted);color:var(--on-dark)}
.btn.ghost{color:var(--accent-ink);padding:0 10px;min-height:40px;font-weight:600}
.btn.danger{background:var(--bad);color:var(--on-bad)}
.danger-t{color:var(--bad)!important}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.blk{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btn:active:not([disabled]){transform:scale(.98)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent-ink);background:var(--accent-tint);color:var(--accent-ink)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex-shrink:0}
.ready{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ready>svg{flex:0 0 112px;width:112px;height:112px}
.ready>.grow{flex:1 1 170px;min-width:0}
.ready .badge{white-space:normal}
.ring .rt{fill:none;stroke:var(--sunk);stroke-width:10}
.ring .rv{fill:none;stroke-width:10;stroke-linecap:round;stroke-dashoffset:var(--off)}
.ring .rv.lv-high{stroke:var(--good)} .ring .rv.lv-mid{stroke:var(--warn)} .ring .rv.lv-low{stroke:var(--bad)}
.ring.anim .rv{animation:ringIn 1s cubic-bezier(.2,.8,.2,1)}
@keyframes ringIn{from{stroke-dashoffset:var(--full)}}
.ring .rn{font-family:var(--f-display);font-size:28px;font-weight:600;fill:var(--ink)}
.ring .rl{font-size:11px;fill:var(--muted);font-family:var(--f-body)}
.ck-row{display:flex;flex-direction:column;gap:6px}
.plan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--dk-line);align-items:baseline}
.pi:first-child{border-top:none}
.pi-n{font-weight:500;text-align:left;background:none;border:none;padding:0;color:inherit;min-width:0}
.pi-v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.pi-r{grid-column:1/-1;font-size:12px;color:var(--muted)}
.plan-list.lt .pi{border-top-color:var(--line)}
.lnk{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.wd-dot{width:32px;height:32px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--on-accent);box-sizing:border-box}
.wd.plan .wd-dot{background:transparent;border:2px dashed var(--accent)}
.wd.done .wd-dot{background:var(--accent);border:none}
.wd.today .wd-l{color:var(--ink);font-weight:700}
.wd.today .wd-dot{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.lg{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-sizing:border-box}
.lg.done{background:var(--accent)} .lg.plan{border:2px dashed var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats.s2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:var(--sunk);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat-v{font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.stat-l{font-size:12px;color:var(--muted)}
.list{background:var(--card);border-radius:var(--r-lg);padding:2px 16px}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 0;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.li:last-child{border-bottom:none}
.li-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li-t{font-weight:600}
.li-s{font-size:13px;color:var(--muted)}
.li-e{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .chev{color:var(--faint);flex-shrink:0}
.grp-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 -6px}
.stp{display:flex;flex-direction:column;gap:6px;min-width:0}
.stp-c{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;background:var(--sunk);border-radius:16px;padding:4px}
.stp-b{width:44px;height:44px;border-radius:12px;border:none;background:var(--card);font-size:22px;font-weight:600;color:var(--accent-ink);padding:0}
.stp-v{width:100%;min-width:0;border:none;background:transparent;text-align:center;font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;color:var(--ink)}
.stp-v:focus{outline:none}
.stp-c:focus-within{box-shadow:0 0 0 2px var(--accent)}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:flex;align-items:center;gap:8px;border-radius:14px;background:var(--sunk);padding:4px;transition:background-color .25s}
.setrow.focus{background:var(--accent-tint);box-shadow:inset 0 0 0 1.5px var(--accent)}
.setrow.done{background:var(--good-tint)}
.sr-main{flex:1;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 8px;border:none;background:none;text-align:left;color:var(--ink);min-width:0}
.sr-n{width:20px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sr-v{font-weight:700;font-variant-numeric:tabular-nums;flex:1}
.sr-rir{font-size:12px;color:var(--muted)}
.sr-chk{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--faint);flex-shrink:0;padding:0}
.sr-chk.on{background:var(--good);border-color:var(--good);color:var(--on-good)}
.sr-chk.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.seted{display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:16px;border:1.5px solid var(--accent);background:var(--card);animation:fadeUp .2s ease-out}
@keyframes fadeUp{from{transform:translateY(-4px);opacity:.6}}
.exb{display:flex;flex-direction:column;gap:10px}
.exb.complete{box-shadow:inset 0 0 0 1.5px var(--good)}
.exn{font-size:17px;font-weight:700;text-align:left;background:none;border:none;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.warn-t{color:var(--warn)}
.restbar{display:flex;align-items:center;gap:10px;background:var(--dark-card);color:var(--on-dark);border-radius:20px;padding:8px 8px 8px 12px;margin-bottom:10px;animation:fadeUp .25s ease-out}
.restbar .lbl{color:var(--on-dark-muted);display:block;font-size:12px}
.rest-t{font-family:var(--f-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.rest-ring .rt{fill:none;stroke:var(--dk-line);stroke-width:4}
.rest-ring .rv{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.restbar .btn.ghost{color:var(--on-dark)}
.restbar .btn.sec{border-color:var(--on-dark-muted);color:var(--on-dark)}
#sheet{position:fixed;inset:0;z-index:30;background:var(--bg)}
.sh{display:flex;flex-direction:column;height:100%}
.sh.enter{animation:shIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes shIn{from{transform:translateY(32px);opacity:.4}}
.sh-in{max-width:480px;margin:0 auto;width:100%}
.sh-head{padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.sh-head .sh-in{display:flex;align-items:center;gap:10px;min-height:44px}
.sh-t{flex:1;min-width:0}
.sh-title{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
.sh-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;border:none;background:none;color:var(--muted);font-size:11px;font-weight:500;border-radius:12px;padding:0}
.tab[aria-current="page"]{color:var(--accent-ink);font-weight:700}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.inp{width:100%;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--accent)}
.tm{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:6px}
.tm .inp{text-align:center;padding:0 6px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:14px;color:var(--muted)}
.search .inp{padding-left:42px}
.callout{border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px;align-items:flex-start}
.callout p{margin:0}
.callout.warn{background:var(--warn-tint);color:var(--warn-ink)}
.callout.acc{background:var(--accent-tint);color:var(--accent-ink)}
.callout.good{background:var(--good-tint);color:var(--good)}
.callout.mut{background:var(--sunk);color:var(--ink)}
.callout .btn.ghost{color:inherit;padding:0;min-height:32px;text-decoration:underline;text-underline-offset:3px}
.confirm{background:var(--bad-tint);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;color:var(--bad);font-weight:600}
.mus{display:grid;grid-template-columns:118px minmax(0,1fr) 40px;align-items:center;gap:10px;font-size:14px}
.mus span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.c-grid{stroke:var(--line);stroke-width:1}
.c-lbl{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.c-area{fill:var(--accent-tint)}
.c-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.c-dot{fill:var(--accent);stroke:var(--card);stroke-width:2}
.c-pt{fill:var(--card);stroke:var(--accent);stroke-width:2}
.c-guide{stroke:var(--faint);stroke-dasharray:3 3}
.c-tip{fill:var(--ink)}
.c-tipt{fill:var(--bg);font-size:12px;font-weight:700;font-family:var(--f-body)}
.c-hit{fill:transparent;cursor:pointer}
.wkbar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.wkb{height:8px;border-radius:4px;background:var(--sunk)}
.wkb.past{background:var(--accent)}
.wkb.cur{background:var(--accent-ink)}
.wkb.dl{background:repeating-linear-gradient(45deg,var(--sunk) 0 3px,var(--line) 3px 6px)}
.wkb.dl.cur{background:repeating-linear-gradient(45deg,var(--accent-tint) 0 3px,var(--accent-ink) 3px 6px)}
.dchip{display:inline-grid;place-items:center;min-width:36px;height:30px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.dchip.on{background:var(--accent-tint);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px var(--shadow);animation:fadeUp .2s ease-out}
.pr{display:flex;align-items:center;gap:12px}
.pr-ic{width:40px;height:40px;border-radius:12px;background:var(--accent-tint);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.pr.pop .pr-ic{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
details.card summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary{margin-bottom:10px}

function inv(){ return S.profile.inv; }
function stepOf(e){ const v=inv(); if(e.eq==='barbell') return 2*Math.min(...v.plates); if(e.eq==='dumbbell') return v.db||2; if(e.eq==='machine'||e.eq==='cable') return v.machine||5; return 2.5; }
function roundW(e,v){ if(v==null||!isFinite(v)) return null; const s=stepOf(e); if(e.eq==='barbell'){ const bar=inv().bar; if(v<=bar) return bar; return r2(bar+Math.round((v-bar)/s)*s); } if(e.eq==='bw'){ if(v<=0) return 0; return r2(Math.round(v/s)*s); } return r2(Math.max(s,Math.round(v/s)*s)); }
function platesText(w){ const v=inv(); let rem=(w-v.bar)/2; if(rem<=0.001) return 'только гриф'; const ps=[...v.plates].sort((a,b)=>b-a); const out=[]; for(const p of ps){ while(rem>=p-1e-9){ out.push(p); rem-=p; } } return out.map(p=>fmt(p,2)).join(' + ')+(rem>0.01?' (≈)':''); }
function defaultInc(e){ if(e.eq==='barbell') return (e.p==='squat'||e.p==='hinge')?5:2.5; if(e.eq==='dumbbell') return inv().db||2; if(e.eq==='bw') return 2.5; return inv().machine||5; }
function defaultRest(e){ if(e.k==='w') return (e.eq==='barbell'&&['squat','hinge','hpush','vpush','hpull'].includes(e.p))?180:120; if(e.k==='bw') return 90; if(e.k==='time') return 60; return 0; }
function defaultMode(e){ return (e.id==='run'||e.id==='walk')?'dist':'dur'; }
function estimateStart(e,it){ const P=S.profile; const lf={novice:.8,mid:1,adv:1.25}[P.level]||1; return (e.start||.3)*P.kg*(P.sex==='f'?.7:1)*lf*(((it&&it.rmin)||8)>=8?.85:1); }
function e1(w,r,rir){ const reps=r+(rir==null?0:Math.min(rir,4)); if(!w||!r||r<1||reps>15) return null; return r1(w*(1+reps/30)); }
function entryE1(exId,sets){ const e=EXI[exId]; let best=null; for(const s of sets){ let load=null; if(e.k==='w') load=s.w; else if(e.k==='bw'&&e.bw>=.9) load=S.profile.kg*e.bw+(s.w||0); if(load){ const v=e1(load,s.r,s.rir); if(v&&(!best||v>best)) best=v; } } return best; }

function mkItem(ex,o={}){
 const e=EXI[ex]; const it={id:'i'+uid(),ex,sets:o.sets!=null?o.sets:3,rmin:o.rmin!=null?o.rmin:8,rmax:o.rmax!=null?o.rmax:(o.rmin!=null?o.rmin:8),rule:o.rule,inc:o.inc!=null?o.inc:defaultInc(e),rpe:o.rpe||8,rest:o.rest!=null?o.rest:defaultRest(e),st:{}};
 if(e.k==='w'){ it.rule=it.rule||(it.rmin===it.rmax?'linear':'double'); if(it.rule==='linear'||it.rule==='rpe'||it.rule==='cycle') it.rmax=it.rmin; if(it.rule==='double'&&it.rmax<=it.rmin) it.rmax=it.rmin+4; }
 if(e.k==='bw'){ it.rule=o.rule==='cycle'?'cycle':'reps'; if(it.rule==='reps'&&it.rmax<=it.rmin) it.rmax=it.rmin+6; if(it.rmax<it.rmin) it.rmax=it.rmin; }
 if(o.scale) it.cscale=[...o.scale];
 if(e.k==='time'){ it.rule='time'; it.rmin=it.rmax=0; it.st.secs=o.secs||30; }
 if(e.k==='cardio'){ it.rule='cardio'; it.sets=1; it.mode=o.mode||defaultMode(e); it.base=o.base!=null?o.base:(it.mode==='dist'?3:20); it.grow=o.grow!=null?o.grow:8; it.rest=0; }
 return it;
}
function initState(it){ const e=EXI[it.ex]; const st=it.st||(it.st={});
 if(e.k==='w'){ if(st.w==null){ st.w=roundW(e,estimateStart(e,it)); st.est=true; } if(it.rule==='double'&&st.reps==null) st.reps=it.rmin; if(it.rule==='wave'&&!st.tm) st.tm=r1(st.w*1.05); if(it.rule==='rpe'&&!st.e1) st.e1=r1(st.w*(1+(it.rmin+10-it.rpe)/30)); }
 if(e.k==='bw'){ if(st.reps==null) st.reps=it.rmin; if(st.w==null) st.w=0; }
 if(e.k==='time'&&!st.secs) st.secs=30;
}

function applyTemplateObj(T,sched){ const old=allItems(S.program);
 const p={id:'p'+uid(),name:T.name,tpl:T.key,weeks:T.weeks,deload:true,schedule:[...(sched||T.schedule)].sort((a,b)=>a-b),start:dkey(),seq:0,days:T.days.map(d=>({id:'d'+uid(),name:d.name,items:d.items.map(([ex,o])=>mkItem(ex,o))}))};

 if(T.cycle){ const c=CYCLES[T.cycle]; p.cycle={on:true,preset:T.cycle,weeks:clone(c.weeks),next:c.next}; p.advance='sessions'; p.cw=0; p.cs=0; p.block=1; p.weeks=c.weeks.length; p.deload=false; for(const it of allItems(p)) if(it.rule==='cycle') it.st.cycle=1; }

function progWeek(p,date){

function cycRef(p){ const it=allItems(p).find(x=>x.rule==='cycle'&&EXI[x.ex].k==='w'&&x.st&&x.st.w); return {r:it?it.rmin:10,w:it?it.st.w:60}; }
function cycleAdvance(p,steps){ const n=p.cycle.weeks.length; let w=(p.cw||0)+steps; p.cs=0; while(w>=n){ w-=n; p.block=(p.block||1)+1; } p.cw=w; }
function rollItem(it,p){ const e=EXI[it.ex], st=it.st, n=e.n, mode=it.next||p.cycle.next||'results'; let msg=null;

function planText(pl,it){

/* ============ Логика: результаты и прогрессия ============ */

 if(en.kind==='time'){ if(reduced) return null; const ok=done.length>=sets.length&&done.every(s=>s.s>=s.ts); if(ok){ st.secs=(st.secs||30)+5; return `${n}: ${st.secs} с (+5)`; } return `${n}: время прежнее`; }

/* ============ Логика: история, рекорды, нагрузка ============ */
function sessionsOf(exId){ const out=[]; for(const w of W){ for(const x of (w.ex||[])){ if(x.ex===exId) out.push({w,x}); } } return out; }
function lastSession(exId){ const s=sessionsOf(exId).find(o=>(o.x.sets&&o.x.sets.length)||o.x.cardio); return s?s.x:null; }
function setsText(x){ if(x.cardio){ const c=x.cardio; return (c.dist?fmt(c.dist)+' км · ':'')+fmtDur(c.sec); } const e=EXI[x.ex]; return (x.sets||[]).map(s=>e.k==='time'?`${s.s} с`:e.k==='bw'?(s.w?`+${fmt(s.w,2)}×${s.r}`:`${s.r}`):`${fmt(s.w,2)}×${s.r}`).join(', '); }
function lastPerf(exId){ const s=sessionsOf(exId)[0]; return s?`${setsText(s.x)} · ${fmtDay(s.w.date)}`:''; }
function seriesE1(exId){ const m={}; for(const w of W){ for(const x of (w.ex||[])){ if(x.ex===exId&&x.e1){ if(!m[w.date]||x.e1>m[w.date]) m[w.date]=x.e1; } } } return Object.keys(m).sort().map(t=>({t,v:m[t]})); }
function bestOf(exId,f){ let b=null; for(const {x} of sessionsOf(exId)){ const v=f(x); if(v!=null&&(b==null||v>b)) b=v; } return b; }
function cardioPace(x){ return x.cardio&&x.cardio.dist>=1&&x.cardio.sec?x.cardio.sec/x.cardio.dist:null; }
function detectPRs(ex){ const out=[];
 for(const x of ex){
  if(x.cardio){ const pd=bestOf(x.ex,y=>y.cardio?y.cardio.dist||null:null); if(pd&&x.cardio.dist>pd) out.push({ex:x.ex,t:'dist',v:x.cardio.dist}); const pc=cardioPace(x); let bp=null; for(const {x:y} of sessionsOf(x.ex)){ const v=cardioPace(y); if(v&&(bp==null||v<bp)) bp=v; } if(pc&&bp&&pc<bp-0.5) out.push({ex:x.ex,t:'pace',v:pc}); continue; }
  if(x.e1){ const pb=bestOf(x.ex,y=>y.e1||null); if(pb&&x.e1>pb+0.05){ out.push({ex:x.ex,t:'e1',v:x.e1}); continue; } }
  if(EXI[x.ex].k==='w'){ const tw=Math.max(...x.sets.map(s=>s.w||0)); const pw=bestOf(x.ex,y=>y.sets&&y.sets.length?Math.max(...y.sets.map(s=>s.w||0)):null); if(pw&&tw>pw) out.push({ex:x.ex,t:'w',v:tw}); }
 } return out; }
function prText(p){ const n=EXI[p.ex]?EXI[p.ex].n:p.ex; if(p.t==='e1') return [n,`Расчётный максимум ${fmt(p.v)} кг`]; if(p.t==='w') return [n,`Самый большой вес ${fmt(p.v,2)} кг`]; if(p.t==='dist') return [n,`Самая длинная дистанция ${fmt(p.v)} км`]; return [n,`Лучший темп ${fmtPace(p.v)}`]; }
function acr(date){ const from=addDays(date,-27); const ws=W.filter(w=>w.date>=from&&w.date<=date); if(ws.length<3) return null; const a7=addDays(date,-6); const acute=ws.filter(w=>w.date>=a7).reduce((s,w)=>s+(w.load||0),0); const chronic=ws.reduce((s,w)=>s+(w.load||0),0)/4; if(!chronic) return null; return {acute,chronic,ratio:acute/chronic}; }
function readiness(date){ const c=S.checkins[date]; if(!c) return null;
 const sl=[20,45,70,90,100][c.sleep]; const en=(c.energy-1)/4*100; const so=(5-c.sore)/4*100; let sc=.4*sl+.35*en+.25*so; const reasons=[];
 if(c.sore>=4) reasons.push('сильно болят мышцы'); if(c.energy<=2) reasons.push('мало сил'); if(c.sleep<=1) reasons.push('мало сна');
 const a=acr(date); if(a&&a.ratio>1.5){ sc-=10; reasons.push('нагрузка выросла слишком быстро'); } else if(a&&a.ratio>1.3){ sc-=5; reasons.push('нагрузка растёт быстро'); }

function calcKcal(a,rpe,dur){ const kg=S.profile.kg; let cmin=0,kc=0;

  if(e.ct==='run'||e.ct==='walk'){ const v=c.dist?c.dist/(t/60):(e.ct==='run'?9:5.5); const mpm=v*1000/60; met=(v>7.5?(.2*mpm+3.5):(.1*mpm+3.5))/3.5; } else met={bike:7,row:7,rope:11}[e.ct]||6;

/* ============ Тренировка ============ */
function buildEntry(it,ctx){ const e=EXI[it.ex]; const pl=planItem(it,ctx);

function doneCount(en){ return en.kind==='cardio'?(en.cardio.done?1:0):en.sets.filter(s=>s.done).length; }

function anyDone(a){ return a.ex.some(en=>!en.skipped&&doneCount(en)>0); }
function focusOf(a){ if(ui.focus){ const [ei,si]=ui.focus.split(':').map(Number); if(a.ex[ei]&&a.ex[ei].sets[si]) return {ei,si}; }
 for(let ei=0;ei<a.ex.length;ei++){ const en=a.ex[ei]; if(en.skipped||en.kind==='cardio') continue; const si=en.sets.findIndex(s=>!s.done); if(si>=0) return {ei,si}; } return null; }

function finishSave(){

  if(en.kind==='cardio'){ const c=en.cardio; if(!c.done) return null; r.cardio={dist:c.dist||0,sec:(c.min||0)*60+(c.sec||0)}; return r; }

  if(a.factor<1||a.deload) changes.push('Облегчённая тренировка — рабочие веса на следующую не меняются');
  const idx=p.days.findIndex(d=>d.id===a.dayId); if(idx>=0) p.seq=idx+1;
  if(idx>=0&&cycOn(p)&&p.advance!=='calendar'){ p.cs=(p.cs||0)+1; if(p.cs>=p.schedule.length){ const before=p.block||1; cycleAdvance(p,1); const nw=p.cycle.weeks[p.cw]; changes.push(`Неделя ${p.cw+1} — «${nw.name}» — начинается со следующей тренировки`); if((p.block||1)>before){ const notes=rollCycles(p)||[]; changes.push('Новый цикл — база обновлена по правилу «'+NEXT[p.cycle.next].n.toLowerCase()+'»'); notes.forEach(x=>changes.push(x)); if(p.lastRoll) p.lastRoll.seen=true; } } } }
 const w={id:'w'+uid(),date,start:a.start,end:Date.now(),dur:f.dur,day:a.dayName,prog:p?p.name:'',week:a.week,deload:!!a.deload,rpe:f.rpe,load:f.rpe*f.dur,kcal,ton,nsets,ex,prs,changes};
 S.active=null; ui.finish=null; ui.focus=null; ui.confirm=null; releaseWake();
 Store.addW(w); Store.save();
 ui.stack=[{type:'summary',id:w.id}]; render();
}

function ring(score,lv){ const C=2*Math.PI*44, off=C*(1-score/100); const key=dkey()+score; const anim=ui.ringSeen!==key?' anim':''; ui.ringSeen=key;

function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const n=raw/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function chartSVG(pts,sel,unit){ if(pts.length<2) return `<div class="ph"><p class="p">Нужно минимум две тренировки с этим упражнением, чтобы построить график.</p></div>`;
 const Wd=340,Ht=190,L=44,R=14,T=34,B=26; const xs=pts.map(p=>pkey(p.t).getTime()); const x0=Math.min(...xs),x1=Math.max(...xs);
 let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v)); if(hi-lo<2){ lo-=2; hi+=2; } const pad=(hi-lo)*.15; lo-=pad; hi+=pad;
 const step=niceStep((hi-lo)/3); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
 const X=t=>x1===x0?L+(Wd-L-R)/2:L+(t-x0)/(x1-x0)*(Wd-L-R); const Y=v=>T+(hi-v)/(hi-lo)*(Ht-T-B);
 let g=''; for(let v=lo;v<=hi+1e-9;v+=step){ const y=Y(v).toFixed(1); g+=`<line class="c-grid" x1="${L}" x2="${Wd-R}" y1="${y}" y2="${y}"/><text class="c-lbl" x="${L-8}" y="${(+y+4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`; }
 const P=pts.map((p,i)=>[X(xs[i]),Y(p.v)]); const line=P.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
 const base=Y(lo); const area=line+` L${P[P.length-1][0].toFixed(1)} ${base.toFixed(1)} L${P[0][0].toFixed(1)} ${base.toFixed(1)} Z`;
 const si=sel==null||sel>=pts.length?pts.length-1:sel; const sp=P[si]; const tip=`${fmtDay(pts[si].t)} · ${fmt(pts[si].v)} ${unit}`; const tw=tip.length*6.6+16; const tx=clamp(sp[0]-tw/2,L,Wd-R-tw);

function liftsData(){ const today=dkey(), ago=addDays(today,-28); const out=[]; for(const e of EX){ const s=seriesE1(e.id); if(!s.length) continue; const best=Math.max(...s.map(p=>p.v)); const last=s[s.length-1]; const old=[...s].reverse().find(p=>p.t<=ago); out.push({e,s,best,last,old}); } return out.sort((a,b)=>b.best-a.best); }
function viewProgress(){
 let h=topBar()+`<h1 class="h1">Прогресс</h1>`;
 if(!W.length) return `<div class="col">${h}<section class="card ph">${ic('chart',28)}<p class="p">Здесь появятся рекорды, график силы и история после первой тренировки.</p><button class="btn pri" data-a="tab" data-t="today">К тренировке</button></section>${bodyWeightCard()}${measCard()}</div>`;
 const today=dkey(), from=addDays(today,-27); const ws=W.filter(w=>w.date>=from);
 h+=`<section class="card col-s"><h2 class="sec-h">Последние 4 недели</h2><div class="stats s2"><div class="stat"><span class="stat-v">${ws.length}</span><span class="stat-l">тренировок</span></div><div class="stat"><span class="stat-v">${fmt(ws.reduce((s,w)=>s+(w.ton||0),0)/1000,1)} т</span><span class="stat-l">поднято всего</span></div><div class="stat"><span class="stat-v">${fmt(ws.reduce((s,w)=>s+(w.dur||0),0)/60,1)} ч</span><span class="stat-l">в тренировках</span></div><div class="stat"><span class="stat-v">${fmt(ws.reduce((s,w)=>s+(w.kcal||0),0),0)}</span><span class="stat-l">ккал</span></div></div></section>`;
 h+=muscleMap();
 h+=`<section class="card col-s"><h2 class="sec-h">Тоннаж по неделям</h2><p class="note">Сколько тонн поднято за неделю, последние 10 недель. Цифры — в тоннах.</p>${barCols(weeklyTonnage())}</section>`;
 h+=muscleBars();
 const L=liftsData();
 if(L.length){ if(!ui.chartEx||!L.some(l=>l.e.id===ui.chartEx)) ui.chartEx=L[0].e.id; const cur=L.find(l=>l.e.id===ui.chartEx);
  h+=`<section class="card col-s"><h2 class="sec-h">Расчётный максимум</h2><p class="note">Вес на одно повторение, посчитанный по вашим подходам (формула Эпли).</p><div class="scroller">${L.map(l=>`<button class="chip" data-a="chartEx" data-v="${l.e.id}" aria-pressed="${l.e.id===ui.chartEx}">${esc(l.e.n)}</button>`).join('')}</div>${chartSVG(cur.s,ui.cpt,'кг')}</section>`;
  h+=`<section class="list" aria-label="Рекорды">${L.slice(0,8).map(l=>{ const ch=l.old?(l.last.v-l.old.v)/l.old.v*100:null; return `<button class="li" data-a="openEx" data-id="${l.e.id}"><span class="li-m"><span class="li-t">${esc(l.e.n)}</span><span class="li-s">рекорд ${fmt(l.best)} кг${ch!=null?` · за 4 недели ${ch>=0?'+':'−'}${fmt(Math.abs(ch),1)}%`:''}</span></span><span class="li-e">${fmt(l.last.v)} кг</span></button>`; }).join('')}</section>`; }
 const runs=W.flatMap(w=>(w.ex||[]).filter(x=>x.cardio&&EXI[x.ex].ct==='run').map(x=>({w,x})));
 if(runs.length){ const bd=Math.max(...runs.map(r=>r.x.cardio.dist||0)); const paces=runs.map(r=>cardioPace(r.x)).filter(Boolean); const bp=paces.length?Math.min(...paces):null; const km=runs.filter(r=>r.w.date>=from).reduce((s,r)=>s+(r.x.cardio.dist||0),0);
  h+=`<section class="card col-s"><h2 class="sec-h">Бег</h2><div class="stats"><div class="stat"><span class="stat-v">${fmt(km)}</span><span class="stat-l">км за 4 недели</span></div><div class="stat"><span class="stat-v">${fmt(bd)}</span><span class="stat-l">самая длинная, км</span></div><div class="stat"><span class="stat-v">${bp?fmtDur(bp):'—'}</span><span class="stat-l">лучший темп /км</span></div></div></section>`; }
 h+=strengthCard();
 h+=bodyWeightCard();
 h+=measCard();
 const hist=ui.histAll?W:W.slice(0,15);
 h+=`<div class="between"><h2 class="sec-h">История</h2><span class="note">${W.length} ${plural(W.length,['тренировка','тренировки','тренировок'])}</span></div><section class="list">${hist.map(w=>`<button class="li" data-a="push" data-s="history" data-id="${w.id}"><span class="li-m"><span class="li-t">${esc(w.day)}</span><span class="li-s">${fmtDay(w.date)} · ${fmt(w.dur,0)} мин${w.nsets?` · ${w.nsets} ${plural(w.nsets,['подход','подхода','подходов'])}`:''} · ${fmt(w.kcal,0)} ккал</span></span>${(w.prs||[]).length?`<span class="badge acc">${ic('trophy',14)} ${w.prs.length}</span>`:''}<span class="chev">${ic('right',18)}</span></button>`).join('')}</section>${W.length>15&&!ui.histAll?'<button class="btn ghost blk" data-a="histAll">Показать все</button>':''}`;
 return `<div class="col">${h}</div>`; }

/* ============ Листы ============ */
function sheet({title,sub='',left='back',right='',body,foot=''}){
 const lb=left==='back'?`<button class="ibtn" data-a="back" aria-label="Назад">${ic('back',20)}</button>`:left==='close'?`<button class="ibtn" data-a="back" aria-label="Закрыть">${ic('close',20)}</button>`:left==='down'?`<button class="ibtn" data-a="back" aria-label="Свернуть тренировку">${ic('down',20)}</button>`:'';
 return `<div class="sh" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh-head"><div class="sh-in">${lb}<div class="sh-t"><div class="sh-title">${esc(title)}</div>${sub?`<div class="sh-sub">${sub}</div>`:''}</div>${right}</div></div><div class="sh-body"><div class="sh-in col">${body}</div></div>${foot?`<div class="sh-foot"><div class="sh-in col-s">${foot}</div></div>`:''}</div>`; }
const SH={};
SH.onboard=()=>{ const o=ui.ob||(ui.ob={step:1,places:['gym','run'],days:4,tpl:null}); const P=S.profile; const steps=`<div class="steps" aria-label="Шаг ${o.step} из 3">${[1,2,3].map(i=>`<i class="${i<=o.step?'on':''}"></i>`).join('')}</div>`; let body='',foot='';
 if(o.step===1){ body=`${steps}<div><h1 class="h1">Ритм·Тело</h1><p class="lede">Подбирает рабочие веса и сам ведёт прогрессию. Сначала пара вопросов о вас.</p></div><section class="card col-s"><span class="lbl">Пол</span>${chipsHtml([['m','Мужской'],['f','Женский']],'sex',P.sex)}<div class="split">${stepper('Возраст',P.age,'age','')}${stepper('Рост, см',P.h,'h','')}</div>${stepper('Вес, кг',P.kg,'kg','',true)}</section><section class="card col-s"><span class="lbl">Опыт тренировок</span>${chipsHtml(Object.entries(LEVELS),'level',P.level)}</section>`; foot=`<button class="btn pri blk" data-a="obNext">Дальше</button>`; }
 else if(o.step===2){ body=`${steps}<h1 class="h1">Как тренируетесь</h1><section class="card col-s"><span class="lbl">Где — можно выбрать несколько</span>${chipsHtml(Object.entries(PLACES),'obPlace',o.places)}</section><section class="card col-s"><span class="lbl">Сколько дней в неделю</span>${chipsHtml([2,3,4,5,6].map(n=>[n,String(n)]),'obDays',o.days)}</section>`; foot=`<div class="split"><button class="btn sec" data-a="obPrev">Назад</button><button class="btn pri" data-a="obNext"${o.places.length?'':' disabled'}>Дальше</button></div>`; }
 else { const rec=recommendTpl(o); const sel=o.tpl||rec;
  body=`${steps}<h1 class="h1">Программа</h1><p class="lede">Рекомендуем «${esc(TEMPLATES.find(t=>t.key===rec).name)}». Расписание — ${o.days} ${plural(o.days,['день','дня','дней'])} в неделю, его можно поменять.</p>${TEMPLATES.map(t=>`<button class="tpl" data-a="obTpl" data-v="${t.key}" aria-pressed="${t.key===sel}"><span class="between"><span class="tpl-t">${esc(t.name)}</span>${t.key===rec?'<span class="badge acc">подходит вам</span>':''}</span><span class="note">${esc(t.desc)}</span><span class="note">${t.places.map(p=>PLACES[p]).join(' · ')} · блок ${t.weeks} ${plural(t.weeks,['неделя','недели','недель'])}</span></button>`).join('')}<div class="callout mut"><p>Стартовые веса — оценка по весу тела и опыту. На первой тренировке поправьте их под себя: дальше приложение будет считать от ваших результатов.</p></div>`;
  foot=`<div class="split"><button class="btn sec" data-a="obPrev">Назад</button><button class="btn acc" data-a="obFinish">Начать</button></div>`; }
 return sheet({title:'Знакомство',left:'',body,foot}); };
function recommendTpl(o){ const g=o.places.includes('gym'),r=o.places.includes('run'),hm=o.places.includes('home'); if(g&&!r&&o.days>=6) return 'ppl6'; if(g&&r) return 'hybrid4'; if(g) return o.days>=4?'ul4':'full3'; if(hm) return 'home3'; if(r) return 'run3'; return 'full3'; }
SH.templates=()=>{ const body=`<section class="card dark col-s"><span class="eyebrow">Своя программа</span><h3 class="dk-t">Собрать под себя за минуту</h3><p class="dk-s">Дни в неделю, деление, инвентарь и схема прогрессии — упражнения подберутся сами.</p><button class="btn acc blk" data-a="wzOpen">Собрать программу</button></section>`+TEMPLATES.filter(t=>t.key!=='custom').map(t=>`<section class="card col-s"><div class="between"><h3 class="h3">${esc(t.name)}</h3><span class="note">${t.schedule.length} ${plural(t.schedule.length,['день','дня','дней'])}/нед</span></div><p class="note">${esc(t.desc)}</p>${ui.confirm==='tpl:'+t.key?`<div class="confirm"><p>Текущая программа будет заменена. История и рабочие веса совпадающих упражнений сохранятся.</p><div class="split"><button class="btn danger" data-a="tplApply" data-v="${t.key}">Заменить</button><button class="btn sec" data-a="cancelConfirm">Отмена</button></div></div>`:`<button class="btn sec blk" data-a="tplPick" data-v="${t.key}">Выбрать</button>`}</section>`).join(''); return sheet({title:'Шаблоны программ',body}); };
SH.editor=()=>{ const p=S.program; if(!p) return sheet({title:'Конструктор',body:'<p class="note">Сначала выберите программу.</p>'});
 let b=(allItems(p).length?'':`<div class="callout acc"><p>Программа пустая. Быстрее собрать её мастером — потом всё можно поправить здесь.</p><button class="btn ghost" data-a="wzOpen">Собрать программу</button></div>`)+`<section class="card col-s"><label class="fld"><span class="lbl">Название</span><input class="inp" id="progName" type="text" value="${esc(p.name)}" data-c="progName"></label>${cycOn(p)?'':`${stepper('Недель в блоке',p.weeks,'weeks','')}<button class="chip self-start" data-a="deload" aria-pressed="${!!p.deload}">${p.deload?'✓ ':''}Последняя неделя — разгрузка</button>`}<span class="lbl">Дни тренировок</span><div class="chips">${WD.map((l,i)=>`<button class="chip" data-a="wd" data-v="${i}" aria-pressed="${p.schedule.includes(i)}">${l}</button>`).join('')}</div><p class="note">Тренировочные дни программы идут по кругу в отмеченные дни недели.</p></section>`+cycleEditor(p);
 b+=p.days.map((d,di)=>`<section class="card col-s"><label class="fld"><span class="lbl">День ${di+1}</span><input class="inp" id="dn-${d.id}" type="text" value="${esc(d.name)}" data-c="dayName" data-x="${d.id}"></label>${d.items.length?`<div class="list" style="padding:0;background:none">${d.items.map(it=>{ const e=EXI[it.ex]; return `<button class="li" data-a="push" data-s="item" data-id="${it.id}"><span class="li-m"><span class="li-t">${esc(e.n)}</span><span class="li-s">${esc(itemSummary(it))}</span></span><span class="chev">${ic('right',18)}</span></button>`; }).join('')}</div>`:'<p class="note">Пока нет упражнений.</p>'}<button class="btn sec blk" data-a="push" data-s="picker" data-m="add" data-id="${d.id}">${ic('plus',18)} Упражнение</button><div class="between"><div class="ord"><button class="btn ghost" data-a="dayMove" data-x="${d.id}" data-v="-1" aria-label="Поднять день"${di===0?' disabled':''}>${ic('up',18)}</button><button class="btn ghost" data-a="dayMove" data-x="${d.id}" data-v="1" aria-label="Опустить день"${di===p.days.length-1?' disabled':''}>${ic('dn',18)}</button></div>${ui.confirm==='day:'+d.id?`<div class="row"><button class="btn danger sm" data-a="dayDel" data-x="${d.id}">Удалить день</button><button class="btn sec sm" data-a="cancelConfirm">Отмена</button></div>`:`<button class="btn ghost danger-t" data-a="ask" data-v="day:${d.id}"${p.days.length<2?' disabled':''}>Удалить день</button>`}</div></section>`).join('');
 b+=`<button class="btn sec blk" data-a="addDay">${ic('plus',18)} Добавить день</button>`;
 return sheet({title:'Конструктор программы',body:b}); };
function cycleEditor(p){ const c=p.cycle; const on=cycOn(p);
 let h=`<section class="card col-s"><div class="between"><h2 class="sec-h">Цикл недель</h2><button class="chip" data-a="${on?'cycOff':'cycOn'}" aria-pressed="${on}">${on?'Включён':'Включить'}</button></div><p class="note">Каждая неделя цикла меняет подходы, повторы и вес относительно базы — в плюс или в минус. Внутри недели нагрузка одинаковая. После последней недели цикл начинается заново с обновлённой базой.</p>`;
 if(!on) return h+`</section>`;
 h+=`<span class="lbl">Готовые схемы</span><div class="chips">${Object.entries(CYCLES).map(([k,v])=>`<button class="chip" data-a="cycPreset" data-v="${k}" aria-pressed="${c.preset===k}">${v.n}</button>`).join('')}</div>`;
 h+=c.weeks.map((w,i)=>`<div class="wk-ed"><label class="fld"><span class="lbl">Неделя ${i+1}</span><input class="inp" id="cwn-${i}" type="text" value="${esc(w.name)}" data-c="cwName" data-x="${i}"></label>${weekFields(w,'cw',i,'cwRm','cwWm')}<div class="row wrap gap6"><button class="btn ghost sm" data-a="cwCopy" data-x="${i}">Копировать</button><button class="btn ghost sm" data-a="cwMove" data-x="${i}" data-v="-1" aria-label="Неделю выше"${i===0?' disabled':''}>${ic('up',16)}</button><button class="btn ghost sm" data-a="cwMove" data-x="${i}" data-v="1" aria-label="Неделю ниже"${i===c.weeks.length-1?' disabled':''}>${ic('dn',16)}</button><button class="btn ghost sm danger-t" data-a="cwDel" data-x="${i}"${c.weeks.length<2?' disabled':''}>Удалить</button></div></div>`).join('');
 h+=`<button class="btn sec blk" data-a="cwAdd">${ic('plus',18)} Неделя</button>`;
 const adv=p.advance||'sessions'; const ns=p.schedule.length;
 h+=`<span class="lbl">Неделя закрывается</span>${chipsHtml([['sessions',`После ${ns} ${plural(ns,['тренировки','тренировок','тренировок'])}`],['calendar','По календарю']],'cycAdv',adv)}<p class="note">${adv==='sessions'?'Пропустили день — неделя не сгорит: следующая начнётся после всех тренировок текущей.':'Неделя меняется каждые 7 дней, даже если были пропуски.'}</p>`;
 h+=`<span class="lbl">После цикла база</span>${chipsHtml(Object.entries(NEXT).map(([k,v])=>[k,v.n]),'cycRule',c.next)}<div class="callout acc"><p>${NEXT[c.next].d}</p></div>`;
 const ex=allItems(p).find(it=>it.rule==='cycle'&&!it.cyc&&EXI[it.ex].k==='w'); const own=ownItems(p).filter(it=>it.rule==='cycle');
 if(ex) h+=`<span class="lbl">Как пойдёт цикл: ${esc(EXI[ex.ex].n)}</span>${cyclePreview(ex,p)}`;
 h+=`<p class="note">У каждого упражнения можно задать свою схему по неделям — свой прирост подходов, повторов и веса — и выбрать, что из недели к нему применяется. Откройте упражнение в дне ниже.${own.length?` Своя схема сейчас у ${own.length} ${plural(own.length,['упражнения','упражнений','упражнений'])}: ${esc(own.map(it=>EXI[it.ex].n).join(', '))}.`:''}</p>`;
 return h+`</section>`; }
function itemSummary(it){ const e=EXI[it.ex]; if(e.k==='cardio') return `${it.mode==='dist'?fmt(it.base)+' км':it.base+' мин'} · +${it.grow}% в неделю`; if(e.k==='time') return `${it.sets} × ${it.st.secs||30} с · ${RULES.time.n}`; const reps=(it.rule==='double'||it.rule==='reps')?`${it.rmin}–${it.rmax}`:it.rule==='wave'?'8/6/4':(it.rule==='cycle'&&e.k==='bw')?(it.st.reps||it.rmin):it.rmin; let s=`${it.sets} × ${reps} · ${RULES[it.rule].n}${it.rule==='cycle'&&it.cyc?' (своя схема)':''}`; if(e.k==='w') s+=it.rule==='wave'?` · максимум ${fmt(it.st.tm,2)} кг`:` · ${fmt(it.st.w,2)} кг`; return s; }
SH.item=top=>{ const it=findItem(top.id); if(!it) return sheet({title:'Упражнение',body:'<p class="note">Упражнение удалено.</p>'}); const e=EXI[it.ex]; const d=dayOfItem(it.id); const x=it.id;
 let b=`<section class="card col-s"><span class="lbl">Упражнение</span><div class="between top-al"><button class="exn" data-a="openEx" data-id="${e.id}">${esc(e.n)}</button><button class="btn sec sm" data-a="push" data-s="picker" data-m="swap" data-id="${it.id}">Заменить</button></div><p class="note">${EQ[e.eq]} · ${PAT[e.p]}</p></section>`;
 if(e.k==='cardio'){ const p=S.program; const prev=Array.from({length:p.weeks},(_,i)=>{ const pl=planItem(it,{date:dkey(),week:i+1,weeks:p.weeks,deload:p.deload&&i+1===p.weeks,factor:1}); return `${i+1}: ${pl.mode==='dist'?fmt(pl.val):pl.val}`; }).join(' · ');
  b+=`<section class="card col-s"><span class="lbl">Что растёт</span>${chipsHtml([['dist','Дистанция'],['dur','Время']],'mode',it.mode,`data-x="${x}"`)}${stepper(it.mode==='dist'?'Старт, км':'Старт, мин',it.base,'it.base',x,it.mode==='dist')}<span class="lbl">Прибавка в неделю</span>${chipsHtml([0,5,8,10,15].map(v=>[v,v+'%']),'grow',it.grow,`data-x="${x}"`)}<p class="note">По неделям (${it.mode==='dist'?'км':'мин'}): ${prev}</p></section>`; }
 else { const cy=cycOn(S.program); const rules=e.k==='w'?(cy?['cycle','linear','double','wave','rpe']:['linear','double','wave','rpe']):e.k==='bw'?(cy?['cycle','reps']:['reps']):['time'];
  b+=`<section class="card col-s"><span class="lbl">Правило прогрессии</span>${chipsHtml(rules.map(r=>[r,RULES[r].n]),'rule',it.rule,`data-x="${x}"`)}<div class="callout acc"><p>${RULES[it.rule].d}</p></div></section>`;
  let f=stepper(it.rule==='cycle'?'Базовые подходы':'Подходов',it.sets,'it.sets',x);
  if(e.k==='time') f+=stepper('Секунд в подходе',it.st.secs||30,'it.secs',x);
  else if(it.rule==='cycle') f+=e.k==='bw'?stepper('Базовые повторы',it.st.reps||it.rmin,'it.breps',x):stepper('Базовые повторы',it.rmin,'it.rmin',x);
  else if(it.rule==='wave') f+=`<p class="note">Повторы задаёт неделя волны: 8 → 6 → 4.</p>`;
  else if(it.rule==='double'||it.rule==='reps') f=`${f}<div class="split">${stepper('Повторов от',it.rmin,'it.rmin',x)}${stepper('до',it.rmax,'it.rmax',x)}</div>`;
  else f+=stepper('Повторов',it.rmin,'it.rmin',x);
  b+=`<section class="card col-s">${f}</section>`;
  if(it.rule==='cycle'&&cy){ const p=S.program; const own=!!it.cyc; const cur=progWeek(p,dkey()).week;
   let cs=`<section class="card col-s"><h2 class="sec-h">Прирост по неделям</h2>${chipsHtml([['prog','Общая схема программы'],['own','Своя схема']],'iCyc',own?'own':'prog',`data-x="${x}"`)}<p class="note">${own?'Свои значения для каждой недели цикла. Названия и число недель — общие для программы.':'Упражнение идёт по общей схеме программы. Выберите «Своя схема», чтобы задать ему отдельный прирост.'}</p>`;
   if(own){ cs+=`<span class="lbl">Заполнить по готовой схеме</span><div class="chips">${Object.entries(CYCLES).map(([k,v])=>`<button class="chip" data-a="iPreset" data-x="${x}" data-v="${k}">${v.n}</button>`).join('')}<button class="chip" data-a="iPreset" data-x="${x}" data-v="prog">Как в программе</button></div>`;
    cs+=p.cycle.weeks.map((pw,i)=>`<div class="wk-ed"><div class="between"><span class="li-t">${i+1}. ${esc(pw.name)}</span>${i+1===cur?'<span class="badge acc">сейчас</span>':''}</div>${weekFields(it.cyc[i],'iw',x+'|'+i,'iwRm','iwWm')}</div>`).join(''); }

/* ============ Сила: рост, плато, регресс ============ */
function trendOf(exId,today=dkey()){ const s=seriesE1(exId).filter(p=>p.t>=addDays(today,-42)); if(s.length<4) return null; const span=dBetween(s[0].t,s[s.length-1].t); if(span<14) return null;
 const xs=s.map(p=>dBetween(s[0].t,p.t)/7), ys=s.map(p=>p.v); const n=xs.length, mx=sum(xs)/n, my=sum(ys)/n; let num=0,den=0; for(let i=0;i<n;i++){ num+=(xs[i]-mx)*(ys[i]-my); den+=(xs[i]-mx)**2; }
 const slope=den?num/den:0; const pct=slope/my*100; const best=Math.max(...ys), last=ys[n-1]; const drop=(last-best)/best*100;
 let st; if(drop<=-5) st='down'; else if(pct>.5) st='up'; else if(span>=21) st='flat'; else st='slow';
 return {st,pct,drop,last,best,n,span}; }
const TREND={up:['Растёт','good'],slow:['Медленно','mut'],flat:['Плато','warn'],down:['Регресс','bad']};
function sum(a){ return a.reduce((x,y)=>x+y,0); }
function plateauReasons(){ const out=[]; const t=dkey(); const P=S.profile;
 try{ const pit=JSON.parse(localStorage.getItem('ritm-pit-state-v1')||'null'), pb=JSON.parse(localStorage.getItem('ritm-pit-b-v1')||'null');
  if(pit&&pit.setup&&pb){ let kcal=0,prot=0,n=0; for(let i=1;i<=7;i++){ const k=addDays(t,-i); const b=pb[k.slice(0,7)]; const d=b&&b.days&&b.days[k]; if(d&&d.items&&d.items.length>=2){ n++; for(const it of d.items){ kcal+=it.kcal||0; prot+=it.p||0; } } }
   if(n>=3){ const pp=pit.profile||{}; const bmr=10*(pp.kg||P.kg)+6.25*(pp.h||P.h)-5*(pp.age||P.age)+((pp.sex||P.sex)==='f'?-161:5); const act={sit:1.2,light:1.375,mid:1.55,high:1.725}[pp.act]||1.2; const norm=bmr*act; const ak=kcal/n, ap=prot/n;
    if(ak<norm-300) out.push(`по «Питанию» вы едите в среднем на ${fmt(norm-ak,0)} ккал меньше обмена — при дефиците сила растёт медленно, это ожидаемо`);
    if(ap<1.4*(pp.kg||P.kg)) out.push(`белка в среднем ${fmt(ap,0)} г в день — для роста нужно около ${fmt(1.6*(pp.kg||P.kg),0)} г`); } } }catch(e){}
 const ck=Object.entries(S.checkins).filter(([k])=>k>=addDays(t,-7)); if(ck.length>=3&&ck.filter(([,c])=>c.sleep<=1).length>=ck.length/2) out.push('сон чаще меньше 6 часов — мышцы не успевают восстановиться');
 const p=S.program; if(p&&p.start&&dBetween(p.start,t)>=56) out.push(`программа идёт ${Math.floor(dBetween(p.start,t)/7)} недель — пора сменить упражнения или схему`);
 return out; }
function strengthCard(){ const L=liftsData().map(l=>({l,tr:trendOf(l.e.id)})).filter(x=>x.tr).slice(0,6); if(!L.length) return '';

/* ============ Предложение разгрузки ============ */
function fatigueSignals(today=dkey()){ const sig=[]; const lifts=liftsData().slice(0,6);
 for(const l of lifts){ const s=l.s.filter(p=>p.t>=addDays(today,-14)); if(s.length>=3){ const a=s[s.length-3].v,b=s[s.length-2].v,c=s[s.length-1].v; if(c<b&&b<a&&(c-a)/a<=-.03){ sig.push(`максимум в упражнении «${l.e.n.toLowerCase()}» падает две тренировки подряд (${fmt((c-a)/a*100,0)}%)`); break; } } }
 const ck=Object.entries(S.checkins).filter(([k])=>k>=addDays(today,-5)).map(([,c])=>c);
 if(ck.length>=3&&ck.filter(c=>c.sleep<=1).length>=3) sig.push('3 ночи из последних 5 — меньше 6 часов сна');
 if(ck.filter(c=>c.sore>=4).length>=2) sig.push('мышцы сильно болят второй день');
 if(ck.filter(c=>c.energy<=2).length>=3) sig.push('мало сил несколько дней подряд');
 const a=acr(today); if(a&&a.ratio>1.5) sig.push('нагрузка за неделю выросла в '+fmt(a.ratio,1)+' раза против обычной');
 const last=W.filter(w=>w.date>=addDays(today,-10)).slice(0,3); if(last.length>=3&&last.every(w=>(w.rpe||0)>=9)) sig.push('три последние тренировки — на пределе (тяжесть 9–10)');
 return sig; }
function deloadActive(date=dkey()){ const d=S.program&&S.program.forceDeload; return !!(d&&date>=d.from&&date<=d.to); }
function deloadCard(){ const t=dkey(); const p=S.program; if(!p||deloadActive(t)) return deloadActive(t)?`<section class="callout acc"><p><b>Разгрузочная неделя</b> до ${fmtDay(p.forceDeload.to)}: подходов вдвое меньше, веса −10%, без отказа.</p><button class="btn ghost" data-a="deloadStop">Закончить раньше</button></section>`:'';
 if(p.deloadSkip&&p.deloadSkip>=addDays(t,-6)) return ''; const wk=progWeek(p,t); if(wk.deload||(wk.cyc&&isRegress(wk.cyc))) return '';
 const s=fatigueSignals(t); if(s.length<2) return '';
 return `<section class="callout warn"><p class="b">Похоже на накопленную усталость</p><ul class="cues">${s.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p>Предлагаю разгрузочную неделю: вдвое меньше подходов и веса на 10% легче. Рабочие веса после неё не снизятся.</p><div class="row wrap gap6"><button class="btn pri sm" data-a="deloadGo">Разгрузиться неделю</button><button class="btn ghost sm" data-a="deloadSkipA" style="color:inherit">Не сейчас</button></div></section>`; }

function bodyFat(m,P=S.profile){ const lg=Math.log10; if(!m||!m.waist||!m.neck||!P.h) return null;
 if(P.sex==='f'){ if(!m.hips) return null; const v=495/(1.29579-.35004*lg(m.waist+m.hips-m.neck)+.221*lg(P.h))-450; return v>3&&v<60?v:null; }
 const v=495/(1.0324-.19077*lg(m.waist-m.neck)+.15456*lg(P.h))-450; return v>2&&v<60?v:null; }
function measCard(){ const L=[...(S.meas||[])].sort((a,b)=>a.date<b.date?-1:1); const last=L[L.length-1], first=L[0];
 const bf=last?bodyFat(last):null; const pts=L.map(m=>({t:m.date,v:bodyFat(m)})).filter(p=>p.v!=null).map(p=>({t:p.t,v:r1(p.v)}));

 if(!last) return h+`<p class="note">Обхваты показывают изменения, которых не видно на весах. Раз в 2–4 недели, утром, сантиметровой лентой. По талии и шее посчитаем процент жира (формула ВМС США).</p></section>`;
 h+=`<p class="note">${fmtDay(last.date)}${L.length>1?` · изменение с ${fmtDay(first.date)}`:''}</p><div class="kv">${MEAS.filter(([k])=>last[k]).map(([k,n])=>{ const d=L.length>1&&first[k]?last[k]-first[k]:null; return `<span>${n}</span><span>${fmt(last[k],1)} см${d?` <span class="${d<0?'good-t':'mut'}">${d>0?'+':'−'}${fmt(Math.abs(d),1)}</span>`:''}</span>`; }).join('')}${bf!=null?`<span><b>Жир, оценка</b></span><span><b>${fmt(bf,1)}%</b></span>`:''}</div>`;
 if(pts.length>=2) h+=chartSVG(pts,null,'%').replace(/data-a="cpt"/g,'data-a="noop"');
 if(bf==null) h+=`<p class="note">Для процента жира нужны талия и шея${S.profile.sex==='f'?' и бёдра':''}.</p>`;
 return h+`</section>`; }

 let b=`<p class="note">Утром, до еды, лента плотно, но без сдавливания. Талия — на уровне пупка, шея — под кадыком.</p><div class="split">${MEAS.map(([k,n])=>stepper(n+', см',m[k]||0,'mz.'+k,'',true)).join('')}</div>`;
 b+=bf!=null?`<div class="callout acc"><p>Процент жира: <b>${fmt(bf,1)}%</b> — оценка по формуле ВМС США, погрешность ±3–4%.</p></div>`:'';

const Native={
 ok(){ try{ return !!(window.RitmNative&&window.RitmNative.notifyAt); }catch(e){ return false; } },
 can(){ try{ return !!window.RitmNative.canNotify(); }catch(e){ return false; } },
 ask(){ try{ window.RitmNative.askNotify(); }catch(e){} },
 share(t,ti){ try{ return !!(window.RitmNative&&window.RitmNative.share&&window.RitmNative.share(t,ti)); }catch(e){ return false; } },
 canShare(){ try{ return !!(window.RitmNative&&window.RitmNative.share); }catch(e){ return false; } },
 list(p){ try{ const s=window.RitmNative.listNotify(p)||''; return s?s.split('\n'):[]; }catch(e){ return []; } },
 at(id,when,title,text){ try{ return !!window.RitmNative.notifyAt(id,when,title,text,'telo'); }catch(e){ return false; } },

};
function atTime(k,hm){ const [h,m]=(hm||'18:00').split(':').map(Number); const d=pkey(k); d.setHours(h||0,m||0,0,0); return d.getTime(); }
function teloReminders(){ const p=S.program; const st=S.settings||{}; if(!p||st.remind===false) return []; const out=[]; const t=dkey(); const n=p.days.length; let seq=p.seq||0;
 for(let i=0;i<8;i++){ const k=addDays(t,i); if(!p.schedule.includes(wdi(k))) continue; if(W.some(w=>w.date===k)){ continue; } const day=n?p.days[((seq%n)+n)%n]:null; seq++;
  if(!day||!day.items.length) continue; out.push({id:'w-'+k,at:atTime(k,st.remindTime||'18:00'),title:'Сегодня тренировка: '+day.name,text:day.items.slice(0,4).map(it=>EXI[it.ex].n).join(' · ')+(day.items.length>4?` и ещё ${day.items.length-4}`:'')}); }
 return out; }
let remT=null;
function syncReminders(){ clearTimeout(remT); remT=setTimeout(()=>{ if(!Native.ok()||!S.profile.done) return; const pre='telo:w-'; const want=teloReminders().filter(r=>r.at>Date.now()+30000);
  const ids=new Set(want.map(r=>'telo:'+r.id)); for(const id of Native.list(pre)) if(!ids.has(id)) Native.cancel(id); for(const r of want) Native.at('telo:'+r.id,r.at,r.title,r.text); },1200); }
function onAppPause(){ Store.flush(); const a=S.active; if(!Native.ok()||!a) return; const fx=focusOf(a); const en=fx&&a.ex[fx.ei]; const nx=en?`Следующий подход: ${EXI[en.ex].n}`:'Можно завершать тренировку';
 if(a.rest&&a.rest.end>Date.now()+3000) Native.at('telo:rest',a.rest.end,'Отдых окончен',nx);
 if(a.hold&&a.hold.start+a.hold.total*1000>Date.now()+3000) Native.at('telo:rest',a.hold.start+a.hold.total*1000,'Время вышло',nx); }
function onAppResume(){ if(Native.ok()) Native.cancel('telo:rest'); if(Store.changedOutside()){ Store.loadLocal(); if(!S.profile.done&&!ui.stack.some(s=>s.type==='onboard')) ui.stack=[{type:'onboard'}]; } render(); syncReminders(); if(S.active&&ui.stack.some(s=>s.type==='workout')) requestWake(); }
function remindSettings(){ const st=S.settings;
 if(!Native.ok()) return '';
 const can=Native.can();
 return `<section class="card col-s"><div class="between"><h2 class="sec-h">Напоминание о тренировке</h2><button class="chip" data-a="setTog" data-v="remind" aria-pressed="${st.remind!==false}">${st.remind!==false?'Включено':'Выключено'}</button></div>${st.remind!==false?`${can?'':`<div class="callout warn"><p>Телефон не разрешает уведомления Ритма.</p><button class="btn ghost" data-a="remAsk">Разрешить</button></div>`}<p class="note">В дни по расписанию, если тренировки ещё не было. Конец отдыха тоже придёт уведомлением, если свернуть приложение.</p><div class="chips">${['07:00','08:00','12:00','17:00','18:00','19:00','20:00'].map(t=>`<button class="chip" data-a="remTime" data-v="${t}" aria-pressed="${(st.remindTime||'18:00')===t}">${t}</button>`).join('')}</div>`:''}</section>`; }

/* ============ Звук и вибрация ============ */
let AC=null;
function audioUnlock(){ try{ if(!AC){ const Ctor=window.AudioContext||window.webkitAudioContext; if(Ctor) AC=new Ctor(); } if(AC&&AC.state==='suspended') AC.resume(); }catch(e){} }
function beep(f,dur,vol,delay){ if(!AC||!S.settings.sound) return; try{ const t=AC.currentTime+(delay||0); const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.3,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.05); }catch(e){} }
function signal(kind){ Player.duck();
 if(kind==='tick') beep(660,.1,.25); else if(kind==='warn'){ beep(740,.12,.25); beep(740,.12,.25,.2); } else if(kind==='go') beep(988,.35,.35); else if(kind==='rest') beep(523,.35,.3); else { beep(880,.14,.3); beep(1109,.14,.3,.17); beep(1319,.4,.35,.34); }
 vibrate(kind==='tick'?25:kind==='warn'?[60,60,60]:kind==='done'?[150,90,150,90,250]:180); }
function setTxt(sel,t){ document.querySelectorAll(sel).forEach(x=>{ if(x.textContent!==t) x.textContent=t; }); }
function timerSettings(){ return `<section class="card col-s"><h2 class="sec-h">Таймеры и звук</h2><div class="chips">${[['sound','Звук'],['vib','Вибрация'],['warn10','Сигнал за 10 с до конца отдыха'],['autoRest','Отдых запускается сам'],['duck','Приглушать музыку на сигналах']].map(([k,l])=>`<button class="chip" data-a="setTog" data-v="${k}" aria-pressed="${!!S.settings[k]}">${l}</button>`).join('')}</div><button class="btn sec self-start" data-a="testSound">Проверить звук</button><p class="note">В конце отдыха и интервалов — сигнал и вибрация, за 3 секунды — короткий отсчёт.</p></section>`; }

const CIRC_H=2*Math.PI*70;
function holdUI(x){ const h=S.active&&S.active.hold, now=Date.now(); const pre=!h||now<h.start; const left=h?(pre?Math.ceil((h.start-now)/1000):Math.max(0,h.total-(now-h.start)/1000)):3; const off=h&&!pre?(CIRC_H*(1-left/h.total)).toFixed(1):0;
 return `<div class="seted hold"><div class="tm-ring-w sm"><svg class="tm-ring" viewBox="0 0 160 160" aria-hidden="true"><circle cx="80" cy="80" r="70" class="rt"/><circle cx="80" cy="80" r="70" class="rv" data-hold-ring stroke-dasharray="${CIRC_H.toFixed(1)}" style="stroke-dashoffset:${off}" transform="rotate(-90 80 80)"/></svg><div class="tm-c"><span class="tm-phase" data-hold-l>${pre?'Приготовьтесь':'Держите'}</span><span class="tm-big sm" data-hold-t>${pre?left:fmtDur(left)}</span></div></div><div class="split" style="width:100%"><button class="btn acc" data-a="holdStop">Готово</button><button class="btn sec" data-a="holdCancel">Отмена</button></div></div>`; }
function holdTick(a,now){ const h=a.hold;
 if(now<h.start){ const L=Math.ceil((h.start-now)/1000); if(h.lb!==L){ h.lb=L; signal('tick'); } setTxt('[data-hold-t]',String(L)); setTxt('[data-hold-l]','Приготовьтесь'); return; }
 if(!h.go){ h.go=true; signal('go'); }
 const left=h.total-(now-h.start)/1000;
 if(left<=0){ const x=h.x; a.hold=null; const [ei,si]=x.split(':').map(Number); const s=a.ex[ei]&&a.ex[ei].sets[si]; if(s&&!s.done){ s.s=h.total; signal('done'); A.setDone({x}); } else render(); return; }
 const L=Math.ceil(left); if(L<=3&&h.lb2!==L){ h.lb2=L; signal('tick'); }
 setTxt('[data-hold-t]',fmtDur(left)); setTxt('[data-hold-l]','Держите'); const r=document.querySelector('[data-hold-ring]'); if(r) r.style.strokeDashoffset=(CIRC_H*(1-left/h.total)).toFixed(1); }

/* ============ Интервальный таймер и секундомер ============ */
const TMODES={int:'Интервалы',tabata:'Табата',emom:'EMOM',stop:'Секундомер'};
const TM={run:false,paused:false,phase:'idle',round:0,end:0,total:0,left:0,lb:null,swStart:0,swAcc:0,laps:[]};
const TM_C=2*Math.PI*98;
function tmCfg(){ const t=S.timer; if(t.mode==='tabata') return {work:20,rest:10,rounds:8,prep:t.prep}; if(t.mode==='emom') return {work:t.emomLen,rest:0,rounds:t.emomN,prep:t.prep}; return {work:t.work,rest:t.rest,rounds:t.rounds,prep:t.prep}; }
function tmTotal(){ const c=tmCfg(); return c.prep+c.rounds*c.work+Math.max(0,c.rounds-1)*c.rest; }
function tmPhase(ph,dur){ TM.phase=ph; TM.total=dur; TM.end=Date.now()+dur*1000; TM.lb=null; }
function swNow(){ return TM.swAcc+(TM.run&&!TM.paused?Date.now()-TM.swStart:0); }
function fmtSW(ms){ const t=Math.max(0,ms); const s=Math.floor(t/1000); return fmtDur(s)+','+Math.floor(t%1000/100); }
function tmNext(){ const c=tmCfg();
 if(TM.phase==='prep'){ tmPhase('work',c.work); signal('go'); }
 else if(TM.phase==='work'){ if(TM.round>=c.rounds){ TM.run=false; TM.phase='done'; signal('done'); } else if(c.rest>0){ tmPhase('rest',c.rest); signal('rest'); } else { TM.round++; tmPhase('work',c.work); signal('go'); } }
 else if(TM.phase==='rest'){ TM.round++; tmPhase('work',c.work); signal('go'); }
 const t=topSheet(); if(t&&t.type==='timer') render(); }

 if(!TM.run||TM.paused) return; const left=(TM.end-Date.now())/1000; if(left<=0){ tmNext(); return; }
 const L=Math.ceil(left); if(L<=3&&TM.lb!==L){ TM.lb=L; signal('tick'); }
 setTxt('[data-tm-time]',fmtDur(left)); const r=document.querySelector('[data-tm-ring]'); if(r) r.style.strokeDashoffset=(TM_C*(1-left/TM.total)).toFixed(1); }

 const ph=TM.run?TM.phase:(TM.phase==='done'?'done':'idle'); const PH={idle:'Готов',prep:'Приготовьтесь',work:'Работа',rest:'Отдых',done:'Готово!'};
 const left=TM.run?(TM.paused?TM.left:Math.max(0,(TM.end-Date.now())/1000)):(ph==='done'?0:tmTotal()); const frac=TM.run&&TM.total?(1-left/TM.total):(ph==='done'?1:0);
 b+=`<section class="card tm-face ph-${ph}"><div class="tm-ring-w"><svg class="tm-ring" viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="98" class="rt"/><circle cx="110" cy="110" r="98" class="rv" data-tm-ring stroke-dasharray="${TM_C.toFixed(1)}" style="stroke-dashoffset:${(TM_C*frac).toFixed(1)}" transform="rotate(-90 110 110)"/></svg><div class="tm-c"><span class="tm-phase">${PH[ph]}</span><span class="tm-big" data-tm-time>${fmtDur(left)}</span><span class="tm-round">${TM.run||ph==='done'?`Раунд ${Math.min(TM.round,c.rounds)} из ${c.rounds}`:`${c.rounds} × (${c.work} с${c.rest?' + '+c.rest+' с':''})`}</span></div></div></section>`;
 if(!TM.run) b+=`<button class="btn acc blk big" data-a="tmGo">${ic('play',20)} Старт</button>${ph==='done'?'<button class="btn ghost blk" data-a="tmReset">Сбросить</button>':''}`;
 else b+=`<div class="split">${TM.paused?'<button class="btn acc big" data-a="tmGo">Продолжить</button>':'<button class="btn pri big" data-a="tmPause">Пауза</button>'}<button class="btn sec big" data-a="tmSkip">Дальше ${ic('right',18)}</button></div><button class="btn ghost blk danger-t" data-a="tmReset">Остановить</button>`;
 if(!TM.run){ let f='';

 dayName:(d,t)=>{ const day=S.program.days.find(x=>x.id===d.x); const v=t.value.trim(); if(day&&v) day.name=v.slice(0,40); Store.save(); },
 cdist:(d,t)=>{ const c=S.active.ex[+d.x].cardio; const v=parseNum(t.value); c.dist=v!=null?clamp(r2(v),0,500):null; commit(); },
 cmin:(d,t)=>{ const c=S.active.ex[+d.x].cardio; const v=parseNum(t.value); c.min=v!=null?clamp(Math.round(v),0,1440):0; commit(); },
 csec:(d,t)=>{ const c=S.active.ex[+d.x].cardio; const v=parseNum(t.value); c.sec=v!=null?clamp(Math.round(v),0,59):0; commit(); },
 music:async (d,t)=>{ const fs=[...(t.files||[])].filter(f=>(f.type||'').startsWith('audio/')||/\.(mp3|m4a|aac|ogg|opus|wav|flac)$/i.test(f.name)); t.value=''; if(!fs.length){ toast('Выберите аудиофайлы'); return; }
  let ok=0; for(const f of fs){ try{ await MusicDB.add({id:'t'+uid(),name:f.name.replace(/\.[^.]+$/,'').slice(0,80),size:f.size,type:f.type,added:Date.now()+ok,blob:f}); ok++; }catch(e){} }
  await Player.load(); toast(ok?`Добавлено: ${ok} ${plural(ok,['трек','трека','треков'])}`:'Не удалось сохранить — мало места или хранилище недоступно'); render(); }
};
const I={
 libq:(d,t)=>{ ui.libq=t.value; const el=document.getElementById('libList'); if(el) el.innerHTML=libList(); },
 pkq:(d,t)=>{ ui.pkq=t.value; const el=document.getElementById('pkList'); if(el) el.innerHTML=pickList(topSheet()); },
 bkin:(d,t)=>{ ui.bkText=t.value; }
};
function tick(){ tmTick(); const a=S.active; if(!a) return; const now=Date.now(); setTxt('[data-elapsed]',fmtDur((now-a.start)/1000)); if(a.hold) holdTick(a,now);
 if(a.rest){ const left=(a.rest.end-now)/1000; if(left<=0){ a.rest=null; a.lastAt=now; Store.save(); signal('done'); toast('Отдых окончен — следующий подход'); const t=topSheet(); if(t&&(t.type==='workout'||t.type==='clock')) render(); return; }
  const L=Math.ceil(left); if(S.settings.warn10&&a.rest.total>15&&L===10&&!a.rest.w10){ a.rest.w10=true; signal('warn'); } if(L<=3&&a.rest.lb!==L){ a.rest.lb=L; signal('tick'); }
  setTxt('[data-rest]',fmtDur(left)); setTxt('[data-clock-main]',fmtDur(left)); const r=document.querySelector('[data-restring]'); if(r) r.style.strokeDashoffset=(100.5*(1-left/a.rest.total)).toFixed(1); }
 else setTxt('[data-clock-main]',fmtDur((now-(a.lastAt||a.start))/1000)); }

/* ============ Запуск ============ */
function boot(){
 document.addEventListener('click',e=>{ const t=e.target.closest('[data-a]'); if(!t||t.disabled) return; const fn=A[t.dataset.a]; if(fn){ e.preventDefault(); fn(t.dataset,t,e); } });
 document.addEventListener('change',e=>{ const t=e.target.closest('[data-c]'); if(t&&C[t.dataset.c]) C[t.dataset.c](t.dataset,t); });
 document.addEventListener('input',e=>{ const t=e.target.closest('[data-i]'); if(t&&I[t.dataset.i]) I[t.dataset.i](t.dataset,t); });
 document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.matches&&e.target.matches('input[data-c]')) e.target.blur(); });
 document.addEventListener('pointerover',e=>{ if(e.pointerType!=='mouse') return; const t=e.target.closest&&e.target.closest('[data-a="cpt"]'); if(t) A.cpt(t.dataset); });
 document.addEventListener('visibilitychange',()=>{ if(document.hidden) Store.flush(); else onAppResume(); });
 window.addEventListener('ritm-resume',onAppResume); window.addEventListener('ritm-pause',onAppPause);
 if(HIST) window.addEventListener('popstate',onPop);
 setInterval(tick,250);
 document.addEventListener('click',audioUnlock,true); document.addEventListener('touchstart',audioUnlock,{capture:true,passive:true});
 Player.load().then(()=>{ if(Player.list.length) render(); });
 Store.loadLocal(); ui.booting=!S.profile.done; render();
 const done=()=>{ syncReminders(); if(S.program&&rollCycles(S.program)) Store.save(); if(!ui.booting&&S.profile.done&&!ui.stack.some(s=>s.type==='onboard')){ render(); return; } ui.booting=false; if(!S.profile.done){ if(!ui.stack.some(s=>s.type==='onboard')) ui.stack=[{type:'onboard'}]; } else ui.stack=ui.stack.filter(s=>s.type!=='onboard'); render(); };
 const fallback=setTimeout(()=>{ if(ui.booting) done(); },2500);
 Store.init().then(()=>{ clearTimeout(fallback); done(); }).catch(()=>{ clearTimeout(fallback); done(); });
}
if(typeof document!=='undefined'&&document.getElementById&&document.getElementById('view')) boot();
</script>
